[package]
name = "b10x-substrate-kubernetes"
description = "The substrate Kubernetes namespace driver: workspaces on PVCs and execs as Pods in one claimed namespace"
homepage = "https://beyond10x.github.io/substrate/"
documentation = "https://beyond10x.github.io/substrate/docs/guides/deployment"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
keywords = ["sandbox", "kubernetes", "execution"]
categories = ["api-bindings"]

[lib]
name = "substrate_kubernetes"

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
substrate-executor = { package = "b10x-substrate-executor", path = "../substrate-executor", version = "=0.16.1" }
substrate-guarded = { package = "b10x-substrate-guarded", path = "../substrate-guarded", version = "=0.16.1" }
substrate-host = { package = "b10x-substrate-host", path = "../substrate-host", version = "=0.16.1" }
substrate-kubernetes-client = { package = "b10x-substrate-kubernetes-client", path = "../substrate-kubernetes-client", version = "=0.16.1" }
substrate-wire = { package = "b10x-substrate-wire", path = "../substrate-wire", version = "=0.16.1" }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
substrate-kubernetes-client = { package = "b10x-substrate-kubernetes-client", path = "../substrate-kubernetes-client", version = "=0.16.1", features = ["fake"] }
tempfile.workspace = true

[lints]
workspace = true
