[package]
name = "substrate-daemon"
description = "Standalone substrate HTTP daemon"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
name = "substrate_daemon"

[[bin]]
name = "substrate-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nix.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
subtle.workspace = true
substrate-host = { path = "../substrate-host" }
substrate-store = { path = "../substrate-store" }
substrate-wire = { path = "../substrate-wire" }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The clean-room runner (tests/runtime_vectors.rs) interrupts the daemon it spawned; `signal`
# is a test-only feature of the `nix` dependency this crate already carries.
nix = { workspace = true, features = ["signal"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
