[package]
name = "b10x-substrate-daemon"
description = "Standalone substrate HTTP daemon"
homepage = "https://beyond10x.github.io/substrate/"
documentation = "https://docs.rs/b10x-substrate-daemon"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = true
keywords = ["sandbox", "daemon", "execution", "workspace"]
categories = ["command-line-utilities"]

[lib]
name = "substrate_daemon"

[[bin]]
name = "substrate-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nix = { workspace = true, features = ["signal"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
subtle.workspace = true
substrate-host = { package = "b10x-substrate-host", path = "../substrate-host", version = "=0.4.2" }
substrate-store = { package = "b10x-substrate-store", path = "../substrate-store", version = "=0.4.2" }
substrate-wire = { package = "b10x-substrate-wire", path = "../substrate-wire", version = "=0.4.2" }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The clean-room runner (tests/runtime_vectors.rs) interrupts the daemon it spawned; `signal`
# is a test-only feature of the `nix` dependency this crate already carries.
hex.workspace = true
nix = { workspace = true, features = ["signal"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
