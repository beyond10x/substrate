[package]
name = "b10x-substrate-sdk"
description = "Typed Rust client and managed-daemon launcher for b10x Substrate"
homepage = "https://beyond10x.github.io/substrate/"
documentation = "https://beyond10x.github.io/substrate/docs/guides/rust-sdk"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
keywords = ["sandbox", "sdk", "execution", "workspace"]
categories = ["api-bindings", "asynchronous"]

[features]
default = []
linked-daemon = ["dep:substrate-daemon"]

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nix = { workspace = true, features = ["process", "signal", "user"] }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
substrate-daemon = { package = "b10x-substrate-daemon", path = "../substrate-daemon", version = "=0.7.3", optional = true }
substrate-wire = { package = "b10x-substrate-wire", path = "../substrate-wire", version = "=0.7.3" }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
ulid.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[lints]
workspace = true
