[package]
name = "b10x-substrate-executor"
description = "The static executor the substrate Kubernetes namespace driver runs in its keeper and exec Pods"
homepage = "https://beyond10x.github.io/substrate/"
documentation = "https://beyond10x.github.io/substrate/docs/guides/deployment"
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
keywords = ["sandbox", "kubernetes", "linux"]
categories = ["os::linux-apis"]

[lib]
name = "substrate_executor"

[[bin]]
name = "substrate-executor"
path = "src/main.rs"

[dependencies]
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
substrate-guarded = { package = "b10x-substrate-guarded", path = "../substrate-guarded", version = "=0.18.0" }
substrate-wire = { package = "b10x-substrate-wire", path = "../substrate-wire", version = "=0.18.0" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
