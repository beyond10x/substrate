domain: substrate.host_processes
summary: >-
  Supervised host processes: long-lived processes and containers a session starts through the
  daemon, each with an owner, a reason, a lease or a reasoned keep, one cgroup, observations and a
  bounded log. Specified by ADR 0036 (accepted 2026-10-17).
# Source: ADR 0036 (adr/0036-host-processes-are-a-supervised-resource-family.md), S1-S9, S11 and
# S12. Each point the ADR left open is settled by the wave decision of 2026-10-17 (approval record
# wave-2026-10-17-adopt-hostproc, "Spec points design 26 left unmapped") and marked here as
# `DECIDED (point n)`, modelled where ESS 0.60.0 can state it. Points 3, 10, 11 and 12 concern the
# S8 container and S9 adoption records: those declarations stay drafted and are marked
# `DEFERRED (point n)`; they are decided in the S8/S9 wave and nothing built in this wave commits
# to them.
types:
  - name: substrate.host_processes.ConfinementProfile
    kind: enum
    # S2: the one profile this family admits. Requested explicitly; never a default.
    variants: [host]
  - name: substrate.host_processes.Confinement
    kind: enum
    # S2: a host process is declared and reported unconfined.
    variants: [none]
  - name: substrate.host_processes.EndedBy
    kind: enum
    # S3, S11: why a record left its live states. `vanished` is a record whose cgroup was gone
    # when the daemon reconciled it.
    variants: [exit, stop, lease-expiry, timeout, expires-at, vanished]
  - name: substrate.host_processes.Deadline
    kind: enum
    # S11: which hard deadline a deadline stop enforced.
    variants: [timeout, expires-at]
  - name: substrate.host_processes.ContainerKind
    kind: enum
    # S8, deferred to the S8 wave: the two container record kinds.
    variants: [docker, k3d]
  - name: substrate.host_processes.RestartPolicy
    kind: enum
    # S8, deferred to the S8 wave: a container record is started with --restart=no and nothing else.
    variants: ["no"]
  - name: substrate.host_processes.AdoptSource
    kind: enum
    # S9, deferred to the S9 wave: what an adopted record was picked up from.
    variants: [pid, unit, container]

  - name: substrate.host_processes.EnvDigest
    kind: newtype
    of: String
    # S1: the digest of the whole request environment map, `sha256:` and the hex digest. The
    # canonical byte form it is computed over is the daemon's; values never leave the request.
    prefix: "sha256:"

  - name: substrate.host_processes.StreamEventKind
    kind: enum
    # S12: what a stream item says: the record started, one output line, or the terminal item
    # naming `ended_by`. A lease expiry or a deadline is not an item of its own; it is the
    # `ended_by` of the terminal item.
    variants: [started, output-line, ended]

entities:
  - name: substrate.host_processes.HostProcess
    naming:
      summary: One supervised process tree (or container) in its own cgroup under the daemon's delegated root.
    identity: {name: process, type: String}
    fields:
      - {name: name, type: String}
      # S1: the owner session. Absent only on an adopted record (S9).
      - {name: owner_session_id, type: Optional<String>}
      - {name: owner_session_name, type: Optional<String>}
      - {name: reason, type: String}
      - {name: argv, type: List<String>}
      # Absent on a container record, which has no host working directory.
      - {name: cwd, type: Optional<String>}
      # S1: the names of the request's `env` map, which is the process's complete environment (the
      # client selects what it passes through); never their values.
      - {name: env_passthrough, type: List<String>}
      # S1: the ledger records each name above and one digest of the whole env map, never a value.
      # Computed by the daemon from the request it received, so the value is generated. Absent on a
      # container or adopted record (deferred with point 3).
      - {name: env_digest, type: Optional<substrate.host_processes.EnvDigest>}
      # S2: requested profile and the reported confinement. Absent on container and adopted records.
      # DEFERRED (point 3): the profile and confinement of a container (S8) or adopted (S9) record
      # are decided in the S8/S9 wave; until then neither record sets them, and nothing built in
      # this wave commits to an answer.
      - {name: profile, type: Optional<substrate.host_processes.ConfinementProfile>}
      - {name: confinement, type: Optional<substrate.host_processes.Confinement>}
      # S4: a lease (renewable TTL) or a keep (no TTL, with a reason); never both, never neither,
      # except on an adopted record.
      - {name: lease_ttl_ms, type: Optional<Integer>}
      # DECIDED (point 4): the daemon computes the expiry as the start or renewal instant plus the
      # TTL. ESS 0.60.0 cannot add a duration to an instant in `sets:` (an offset is admitted only
      # on the right of a comparison), so the value is generated: it is an observation of the
      # daemon's arithmetic and commits no format.
      - {name: lease_expires_at, type: Optional<Timestamp>}
      - {name: keep, type: Boolean}
      - {name: keep_reason, type: Optional<String>}
      # S11: hard wall-clock bounds, separate from the lease. Either, both or neither; with both,
      # the earlier wins. Neither moves after start.
      - {name: timeout_ms, type: Optional<Integer>}
      - {name: expires_at, type: Optional<Timestamp>}
      # S11, S6: the effective deadline, one absolute instant recorded at start: started_at plus
      # timeout_ms, or expires_at, whichever is earlier. Implementation-side: ESS 0.60.0 cannot add
      # a duration to an instant in `sets:` nor take the earlier of two instants, so the value is
      # generated and the daemon computes it. Which field set it is the `deadline` an
      # EnforceDeadline names.
      - {name: deadline_at, type: Optional<Timestamp>}
      - {name: started_at, type: Timestamp}
      # S3, S11: exactly one cause once the record leaves its live states; the first one recorded
      # stands and a later one never overwrites it.
      - {name: ended_by, type: Optional<substrate.host_processes.EndedBy>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
      # S6: observed from the cgroup. Absent until the first observation.
      # memory_bytes is the cgroup's memory.current, not RSS: it includes page cache.
      - {name: cpu_usec, type: Optional<Integer>}
      - {name: memory_bytes, type: Optional<Integer>}
      - {name: listening_ports, type: List<Integer>}
      # S7: oldest log bytes discarded at the byte bound, cumulative; 0 until the first discard.
      - {name: log_discarded_bytes, type: Integer}
      # S8, deferred to the S8 wave: present only on a container record.
      - {name: container_kind, type: Optional<substrate.host_processes.ContainerKind>}
      - {name: restart, type: Optional<substrate.host_processes.RestartPolicy>}
      # S9, deferred to the S9 wave: present only on an adopted record.
      - {name: adopted_from, type: Optional<substrate.host_processes.AdoptSource>}
      - {name: adopted_ref, type: Optional<String>}
    relations:
      # S12: a stream event has no meaning without its record.
      # DECIDED (point 5): there is no removal operation. Ended records are retained for a bounded
      # time and count (ADR 0036 S7) and their stream goes with them, which `owns` states. The
      # retention sweep is time-driven, which ESS 0.60.0 cannot model, so it is the daemon's; a
      # removal command is additive.
      - {name: events, kind: owns, target: substrate.host_processes.ProcessEvent, cardinality: many, via: process}
    # Lifecycle: the plan's starting/running/stopping/exited/expired. Expiry, timeout, deadline,
    # stop, exit and a vanished cgroup all end in Ended; ended_by says which.
    lifecycle:
      initial: Starting
      states: [Starting, Running, Stopping, Ended]
      terminal: [Ended]
      transitions:
        # The supervisor saw the cgroup populated.
        - {name: run, from: [Starting], to: Running}
        # S3: a stop of any cause kills the whole cgroup; the record waits in Stopping until it is empty.
        - {name: request_stop, from: [Starting, Running], to: Stopping}
        # The cgroup is empty: the process tree is gone.
        - {name: end, from: [Starting, Running, Stopping], to: Ended}

  - name: substrate.host_processes.ProcessEvent
    naming:
      summary: S12 — one event in a record's stream, ordered by its cursor.
    identity: {name: event, type: String}
    fields:
      - {name: process, type: String}
      - {name: cursor, type: Integer}
      - {name: kind, type: substrate.host_processes.StreamEventKind}
      - {name: line, type: Optional<String>}
      # S12: present on the terminal `ended` item only.
      - {name: ended_by, type: Optional<substrate.host_processes.EndedBy>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

errors:
  - name: substrate.host_processes.ArgvEmpty
    summary: argv holds no element.
    fields: []
  - name: substrate.host_processes.CwdNotAbsolute
    summary: cwd is not an absolute path.
    fields: [{name: cwd, type: String}]
  - name: substrate.host_processes.ProfileNotRequested
    summary: The host profile was not requested explicitly; this family has no default profile.
    fields: []
  - name: substrate.host_processes.HostProfileRefused
    summary: The daemon serves a hosted or static-bearer TCP posture, where the host profile is never admitted.
    fields: []
  - name: substrate.host_processes.OwnerRequired
    summary: The owner session id or name is absent.
    fields: []
  - name: substrate.host_processes.LeaseRequired
    summary: Neither a lease nor a keep was requested.
    fields: []
  - name: substrate.host_processes.KeepNeedsReason
    summary: A keep was requested without a keep reason.
    fields: []
  - name: substrate.host_processes.KeepHasNoLease
    summary: A keep and a lease were requested together; a keep has no TTL.
    fields: []
  - name: substrate.host_processes.LeaseNotPositive
    summary: The lease TTL is not a positive number of milliseconds.
    fields: [{name: lease_ttl_ms, type: Optional<Integer>}]
  - name: substrate.host_processes.TimeoutNotPositive
    summary: The timeout is not a positive number of milliseconds.
    fields: [{name: timeout_ms, type: Optional<Integer>}]
  - name: substrate.host_processes.DeadlinePast
    summary: The requested expires_at is not in the future.
    fields: []

  - name: substrate.host_processes.NameConflict
    summary: A non-terminal record of the same owner session already carries this name.
    fields: [{name: name, type: String}]

  - name: substrate.host_processes.UnknownProcess
    summary: No record carries this process.
    fields: []
  - name: substrate.host_processes.NotLive
    summary: The record is not in a state this command acts from, so nothing changed.
    fields: [{name: state, type: Optional<substrate.host_processes.HostProcess.State>}]
  - name: substrate.host_processes.NoLease
    summary: The record holds no lease to renew or expire (an adopted record, or a keep for expiry).
    fields: []
  - name: substrate.host_processes.NoDeadline
    summary: The record carries no deadline of the kind named.
    fields: []

  - name: substrate.host_processes.AdoptSourceEmpty
    summary: The pid, unit or container reference is empty.
    fields: []
  - name: substrate.host_processes.AdoptSourceAbsent
    summary: Nothing on the host carries the named pid, unit or container.
    fields: []

  - name: substrate.host_processes.OutputLineMissing
    summary: An output-line event carries no line.
    fields: []
  - name: substrate.host_processes.EndedByMissing
    summary: An ended item names no ended_by; the terminal item always names exactly one.
    fields: []
  - name: substrate.host_processes.LogDiscardNotGrowing
    summary: The reported cumulative discarded byte count is not above the recorded one.
    fields: []
  - name: substrate.host_processes.StreamClosed
    summary: The stream already holds its terminal ended item.
    fields: []

# DECIDED (point 6): the subject is the only authority (ADR 0036 S5). The owner session is a label
# on the record beneath the subject, never an actor, so any session of one subject may renew, stop
# or read another session's records; narrowing that to the owner session later is additive. The
# supervisor commands are the daemon's own actor (ADR 0036 S4: an operation the daemon originates),
# which no caller holds.
# The subject partition itself is not modelled: the subject is `local:<uid>` from kernel peer
# credentials, and the model describes the records of one subject, as `spec/domains/operations.yaml`
# does. A caller attribute could carry it (`{caller: subject}`), but an ESS 0.60.0 authored
# scenario act carries no caller values, so every authored scenario here would be refused
# (ESS-AUTHOR-014); the per-subject scoping of reads, stops and stop by owner is the daemon's, and
# its cross-subject cases belong to the daemon's runtime suite.
actors:
  - name: substrate.host_processes.Subject
    naming:
      display: Subject
      summary: The authenticated local subject; the only authority over its records.
    may:
      - substrate.host_processes.StartProcess
      - substrate.host_processes.StartContainer
      - substrate.host_processes.AdoptProcess
      - substrate.host_processes.RenewLease
      - substrate.host_processes.StopProcess
      - substrate.host_processes.StopByOwner
      - substrate.host_processes.HostProcesses
      - substrate.host_processes.ProcessEvents
      - substrate.host_processes.ProcessLogs
  - name: substrate.host_processes.Supervisor
    naming:
      display: Supervisor
      summary: The daemon's own actor; it reports what it observed and originates expiry and deadline stops.
    may:
      - substrate.host_processes.ConfirmRunning
      - substrate.host_processes.ExpireLease
      - substrate.host_processes.EnforceDeadline
      - substrate.host_processes.RecordExit
      - substrate.host_processes.RecordVanished
      - substrate.host_processes.RecordObservation
      - substrate.host_processes.RecordLogDiscard
      - substrate.host_processes.AppendStreamEvent

commands:
  - name: substrate.host_processes.StartProcess
    naming:
      wire: start
      summary: S1, S2, S4, S11 — start a host process under the host profile with an owner, a reason and a lease or keep.
    input:
      - {name: name, type: String, example: dev-server}
      - {name: owner_session_id, type: Optional<String>, example: s-1}
      - {name: owner_session_name, type: Optional<String>, example: worker}
      - {name: reason, type: String, example: serve the preview}
      - {name: argv, type: List<String>}
      - {name: cwd, type: String, example: /srv/app}
      - {name: env_passthrough, type: List<String>}
      - {name: profile, type: Optional<substrate.host_processes.ConfinementProfile>, example: host}
      - {name: lease_ttl_ms, type: Optional<Integer>, example: 3600000}
      - {name: keep, type: Boolean, example: false}
      - {name: keep_reason, type: Optional<String>}
      - {name: timeout_ms, type: Optional<Integer>}
      - {name: expires_at, type: Optional<Timestamp>}
    outcomes:
      - name: owner-absent
        when: {any: [not defined(owner_session_id), not defined(owner_session_name)]}
        error: substrate.host_processes.OwnerRequired
      - name: argv-empty
        when: argv.count == 0
        error: substrate.host_processes.ArgvEmpty
      - name: cwd-not-absolute
        when: {not: {cwd: {starts_with: "/"}}}
        error: substrate.host_processes.CwdNotAbsolute
        payload:
          substrate.host_processes.CwdNotAbsolute: {cwd: input.cwd}
      - name: profile-not-requested
        when: not defined(profile)
        error: substrate.host_processes.ProfileNotRequested
      - name: keep-without-reason
        when: {all: [keep == true, not defined(keep_reason)]}
        error: substrate.host_processes.KeepNeedsReason
      - name: keep-with-lease
        when: {all: [keep == true, defined(lease_ttl_ms)]}
        error: substrate.host_processes.KeepHasNoLease
      - name: lease-missing
        when: {all: [keep == false, not defined(lease_ttl_ms)]}
        error: substrate.host_processes.LeaseRequired
      - name: lease-not-positive
        when: {all: [defined(lease_ttl_ms), lease_ttl_ms <= 0]}
        error: substrate.host_processes.LeaseNotPositive
        payload:
          substrate.host_processes.LeaseNotPositive: {lease_ttl_ms: input.lease_ttl_ms}
      # S11: a timeout and an expires_at together are admitted; the earlier wins (`deadline_at`).
      # The upper bound MAX_PROCESS_TIMEOUT_MS and the MIN_LEASE_TTL_MS margin on expires_at are
      # wire constants of the successor bundle; ESS 0.60.0 declares no constants, so those two
      # bounds are the daemon's and this model refuses only zero, negative and past values.
      - name: timeout-not-positive
        when: {all: [defined(timeout_ms), timeout_ms <= 0]}
        error: substrate.host_processes.TimeoutNotPositive
        payload:
          substrate.host_processes.TimeoutNotPositive: {timeout_ms: input.timeout_ms}
      - name: deadline-past
        when: {all: [defined(expires_at), expires_at <= now]}
        error: substrate.host_processes.DeadlinePast
      # DECIDED (point 7): the name is unique among the subject's non-terminal records of the same
      # owner session (ADR 0036 S1, `process.name-conflict`). A record that has ended frees its
      # name, and records are addressed by `process`, never by name.
      - name: name-conflict
        when_related:
          entity: substrate.host_processes.HostProcess
          where:
            all:
              - owner_session_id == input.owner_session_id
              - name == input.name
              - {state: [Starting, Running, Stopping]}
          exists: true
        error: substrate.host_processes.NameConflict
        payload:
          substrate.host_processes.NameConflict: {name: input.name}
      - name: hosted-posture
        external: the daemon serves a hosted or static-bearer TCP posture, which never admits the host profile
        error: substrate.host_processes.HostProfileRefused
      - name: started
        creates: substrate.host_processes.HostProcess
        instance: process
        sets:
          name: input.name
          owner_session_id: input.owner_session_id
          owner_session_name: input.owner_session_name
          reason: input.reason
          argv: input.argv
          cwd: input.cwd
          env_passthrough: input.env_passthrough
          env_digest: {generated: true}
          profile: input.profile
          confinement: none
          lease_ttl_ms: input.lease_ttl_ms
          lease_expires_at: {generated: true}
          keep: input.keep
          keep_reason: input.keep_reason
          timeout_ms: input.timeout_ms
          expires_at: input.expires_at
          deadline_at: {generated: true}
          started_at: {generated: true}
          # Empty until the first observation; ESS admits no list literal in `sets:`, so the
          # implementation supplies the empty list.
          listening_ports: {generated: true}
          log_discarded_bytes: 0
        emits: [substrate.host_processes.ProcessStarted]
        payload:
          substrate.host_processes.ProcessStarted:
            process: {generated: true}
            name: input.name
            owner_session_id: input.owner_session_id
            reason: input.reason

  - name: substrate.host_processes.ConfirmRunning
    naming:
      wire: confirm-running
      summary: The supervisor saw the process's cgroup populated.
    input: [{name: process, type: String}]
    outcomes:
      - name: running
        moves: substrate.host_processes.HostProcess.run
        instance: process
        emits: [substrate.host_processes.ProcessRunning]
        payload:
          substrate.host_processes.ProcessRunning: {process: input.process}
      - name: not-starting
        wrong_state: true
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.RenewLease
    naming:
      wire: renew
      summary: S4 — renew a live record's lease, or change a keep to a TTL lease. The S11 deadline does not move.
    # S4: a lease may be renewed, or changed from `keep` to a TTL, but never changed to `keep` after
    # start. The input carries only a TTL, so a renewal that asks for `keep` is not a request this
    # command admits. An adopted record holds neither a lease nor a keep and stays NoLease.
    # The MIN_LEASE_TTL_MS..MAX_LEASE_TTL_MS bounds are wire constants of the successor bundle;
    # ESS 0.60.0 declares no constants, so this model refuses only a TTL that is not positive.
    input:
      - {name: process, type: String}
      - {name: lease_ttl_ms, type: Integer}
    outcomes:
      - name: lease-not-positive
        when: lease_ttl_ms <= 0
        error: substrate.host_processes.LeaseNotPositive
        payload:
          substrate.host_processes.LeaseNotPositive: {lease_ttl_ms: input.lease_ttl_ms}
      - name: not-live
        when_subject: {predicate: {state: [Stopping, Ended]}}
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: no-lease
        when_subject: {predicate: {all: [keep == false, not defined(lease_ttl_ms)]}}
        error: substrate.host_processes.NoLease
      - name: keep-to-lease
        when_subject: {predicate: keep == true}
        updates: substrate.host_processes.HostProcess
        instance: process
        sets:
          keep: false
          keep_reason: {cleared: true}
          lease_ttl_ms: input.lease_ttl_ms
          lease_expires_at: {generated: true}
        emits: [substrate.host_processes.LeaseRenewed]
        payload:
          substrate.host_processes.LeaseRenewed: {process: input.process, lease_ttl_ms: input.lease_ttl_ms}
      - name: renewed
        updates: substrate.host_processes.HostProcess
        instance: process
        sets:
          lease_ttl_ms: input.lease_ttl_ms
          lease_expires_at: {generated: true}
        emits: [substrate.host_processes.LeaseRenewed]
        payload:
          substrate.host_processes.LeaseRenewed: {process: input.process, lease_ttl_ms: input.lease_ttl_ms}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.StopProcess
    naming:
      wire: stop
      summary: S3 — stop one record; the whole cgroup is killed.
    input: [{name: process, type: String}]
    outcomes:
      - name: stopping
        moves: substrate.host_processes.HostProcess.request_stop
        instance: process
        sets: {ended_by: stop}
        emits: [substrate.host_processes.StopRequested]
        payload:
          substrate.host_processes.StopRequested: {process: input.process, ended_by: stop}
      - name: not-live
        wrong_state: true
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.ExpireLease
    naming:
      wire: expire-lease
      summary: S4 — the supervisor found the lease past its expiry; the record stops.
    # DECIDED (point 8): the daemon's supervisor clock invokes this command when lease_expires_at
    # has passed. ESS 0.60.0 has no clock-driven transition, and lease_expires_at is generated
    # (point 4), so the instant comparison is the implementation's, not this guard's.
    input: [{name: process, type: String}]
    outcomes:
      - name: no-lease
        when_subject: {predicate: not defined(lease_ttl_ms)}
        error: substrate.host_processes.NoLease
      - name: expired
        moves: substrate.host_processes.HostProcess.request_stop
        instance: process
        sets: {ended_by: lease-expiry}
        emits: [substrate.host_processes.StopRequested]
        payload:
          substrate.host_processes.StopRequested: {process: input.process, ended_by: lease-expiry}
      - name: not-live
        wrong_state: true
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.EnforceDeadline
    naming:
      wire: enforce-deadline
      summary: S11 — the supervisor reached the effective hard deadline; the record stops.
    # DECIDED (point 9): the same supervisor clock invokes this command when `deadline_at` is
    # reached, and names which field set it. With both a timeout and an expires_at, the earlier one
    # is the deadline (S11); ESS 0.60.0 can neither compute started_at plus timeout_ms nor take the
    # earlier of two instants, and has no clock-driven transition, so choosing the deadline and the
    # trigger are implementation-side. The model refuses a named deadline the record does not carry.
    input:
      - {name: process, type: String}
      - {name: deadline, type: substrate.host_processes.Deadline, example: timeout}
    outcomes:
      - name: no-deadline
        when_subject:
          predicate:
            any:
              - {all: [input.deadline == timeout, not defined(timeout_ms)]}
              - {all: [input.deadline == expires-at, not defined(expires_at)]}
        error: substrate.host_processes.NoDeadline
      - name: timed-out
        when: deadline == timeout
        moves: substrate.host_processes.HostProcess.request_stop
        instance: process
        sets: {ended_by: timeout}
        emits: [substrate.host_processes.StopRequested]
        payload:
          substrate.host_processes.StopRequested: {process: input.process, ended_by: timeout}
      - name: expires-at-reached
        moves: substrate.host_processes.HostProcess.request_stop
        instance: process
        sets: {ended_by: expires-at}
        emits: [substrate.host_processes.StopRequested]
        payload:
          substrate.host_processes.StopRequested: {process: input.process, ended_by: expires-at}
      - name: not-live
        wrong_state: true
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.RecordExit
    naming:
      wire: record-exit
      summary: S3 — the cgroup is empty; the record ends with its exit status.
    input:
      - {name: process, type: String}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
    outcomes:
      - name: exited
        when_subject_state: [Starting, Running]
        moves: substrate.host_processes.HostProcess.end
        instance: process
        sets: {ended_by: exit, exit_code: input.exit_code, exit_signal: input.exit_signal}
        emits: [substrate.host_processes.ProcessEnded]
        payload:
          substrate.host_processes.ProcessEnded: {process: input.process, ended_by: exit, exit_code: input.exit_code, exit_signal: input.exit_signal}
      - name: stopped
        # The cause set when the stop was requested stands.
        when_subject_state: Stopping
        moves: substrate.host_processes.HostProcess.end
        instance: process
        sets: {exit_code: input.exit_code, exit_signal: input.exit_signal}
        emits: [substrate.host_processes.ProcessEnded]
        payload:
          substrate.host_processes.ProcessEnded: {process: input.process, ended_by: {subject: ended_by}, exit_code: input.exit_code, exit_signal: input.exit_signal}
      - name: ended
        error: substrate.host_processes.NotLive
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.RecordVanished
    naming:
      wire: record-vanished
      summary: S3 — on restart the daemon found a non-terminal record's cgroup gone; the record ends with no exit status.
    # S3: a record whose cgroup is gone on reconciliation ends `vanished`, never `running` and never
    # with an exit status nobody observed. A record already Stopping keeps the cause its stop
    # recorded first (S11): a later cause never overwrites it.
    input: [{name: process, type: String}]
    outcomes:
      - name: vanished
        when_subject_state: [Starting, Running]
        moves: substrate.host_processes.HostProcess.end
        instance: process
        sets: {ended_by: vanished}
        emits: [substrate.host_processes.ProcessEnded]
        payload:
          substrate.host_processes.ProcessEnded: {process: input.process, ended_by: vanished, exit_code: {subject: exit_code}, exit_signal: {subject: exit_signal}}
      - name: vanished-while-stopping
        when_subject_state: Stopping
        moves: substrate.host_processes.HostProcess.end
        instance: process
        emits: [substrate.host_processes.ProcessEnded]
        payload:
          substrate.host_processes.ProcessEnded: {process: input.process, ended_by: {subject: ended_by}, exit_code: {subject: exit_code}, exit_signal: {subject: exit_signal}}
      - name: ended
        error: substrate.host_processes.NotLive
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.StopByOwner
    naming:
      wire: stop-by-owner
      summary: S5 — the session-end stop; stops that owner's live records, kept ones too unless except_keep is true.
    input:
      - {name: owner_session_id, type: String, example: s-1}
      # S5: `{ "except_keep": true }` leaves records held under `keep` running. Absent or false,
      # kept records are stopped by owner too.
      - {name: except_keep, type: Optional<Boolean>, example: true}
    outcomes:
      # Only live rows move: request_stop starts from Starting and Running. A filter cannot read
      # `state` (unobservable_fact), so the move's `from:` is what bounds it.
      - name: stopping-except-keep
        when: {all: [defined(except_keep), except_keep == true]}
        moves: substrate.host_processes.HostProcess.request_stop
        instances:
          where:
            all:
              - owner_session_id == input.owner_session_id
              - keep == false
        sets: {ended_by: stop}
        emits: [substrate.host_processes.OwnerStopped]
        payload:
          substrate.host_processes.OwnerStopped: {owner_session_id: input.owner_session_id, stopped: {count: changed}}
      - name: stopping
        moves: substrate.host_processes.HostProcess.request_stop
        instances:
          where: owner_session_id == input.owner_session_id
        sets: {ended_by: stop}
        emits: [substrate.host_processes.OwnerStopped]
        payload:
          substrate.host_processes.OwnerStopped: {owner_session_id: input.owner_session_id, stopped: {count: changed}}

  - name: substrate.host_processes.AdoptProcess
    naming:
      wire: adopt
      summary: S9, deferred to the S9 wave — import an existing pid, unit or container as an ownerless record.
    # DEFERRED (point 10): S9 is not built in this wave. How an adopted record is supervised
    # (cgroup move or `process.adopt-unmovable`, its lease, where argv and cwd come from for a unit
    # or container) is brought back before S9 is built if no undoable option exists. The draft
    # below stays as it was: Running at once, no owner, no lease, no keep, argv and cwd read by the
    # daemon. Nothing in this wave implements it.
    input:
      - {name: name, type: String, example: legacy-vite}
      - {name: reason, type: String, example: survivor of the host review}
      - {name: source, type: substrate.host_processes.AdoptSource, example: pid}
      - {name: source_ref, type: String, example: "4242"}
    outcomes:
      - name: source-ref-empty
        when: source_ref == ""
        error: substrate.host_processes.AdoptSourceEmpty
      - name: hosted-posture
        external: the daemon serves a hosted or static-bearer TCP posture, which never admits a host record
        error: substrate.host_processes.HostProfileRefused
      - name: source-gone
        external: nothing on the host carries the named pid, unit or container
        error: substrate.host_processes.AdoptSourceAbsent
      - name: adopted
        creates: substrate.host_processes.HostProcess
        into: Running
        instance: process
        sets:
          name: input.name
          reason: input.reason
          argv: {generated: true}
          cwd: {generated: true}
          env_passthrough: {generated: true}
          keep: false
          started_at: {generated: true}
          listening_ports: {generated: true}
          log_discarded_bytes: 0
          adopted_from: input.source
          adopted_ref: input.source_ref
        emits: [substrate.host_processes.ProcessAdopted]
        payload:
          substrate.host_processes.ProcessAdopted:
            process: {generated: true}
            name: input.name
            source: input.source
            source_ref: input.source_ref

  - name: substrate.host_processes.StartContainer
    naming:
      wire: start-container
      summary: S8, deferred to the S8 wave — start a docker container or k3d cluster with --restart=no and owner/lease labels.
    # DEFERRED (S8 wave): S8 is not built in this wave; this declaration stays drafted.
    # DEFERRED (point 11): the container carries the three labels ADR 0036 S8 names (the record
    # id, the owner and the lease's renew-by) under Substrate's label prefix. Label bytes are not
    # ESS facts; the record carries the same values as fields, and the keys are fixed in the S8 wave.
    # DEFERRED (point 12): a container record takes no timeout and no expires_at; adding one is
    # additive.
    input:
      - {name: name, type: String, example: preview-db}
      - {name: owner_session_id, type: Optional<String>, example: s-1}
      - {name: owner_session_name, type: Optional<String>, example: worker}
      - {name: reason, type: String, example: database for the preview}
      - {name: kind, type: substrate.host_processes.ContainerKind, example: docker}
      - {name: argv, type: List<String>}
      - {name: lease_ttl_ms, type: Optional<Integer>, example: 3600000}
      - {name: keep, type: Boolean, example: false}
      - {name: keep_reason, type: Optional<String>}
    outcomes:
      - name: owner-absent
        when: {any: [not defined(owner_session_id), not defined(owner_session_name)]}
        error: substrate.host_processes.OwnerRequired
      - name: argv-empty
        when: argv.count == 0
        error: substrate.host_processes.ArgvEmpty
      - name: keep-without-reason
        when: {all: [keep == true, not defined(keep_reason)]}
        error: substrate.host_processes.KeepNeedsReason
      - name: keep-with-lease
        when: {all: [keep == true, defined(lease_ttl_ms)]}
        error: substrate.host_processes.KeepHasNoLease
      - name: lease-missing
        when: {all: [keep == false, not defined(lease_ttl_ms)]}
        error: substrate.host_processes.LeaseRequired
      - name: lease-not-positive
        when: {all: [defined(lease_ttl_ms), lease_ttl_ms <= 0]}
        error: substrate.host_processes.LeaseNotPositive
        payload:
          substrate.host_processes.LeaseNotPositive: {lease_ttl_ms: input.lease_ttl_ms}
      - name: hosted-posture
        external: the daemon serves a hosted or static-bearer TCP posture, which never admits a host record
        error: substrate.host_processes.HostProfileRefused
      - name: started
        creates: substrate.host_processes.HostProcess
        instance: process
        sets:
          name: input.name
          owner_session_id: input.owner_session_id
          owner_session_name: input.owner_session_name
          reason: input.reason
          argv: input.argv
          env_passthrough: {generated: true}
          lease_ttl_ms: input.lease_ttl_ms
          lease_expires_at: {generated: true}
          keep: input.keep
          keep_reason: input.keep_reason
          started_at: {generated: true}
          listening_ports: {generated: true}
          log_discarded_bytes: 0
          container_kind: input.kind
          restart: "no"
        emits: [substrate.host_processes.ProcessStarted]
        payload:
          substrate.host_processes.ProcessStarted:
            process: {generated: true}
            name: input.name
            owner_session_id: input.owner_session_id
            reason: input.reason

  - name: substrate.host_processes.RecordObservation
    naming:
      wire: record-observation
      summary: S6 — the supervisor's observation of the cgroup's CPU, memory (memory.current) and listening sockets.
    # DECIDED (point 13): CPU is cumulative microseconds read from the cgroup at observation time,
    # as exec usage reports; there is no background sampling, so no cadence. Sampling is additive.
    input:
      - {name: process, type: String}
      - {name: cpu_usec, type: Integer}
      - {name: memory_bytes, type: Integer}
      - {name: listening_ports, type: List<Integer>}
    outcomes:
      - name: not-running
        when_subject: {predicate: {state: [Starting, Stopping, Ended]}}
        error: substrate.host_processes.NotLive
        payload:
          substrate.host_processes.NotLive: {state: {subject: state}}
      - name: observed
        updates: substrate.host_processes.HostProcess
        instance: process
        sets: {cpu_usec: input.cpu_usec, memory_bytes: input.memory_bytes, listening_ports: input.listening_ports}
        emits: [substrate.host_processes.ProcessObserved]
        payload:
          substrate.host_processes.ProcessObserved: {process: input.process, cpu_usec: input.cpu_usec, memory_bytes: input.memory_bytes, listening_ports: input.listening_ports}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

  - name: substrate.host_processes.AppendStreamEvent
    naming:
      wire: append-stream-event
      summary: S12, S7 — the supervisor appends one event to a record's stream; output lines come from the bounded log.
    # DECIDED (point 14): the log bound is in bytes; at the bound the oldest bytes are discarded
    # and the record states how many (RecordLogDiscard, `log_discarded_bytes`). The log file format
    # stays internal, so which lines the discarded bytes held is not modelled here. The bound's
    # value is one wire constant of the successor bundle that carries this family; ESS 0.60.0
    # declares no constants, so the value is not stated in this model.
    # DECIDED (point 15): an append for a process no record carries is refused inside the daemon
    # (unknown-process). No caller holds this command, so the refusal is not on the wire.
    input:
      - {name: process, type: String, example: p-1}
      - {name: kind, type: substrate.host_processes.StreamEventKind, example: output-line}
      - {name: line, type: Optional<String>, example: listening on 5173}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
      - {name: ended_by, type: Optional<substrate.host_processes.EndedBy>}
    outcomes:
      - name: line-missing
        when: {all: [kind == output-line, not defined(line)]}
        error: substrate.host_processes.OutputLineMissing
      - name: ended-by-missing
        when: {all: [kind == ended, not defined(ended_by)]}
        error: substrate.host_processes.EndedByMissing
      - name: unknown-process
        when_related:
          entity: substrate.host_processes.HostProcess
          where: process == input.process
          exists: false
        error: substrate.host_processes.UnknownProcess
      - name: stream-closed
        # `ended` is the terminal item: nothing follows it in a stream.
        when_related:
          entity: substrate.host_processes.ProcessEvent
          where: {all: [process == input.process, kind == ended]}
          exists: true
        error: substrate.host_processes.StreamClosed
      - name: appended
        creates: substrate.host_processes.ProcessEvent
        instance: event
        sets:
          process: input.process
          kind: input.kind
          line: input.line
          exit_code: input.exit_code
          exit_signal: input.exit_signal
          ended_by: input.ended_by
          # DECIDED (point 16): the daemon assigns the cursor, the per-process `seq`, strictly
          # increasing; on the wire the cursor is opaque. ESS 0.60.0 cannot state monotonicity of a
          # generated value, so it is implementation-side, and the ordering scenarios
          # (stream-order, `ranked`) check it.
          cursor: {generated: true}
        emits: [substrate.host_processes.StreamEventAppended]
        payload:
          substrate.host_processes.StreamEventAppended:
            event: {generated: true}
            process: input.process
            kind: input.kind

  - name: substrate.host_processes.RecordLogDiscard
    naming:
      wire: record-log-discard
      summary: S7 — the log reached its byte bound; the supervisor discards the oldest output and records how many bytes it has discarded in all.
    input:
      - {name: process, type: String, example: p-1}
      # The record's cumulative discarded byte count after this discard.
      - {name: discarded_bytes, type: Integer, example: 4096}
    outcomes:
      - name: discard-not-growing
        when_subject: {predicate: input.discarded_bytes <= log_discarded_bytes}
        error: substrate.host_processes.LogDiscardNotGrowing
      - name: discarded
        updates: substrate.host_processes.HostProcess
        instance: process
        sets: {log_discarded_bytes: input.discarded_bytes}
        emits: [substrate.host_processes.LogDiscarded]
        payload:
          substrate.host_processes.LogDiscarded: {process: input.process, discarded_bytes: input.discarded_bytes}
      - name: unknown
        unknown_instance: true
        error: substrate.host_processes.UnknownProcess

events:
  - name: substrate.host_processes.ProcessStarted
    fields:
      - {name: process, type: String}
      - {name: name, type: String}
      - {name: owner_session_id, type: Optional<String>}
      - {name: reason, type: String}
  - name: substrate.host_processes.ProcessRunning
    fields: [{name: process, type: String}]
  - name: substrate.host_processes.StopRequested
    fields:
      - {name: process, type: String}
      - {name: ended_by, type: substrate.host_processes.EndedBy}
  - name: substrate.host_processes.LeaseRenewed
    fields:
      - {name: process, type: String}
      - {name: lease_ttl_ms, type: Integer}
  - name: substrate.host_processes.ProcessEnded
    fields:
      - {name: process, type: String}
      - {name: ended_by, type: substrate.host_processes.EndedBy}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}

  - name: substrate.host_processes.OwnerStopped
    fields:
      - {name: owner_session_id, type: String}
      - {name: stopped, type: Integer}
  - name: substrate.host_processes.ProcessAdopted
    fields:
      - {name: process, type: String}
      - {name: name, type: String}
      - {name: source, type: substrate.host_processes.AdoptSource}
      - {name: source_ref, type: String}

  - name: substrate.host_processes.ProcessObserved
    fields:
      - {name: process, type: String}
      - {name: cpu_usec, type: Integer}
      - {name: memory_bytes, type: Integer}
      - {name: listening_ports, type: List<Integer>}

  - name: substrate.host_processes.LogDiscarded
    fields:
      - {name: process, type: String}
      - {name: discarded_bytes, type: Integer}

  - name: substrate.host_processes.StreamEventAppended
    fields:
      - {name: event, type: String}
      - {name: process, type: String}
      - {name: kind, type: substrate.host_processes.StreamEventKind}

views:
  # S6: `ls`. Unfiltered so every state and every published field is observable.
  - name: substrate.host_processes.HostProcesses
    source: substrate.host_processes.HostProcess
    consistency: read_your_writes
    naming: {wire: list}
    fields:
      - {name: process, type: String}
      - {name: name, type: String}
      - {name: state, type: substrate.host_processes.HostProcess.State}
      - {name: owner_session_id, type: Optional<String>}
      - {name: owner_session_name, type: Optional<String>}
      - {name: reason, type: String}
      - {name: cwd, type: Optional<String>}
      - {name: argv, type: List<String>}
      - {name: env_passthrough, type: List<String>}
      - {name: env_digest, type: Optional<substrate.host_processes.EnvDigest>}
      - {name: profile, type: Optional<substrate.host_processes.ConfinementProfile>}
      - {name: confinement, type: Optional<substrate.host_processes.Confinement>}
      - {name: started_at, type: Timestamp}
      - {name: lease_ttl_ms, type: Optional<Integer>}
      - {name: lease_expires_at, type: Optional<Timestamp>}
      - {name: keep, type: Boolean}
      - {name: keep_reason, type: Optional<String>}
      - {name: timeout_ms, type: Optional<Integer>}
      - {name: expires_at, type: Optional<Timestamp>}
      - {name: deadline_at, type: Optional<Timestamp>}
      - {name: ended_by, type: Optional<substrate.host_processes.EndedBy>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
      - {name: cpu_usec, type: Optional<Integer>}
      - {name: memory_bytes, type: Optional<Integer>}
      - {name: listening_ports, type: List<Integer>}
      - {name: log_discarded_bytes, type: Integer}
      - {name: container_kind, type: Optional<substrate.host_processes.ContainerKind>}
      - {name: restart, type: Optional<substrate.host_processes.RestartPolicy>}
      - {name: adopted_from, type: Optional<substrate.host_processes.AdoptSource>}
      - {name: adopted_ref, type: Optional<String>}

  # S12: one record's event stream after a cursor, oldest first.
  - name: substrate.host_processes.ProcessEvents
    source: substrate.host_processes.ProcessEvent
    consistency: read_your_writes
    naming: {wire: events}
    params:
      - {name: process, type: String}
      - {name: after, type: Integer}
    filter: {all: [process == param.process, cursor > param.after]}
    order_by: [cursor]
    fields:
      - {name: event, type: String}
      - {name: process, type: String}
      - {name: cursor, type: Integer}
      - {name: kind, type: substrate.host_processes.StreamEventKind}
      - {name: line, type: Optional<String>}
      - {name: exit_code, type: Optional<Integer>}
      - {name: exit_signal, type: Optional<String>}
      - {name: ended_by, type: Optional<substrate.host_processes.EndedBy>}

  # S7: `logs <name>`, the output lines of one record, a bounded page at a time.
  - name: substrate.host_processes.ProcessLogs
    source: substrate.host_processes.ProcessEvent
    consistency: read_your_writes
    naming: {wire: logs}
    params:
      - {name: process, type: String}
      - {name: page, type: Integer}
      - {name: size, type: Integer}
    filter: {all: [process == param.process, kind == output-line]}
    order_by: [cursor]
    paging: {page: page, size: size}
    fields:
      - {name: cursor, type: Integer}
      - {name: line, type: Optional<String>}
