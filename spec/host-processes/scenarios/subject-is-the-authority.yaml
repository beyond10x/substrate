# Point 6 of the wave decision, ADR 0036 S5: the subject is the only authority over its records.
# The client commands are the subject's; the supervisor commands are the daemon's own actor, so a
# subject cannot report a record running and the supervisor cannot stop one on a caller's behalf.
# The owner session is a label on the record, not an actor.
type: ess-scenario/4
domain: substrate.host_processes
scenario: subject-is-the-authority
summary: The subject starts and stops its record; a supervisor command sent as the subject, and a subject command sent as the supervisor, are refused as not granted.

arrange:
  - instance: dev
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    actor: substrate.host_processes.Subject
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: serve the preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_seconds: 3600, keep: false}
    outcome: started
    capture: {instance: dev, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    actor: substrate.host_processes.Subject
    input: {process: {$instance: dev}}
    refused: not_granted
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.StopProcess
    actor: substrate.host_processes.Supervisor
    input: {process: {$instance: dev}}
    refused: not_granted
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.StopProcess
    actor: substrate.host_processes.Subject
    input: {process: {$instance: dev}}
    outcome: stopping

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: dev}, state: Stopping, end_cause: stopped}
