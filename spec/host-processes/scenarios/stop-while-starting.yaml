# S3, S5: a stop accepted while the record is still Starting moves it to Stopping. The dispatch
# that follows never makes it Running, and the record ends only on the supervisor's report that the
# cgroup is empty, with the cause the stop recorded.
type: ess-scenario/1
domain: substrate.host_processes
scenario: stop-while-starting
summary: A stop of a starting record holds it Stopping; it never runs, and ends stop once the cgroup is empty.

arrange:
  - instance: dev
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: serve the preview, env_passthrough: [], argv: [vite], cwd: /srv/app, profile: host, lease_ttl_ms: 60000, keep: false}
    outcome: started
    capture: {instance: dev, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.StopByOwner
    input: {owner_session_id: s-1}
    outcome: stopping
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: dev}}
    outcome: not-starting
    error: {name: substrate.host_processes.NotLive}
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: dev}, exit_signal: SIGTERM}
    outcome: stopped

assert:
  - view: substrate.host_processes.HostProcesses
    contains:
      process: {$instance: dev}
      state: Ended
      ended_by: stop
      exit_signal: SIGTERM
