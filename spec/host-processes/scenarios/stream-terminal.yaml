# S12: `ended` is terminal and names ended_by; a timed-out record's stream holds started,
# timed-out, stopped once the tree is gone, then ended with ended_by timeout, and nothing is
# appended after it.
type: ess-scenario/1
domain: substrate.host_processes
scenario: stream-terminal
summary: A timed-out record's stream holds started, timed-out, stopped and one ended item naming timeout; an append after it is refused.

arrange:
  - instance: build
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: build, owner_session_id: s-1, owner_session_name: worker, reason: test run, argv: [cargo, test], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false, timeout_ms: 600000}
    outcome: started
    capture: {instance: build, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: build}}
    outcome: running
  - at: 2026-10-16T09:10:00Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: build}, deadline: timeout}
    outcome: timed-out
  - at: 2026-10-16T09:10:01Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: build}, exit_signal: SIGKILL}
    outcome: stopped
  - at: 2026-10-16T09:10:02Z
    command: substrate.host_processes.AppendStreamEvent
    input: {process: {$instance: build}, kind: output-line, line: late}
    outcome: stream-closed
    error: {name: substrate.host_processes.StreamClosed}

assert:
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: build}, after: -1}
    counts: {at_least: 4, at_most: 4}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: build}, after: -1}
    at: {row: first, fields: {kind: started}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: build}, after: -1}
    at: {row: 1, fields: {kind: timed-out, ended_by: timeout}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: build}, after: -1}
    at: {row: 2, fields: {kind: stopped, ended_by: timeout, exit_signal: SIGKILL}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: build}, after: -1}
    at: {row: last, fields: {kind: ended, ended_by: timeout, exit_signal: SIGKILL}}
