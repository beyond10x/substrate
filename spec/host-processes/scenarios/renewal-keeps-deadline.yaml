# S11: renewing the lease moves the lease and never the hard deadline; the deadline still fires.
type: ess-scenario/1
domain: substrate.host_processes
scenario: renewal-keeps-deadline
summary: A lease renewal changes the lease and leaves the timeout and expires_at as started; the deadline still stops the record.

arrange:
  - instance: build
    entity: substrate.host_processes.HostProcess
  - instance: until
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: serve the preview, env_passthrough: [], argv: [cargo, test], cwd: /srv/app, profile: host, lease_ttl_seconds: 600, keep: false, timeout_seconds: 3600}
    outcome: started
    capture: {instance: build, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.StartProcess
    input: {name: soak, owner_session_id: s-1, owner_session_name: worker, reason: soak run, env_passthrough: [], argv: [soak], cwd: /srv/app, profile: host, lease_ttl_seconds: 600, keep: false, expires_at: 2100-01-01T00:00:00Z}
    outcome: started
    capture: {instance: until, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: build}}
    outcome: running
  - at: 2026-10-16T09:05:00Z
    command: substrate.host_processes.RenewLease
    input: {process: {$instance: build}, lease_ttl_seconds: 1200}
    outcome: renewed
  - at: 2026-10-16T09:05:01Z
    command: substrate.host_processes.RenewLease
    input: {process: {$instance: until}, lease_ttl_seconds: 1200}
    outcome: renewed
  - at: 2026-10-16T09:05:02Z
    command: substrate.host_processes.RenewLease
    input: {process: {$instance: build}, lease_ttl_seconds: 0}
    outcome: lease-not-positive
    error: {name: substrate.host_processes.LeaseNotPositive}
  - at: 2026-10-16T10:00:00Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: build}}
    outcome: timed-out

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: build}, state: Stopping, lease_ttl_seconds: 1200, timeout_seconds: 3600, end_cause: timed-out}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: until}, state: Starting, lease_ttl_seconds: 1200, expires_at: 2100-01-01T00:00:00Z}
