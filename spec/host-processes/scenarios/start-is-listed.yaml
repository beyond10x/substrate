# S1, S2, S6: a started host process is listed with its owner, reason, argv, cwd, lease and the
# reported `confinement: none`, and is Running once its cgroup is populated.
type: ess-scenario/1
domain: substrate.host_processes
scenario: start-is-listed
summary: A started host process is listed, unconfined by declaration, and Running once its cgroup is populated.

arrange:
  - instance: dev
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input:
      name: dev-server
      owner_session_id: s-1
      owner_session_name: worker
      reason: serve the preview
      argv: [npm, run, dev]
      cwd: /srv/app
      env_passthrough: [PATH, HOME]
      profile: host
      lease_ttl_seconds: 3600
      keep: false
    outcome: started
    capture: {instance: dev, event: substrate.host_processes.ProcessStarted, field: process}

  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: dev}}
    outcome: running

assert:
  - view: substrate.host_processes.HostProcesses
    contains:
      process: {$instance: dev}
      name: dev-server
      state: Running
      owner_session_id: s-1
      owner_session_name: worker
      reason: serve the preview
      argv: [npm, run, dev]
      cwd: /srv/app
      confinement: none
      lease_ttl_seconds: 3600
      keep: false
