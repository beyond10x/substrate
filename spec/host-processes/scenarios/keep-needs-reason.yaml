# S4: a keep needs a reason and carries no lease; a kept record has no lease to expire.
type: ess-scenario/1
domain: substrate.host_processes
scenario: keep-needs-reason
summary: A keep without a reason is refused; a reasoned keep starts without a lease and cannot be expired.

arrange:
  - instance: kept
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: db, owner_session_id: s-1, owner_session_name: worker, reason: shared database, argv: [postgres], cwd: /srv/db, env_passthrough: [], profile: host, keep: true}
    outcome: keep-without-reason
    error: {name: substrate.host_processes.KeepNeedsReason}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.StartProcess
    input: {name: db, owner_session_id: s-1, owner_session_name: worker, reason: shared database, argv: [postgres], cwd: /srv/db, env_passthrough: [], profile: host, keep: true, keep_reason: the operator's fixture, lease_ttl_seconds: 60}
    outcome: keep-with-lease
    error: {name: substrate.host_processes.KeepHasNoLease}
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.StartProcess
    input: {name: db, owner_session_id: s-1, owner_session_name: worker, reason: shared database, argv: [postgres], cwd: /srv/db, env_passthrough: [], profile: host, keep: false}
    outcome: lease-missing
    error: {name: substrate.host_processes.LeaseRequired}
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.StartProcess
    input: {name: db, owner_session_id: s-1, owner_session_name: worker, reason: shared database, argv: [postgres], cwd: /srv/db, env_passthrough: [], profile: host, keep: true, keep_reason: the operator's fixture}
    outcome: started
    capture: {instance: kept, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:04Z
    command: substrate.host_processes.ExpireLease
    input: {process: {$instance: kept}}
    outcome: no-lease
    error: {name: substrate.host_processes.NoLease}

assert:
  - view: substrate.host_processes.HostProcesses
    counts: {at_most: 1}
  - view: substrate.host_processes.HostProcesses
    contains:
      process: {$instance: kept}
      state: Starting
      keep: true
      keep_reason: the operator's fixture
