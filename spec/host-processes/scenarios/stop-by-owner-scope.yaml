# S5: the SessionEnd stop moves only that owner's records that are not kept.
type: ess-scenario/1
domain: substrate.host_processes
scenario: stop-by-owner-scope
summary: Stop by owner stops only that owner's non-keep records; its kept record and another owner's stay Running.

arrange:
  - instance: mine
    entity: substrate.host_processes.HostProcess
  - instance: mine-kept
    entity: substrate.host_processes.HostProcess
  - instance: theirs
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: vite, owner_session_id: s-1, owner_session_name: worker, reason: preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_seconds: 3600, keep: false}
    outcome: started
    capture: {instance: mine, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.StartProcess
    input: {name: db, owner_session_id: s-1, owner_session_name: worker, reason: shared database, argv: [postgres], cwd: /srv/db, env_passthrough: [], profile: host, keep: true, keep_reason: shared across sessions}
    outcome: started
    capture: {instance: mine-kept, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.StartProcess
    input: {name: chrome, owner_session_id: s-2, owner_session_name: other, reason: browser checks, argv: [chrome, --headless], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_seconds: 3600, keep: false}
    outcome: started
    capture: {instance: theirs, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: mine}}
    outcome: running
  - at: 2026-10-16T09:00:04Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: mine-kept}}
    outcome: running
  - at: 2026-10-16T09:00:05Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: theirs}}
    outcome: running
  - at: 2026-10-16T09:10:00Z
    command: substrate.host_processes.StopByOwner
    input: {owner_session_id: s-1}
    outcome: stopping
    events:
      - event: substrate.host_processes.OwnerStopped
        payload: {owner_session_id: s-1, stopped: 1}

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: mine}, state: Stopping, end_cause: stopped}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: mine-kept}, state: Running}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: theirs}, state: Running}
