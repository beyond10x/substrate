# Point 7 of the wave decision, ADR 0036 S1: the name is unique among the subject's non-terminal
# records of one owner session. Another owner session may use it, and so may the same session
# once the record holding it has ended.
type: ess-scenario/1
domain: substrate.host_processes
scenario: name-unique-per-owner
summary: A second live record with the same owner session and name is refused; another session, or the same one after the first ended, may use the name.

arrange:
  - instance: first
    entity: substrate.host_processes.HostProcess
  - instance: other-session
    entity: substrate.host_processes.HostProcess
  - instance: reused
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: serve the preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: started
    capture: {instance: first, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: a second preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: name-conflict
    error: {name: substrate.host_processes.NameConflict, fields: {name: dev-server}}
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-2, owner_session_name: other, reason: their preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: started
    capture: {instance: other-session, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.StopProcess
    input: {process: {$instance: first}}
    outcome: stopping
  - at: 2026-10-16T09:00:04Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: still stopping, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: name-conflict
    error: {name: substrate.host_processes.NameConflict, fields: {name: dev-server}}
  - at: 2026-10-16T09:00:05Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: first}, exit_signal: SIGTERM}
    outcome: stopped
  - at: 2026-10-16T09:00:06Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: the next preview, argv: [vite], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: started
    capture: {instance: reused, event: substrate.host_processes.ProcessStarted, field: process}

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: first}, state: Ended, name: dev-server, owner_session_id: s-1}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: other-session}, state: Starting, name: dev-server, owner_session_id: s-2}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: reused}, state: Starting, name: dev-server, owner_session_id: s-1}
  - view: substrate.host_processes.HostProcesses
    counts: {at_most: 3}
