# S11: a start may carry both a timeout and an expires_at; the supervisor enforces the earlier one
# and names it. Reaching expires_at stops the record with ended_by expires-at; a deadline is
# enforced once, so a later enforcement on the stopping or ended record is refused and changes
# nothing. Naming a deadline the record does not carry is refused.
type: ess-scenario/1
domain: substrate.host_processes
scenario: expires-at-reached
summary: A record with a timeout and an expires_at stops once at expires_at with ended_by expires-at; enforcing it again, or naming a deadline it lacks, is refused.

arrange:
  - instance: soak
    entity: substrate.host_processes.HostProcess
  - instance: plain
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: soak, owner_session_id: s-1, owner_session_name: worker, reason: soak run, env_passthrough: [], argv: [soak], cwd: /srv/app, profile: host, lease_ttl_ms: 600000, keep: false, timeout_ms: 86400000, expires_at: 2100-01-01T00:00:00Z}
    outcome: started
    capture: {instance: soak, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: soak}}
    outcome: running
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: soak}, deadline: expires-at}
    outcome: expires-at-reached
    events:
      - event: substrate.host_processes.StopRequested
        payload: {ended_by: expires-at}
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: soak}, deadline: timeout}
    outcome: not-live
    error: {name: substrate.host_processes.NotLive, fields: {state: Stopping}}
  - at: 2026-10-16T09:00:04Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: soak}, exit_signal: SIGTERM}
    outcome: stopped
  - at: 2026-10-16T09:00:05Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: soak}, deadline: expires-at}
    outcome: not-live
    error: {name: substrate.host_processes.NotLive, fields: {state: Ended}}
  - at: 2026-10-16T09:00:06Z
    command: substrate.host_processes.StartProcess
    input: {name: plain, owner_session_id: s-1, owner_session_name: worker, reason: no deadline, env_passthrough: [], argv: [vite], cwd: /srv/app, profile: host, lease_ttl_ms: 600000, keep: false}
    outcome: started
    capture: {instance: plain, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:07Z
    command: substrate.host_processes.EnforceDeadline
    input: {process: {$instance: plain}, deadline: timeout}
    outcome: no-deadline
    error: {name: substrate.host_processes.NoDeadline}

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: soak}, state: Ended, ended_by: expires-at, exit_signal: SIGTERM, timeout_ms: 86400000, expires_at: 2100-01-01T00:00:00Z}
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: plain}, state: Starting}
