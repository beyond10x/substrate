# S12: a stream opened on an ended record delivers what it still holds, the terminal item, and
# closes: a record that exited is read in full after its end, ending with `ended`, and nothing can
# follow the terminal item.
type: ess-scenario/1
domain: substrate.host_processes
scenario: host-process-stream-on-an-ended-record-replays-and-closes
summary: After a record exits, its stream still reads started, its line, exited and ended, and an append after ended is refused.

arrange:
  - instance: job
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: job, owner_session_id: s-1, owner_session_name: worker, reason: one-off build, argv: [make], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 3600000, keep: false}
    outcome: started
    capture: {instance: job, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: job}}
    outcome: running
  - at: 2026-10-16T09:00:02Z
    command: substrate.host_processes.AppendStreamEvent
    input: {process: {$instance: job}, kind: output-line, line: build finished}
    outcome: appended
  - at: 2026-10-16T09:00:03Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: job}, exit_code: 2}
    outcome: exited
  - at: 2026-10-16T10:00:00Z
    command: substrate.host_processes.AppendStreamEvent
    input: {process: {$instance: job}, kind: output-line, line: after the end}
    outcome: stream-closed
    error: {name: substrate.host_processes.StreamClosed}

assert:
  - view: substrate.host_processes.HostProcesses
    contains: {process: {$instance: job}, state: Ended, ended_by: exit, exit_code: 2}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: job}, after: -1}
    counts: {at_least: 4, at_most: 4}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: job}, after: -1}
    at: {row: 1, fields: {kind: output-line, line: build finished}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: job}, after: -1}
    at: {row: 2, fields: {kind: exited, ended_by: exit, exit_code: 2}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: job}, after: -1}
    at: {row: last, fields: {kind: ended, ended_by: exit, exit_code: 2}}
