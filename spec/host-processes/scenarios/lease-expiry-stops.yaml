# S3, S4: an expired lease stops the record; it ends with ended_by lease-expiry once its cgroup is
# empty. That the kernel tree is gone is the native cgroup suite's obligation; here the record's
# Ended state is reached only through the supervisor's empty-cgroup report.
type: ess-scenario/1
domain: substrate.host_processes
scenario: lease-expiry-stops
summary: Lease expiry stops the record, and it ends with ended_by lease-expiry once its tree is gone.

arrange:
  - instance: dev
    entity: substrate.host_processes.HostProcess

timeline:
  - at: 2026-10-16T09:00:00Z
    command: substrate.host_processes.StartProcess
    input: {name: dev-server, owner_session_id: s-1, owner_session_name: worker, reason: serve the preview, argv: [npm, run, dev], cwd: /srv/app, env_passthrough: [], profile: host, lease_ttl_ms: 60000, keep: false}
    outcome: started
    capture: {instance: dev, event: substrate.host_processes.ProcessStarted, field: process}
  - at: 2026-10-16T09:00:01Z
    command: substrate.host_processes.ConfirmRunning
    input: {process: {$instance: dev}}
    outcome: running
  - at: 2026-10-16T09:01:00Z
    command: substrate.host_processes.ExpireLease
    input: {process: {$instance: dev}}
    outcome: expired
    events:
      - event: substrate.host_processes.StopRequested
        payload: {ended_by: lease-expiry}
  - at: 2026-10-16T09:01:01Z
    command: substrate.host_processes.RecordExit
    input: {process: {$instance: dev}, exit_signal: SIGKILL}
    outcome: stopped
  - at: 2026-10-16T09:01:02Z
    command: substrate.host_processes.RenewLease
    input: {process: {$instance: dev}, lease_ttl_ms: 60000}
    outcome: not-live
    error: {name: substrate.host_processes.NotLive}

assert:
  - view: substrate.host_processes.HostProcesses
    contains:
      process: {$instance: dev}
      state: Ended
      ended_by: lease-expiry
      exit_signal: SIGKILL
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: dev}, after: -1}
    counts: {at_least: 4, at_most: 4}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: dev}, after: -1}
    at: {row: 1, fields: {kind: lease-expired, ended_by: lease-expiry}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: dev}, after: -1}
    at: {row: 2, fields: {kind: stopped, ended_by: lease-expiry, exit_signal: SIGKILL}}
  - view: substrate.host_processes.ProcessEvents
    params: {process: {$instance: dev}, after: -1}
    at: {row: last, fields: {kind: ended, ended_by: lease-expiry}}
