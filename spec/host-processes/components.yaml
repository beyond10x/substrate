# The daemon owns the host-process domain (ADR 0036). No route, CLI surface or wire bundle is
# derived from it yet; `reached_by` stays the in-process default until the successor bundle that
# carries this family is cut.
components:
  - component: substrate-daemon
    summary: Supervises host processes and container records in cgroups under its delegated root.
    owns:
      domains: [substrate.host_processes]
    accepts:
      commands:
        - substrate.host_processes.StartProcess
        - substrate.host_processes.StartContainer
        - substrate.host_processes.AdoptProcess
        - substrate.host_processes.RenewLease
        - substrate.host_processes.StopProcess
        - substrate.host_processes.StopByOwner
        - substrate.host_processes.ConfirmRunning
        - substrate.host_processes.ExpireLease
        - substrate.host_processes.EnforceDeadline
        - substrate.host_processes.RecordExit
        - substrate.host_processes.RecordObservation
        - substrate.host_processes.AppendStreamEvent
        - substrate.host_processes.RecordLogDiscard
    publishes:
      events:
        - substrate.host_processes.ProcessStarted
        - substrate.host_processes.ProcessRunning
        - substrate.host_processes.ProcessAdopted
        - substrate.host_processes.LeaseRenewed
        - substrate.host_processes.StopRequested
        - substrate.host_processes.OwnerStopped
        - substrate.host_processes.ProcessEnded
        - substrate.host_processes.ProcessObserved
        - substrate.host_processes.StreamEventAppended
        - substrate.host_processes.LogDiscarded

# S12: the lifecycle events that appear in a record's stream. Output lines are appended by the
# supervisor directly from the bounded log.
# DECIDED (point 1): delivery is at least once. Each stream item carries its per-process cursor
# (the `seq` of ADR 0036 S12), strictly increasing, and a reader drops an item whose cursor it has
# already seen. Exactly once is not an ESS delivery and adds nothing the cursor does not give.
# DECIDED (point 2): a refused append is dropped. The only refusal these bindings can reach is
# StreamClosed, an append after `exited`; a later failure policy is additive.
bindings:
  - id: stream-started
    summary: A record whose cgroup is populated has a `started` stream event.
    when: {event: substrate.host_processes.ProcessRunning}
    invoke: {command: substrate.host_processes.AppendStreamEvent}
    mapping: {process: event.process, kind: started}
    delivery: at_least_once
    on_failure: drop

  - id: stream-lease-expired
    summary: A lease expiry has a `lease-expired` stream event.
    when:
      event: substrate.host_processes.StopRequested
      where: event.end_cause == lease-expired
    invoke: {command: substrate.host_processes.AppendStreamEvent}
    mapping: {process: event.process, kind: lease-expired}
    delivery: at_least_once
    on_failure: drop

  - id: stream-timed-out
    summary: A timeout or a reached expires_at has a `timed-out` stream event.
    when:
      event: substrate.host_processes.StopRequested
      where: {any: [event.end_cause == timed-out, event.end_cause == deadline-reached]}
    invoke: {command: substrate.host_processes.AppendStreamEvent}
    mapping: {process: event.process, kind: timed-out}
    delivery: at_least_once
    on_failure: drop

  - id: stream-exited
    summary: An ended record has its terminal `exited` stream event, with its code or signal.
    when: {event: substrate.host_processes.ProcessEnded}
    invoke: {command: substrate.host_processes.AppendStreamEvent}
    mapping:
      process: event.process
      kind: exited
      exit_code: event.exit_code
      exit_signal: event.exit_signal
    delivery: at_least_once
    on_failure: drop
