          predicate: {not: {exists: {in: facts, as: held, that: held == exec_subpaths}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: exec_subpaths}
      - name: fact-unserved-private-tmpdir
        when: {exists: {in: required_facts, as: needed, that: needed == private_tmpdir}}
        when_related:
