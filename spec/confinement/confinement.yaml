          predicate: {not: {exists: {in: facts, as: held, that: held == private_tmpdir}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: private_tmpdir}
      - name: fact-unserved-host-network
        when: {exists: {in: required_facts, as: needed, that: needed == host_network}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == host_network}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: host_network}
      - name: fact-unserved-image-digest-pinned
        when: {exists: {in: required_facts, as: needed, that: needed == image_digest_pinned}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == image_digest_pinned}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: image_digest_pinned}
      # Decision 4: `local` is a configuration, not an absence. It runs only with a reason, and the
      # admission records it as declared insecure.
      - name: admitted-insecure
        when_related:
          via: input.adapter
          predicate: {exists: {in: facts, as: held, that: held == declared_insecure}}
        creates: substrate.confinement.Profile
        instance: profile
        sets:
          adapter: input.adapter
          inner: input.inner
          families: input.required_families
          facts: input.required_facts
          declared_insecure: true
          local_reason: input.local_reason
        emits: [substrate.confinement.ProfileAdmitted]
        payload:
          substrate.confinement.ProfileAdmitted:
            profile: {generated: true}
            adapter: input.adapter
            inner: input.inner
            families: input.required_families
            facts: input.required_facts
            declared_insecure: true
            local_reason: input.local_reason
      # A reason sent with a confined adapter is recorded as sent; it declares nothing.
      - name: admitted
        creates: substrate.confinement.Profile
        instance: profile
        sets:
          adapter: input.adapter
          inner: input.inner
          families: input.required_families
          facts: input.required_facts
          declared_insecure: false
          local_reason: input.local_reason
        emits: [substrate.confinement.ProfileAdmitted]
        payload:
          substrate.confinement.ProfileAdmitted:
            profile: {generated: true}
            adapter: input.adapter
            inner: input.inner
            families: input.required_families
            facts: input.required_facts
            declared_insecure: false
            local_reason: input.local_reason

events:
  - name: substrate.confinement.AdapterOpened
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: served_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
  # The audit record of an admission (ADR 0109 decision 2).
  - name: substrate.confinement.ProfileAdmitted
    fields:
      - {name: profile, type: substrate.confinement.ProfileId}
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
      - {name: declared_insecure, type: Boolean}
      - {name: local_reason, type: "Optional<String>"}
