domain: substrate.confinement
summary: >-
  The confinement contract family (atlas ADR 0109, ADR 0044): an adapter proves at open which
  contract families it serves and which facts hold, and a profile that needs a family or a fact the
  adapter lacks is refused by that name, never degraded.

types:
  # ADR 0109 decision 8, in that order. An adapter declares the families it serves; a client that
  # needs one the adapter does not serve is refused with that family's name.
  - name: substrate.confinement.ContractFamily
    kind: enum
    variants:
      - process_run
      - process_watch
      - output_read
      - wait
      - workspace
      - filesystem_view
      - network_egress
      - network_ingress
      - limits
      - audit
  # ADR 0109 decision 3. `systemd` is the bounds provider around one other adapter, named by
  # InnerAdapter (`story:systemd-scope-bounds-provider`).
  - name: substrate.confinement.AdapterName
    kind: enum
    variants: [local, linux, macos, systemd, oci, pod]
  - name: substrate.confinement.InnerAdapter
    kind: enum
    variants: [local, linux]
  # The facts an adapter proves at open and a profile may require (ADR 0109 decision 2). Each
  # adapter's set is stated by the open step of every scenario that opens it; README.md lists the
  # sets and the source each member is read from.
  # - declared_insecure: the run is unconfined and every observation says so (decision 4).
  # - paths_are_host_paths: a path the program sees is the host path (no remapped mount).
  # - whole_tree_kill: a kill reaches every process of the tree.
  # - local_permitted: the host's policy fact; absent, `local` is refused (F3 A).
  # - ipc_socket_allowlist: socket(2) families are an allowlist (ADR 0039).
  # - ipc_signals_contained: no signal reaches a process outside the tree.
  # - sealed_paths: paths inside a writable workspace that stay unwritable.
  # - exec_subpaths: exec admitted by declared subpath, not only by literal program. An empty list
  #   differs by adapter and the difference is stated, not removed (design 35 D1): on `linux` it
  #   runs every program of the view and only a non-empty list holds the run to its program and
  #   the list; on `macos` it runs only the program.
  # - private_tmpdir: a per-run TMPDIR, invisible to another run and gone after wait.
  # - host_network: the run uses the host's network directly.
  # - image_digest_pinned: the image runs by digest only.
  # - stdin_pipe: the run's standard input is a pipe the embedder writes and closes, ended by EOF
  #   (design 32, section 2). Without it a run's standard input is `/dev/null`.
  # - output_live: the run's output reaches the embedder while the run runs, in order and
  #   contiguous per stream, from a bounded queue whose stall ends the run (design 32, section 3).
  #   Without it output is read from the run's record.
  # - file_changes: the adapter records what a run changed in the mounts it may write, from a
  #   digest of each mount's tree before the run starts and after it ends, and keeps the content
  #   of both sides where no run can reach it (ADR 0051). Without it a run has no change record.
  - name: substrate.confinement.Fact
    kind: enum
    variants:
      - declared_insecure
      - paths_are_host_paths
      - whole_tree_kill
      - local_permitted
      - ipc_socket_allowlist
      - ipc_signals_contained
      - sealed_paths
      - exec_subpaths
      - private_tmpdir
      - host_network
      - image_digest_pinned
      - stdin_pipe
      - output_live
      - file_changes
  # The two profile fields ADR 0109 F1 B reserves: setting either is refused until a later story
  # fills it. Spelled with `-` because ESS reads a bare `ingress_routes` in a payload as the input
  # of that name.
  - name: substrate.confinement.ReservedField
    kind: enum
    variants: [ingress-routes, rate-bounds]
  # An OCI image reference as the client writes it: `name:tag` or `name@sha256:<hex>`.
  - name: substrate.confinement.ImageReference
    kind: newtype
    of: String
  # substrate-host mints one per admitted profile. It is not a wire identifier.
  - name: substrate.confinement.ProfileId
    kind: newtype
    of: Uuid
  # The adapter mints one per start. Under `linux` it is the host driver's exec identity, `ex_`
  # and a lowercase ULID (`crates/substrate-host/src/confinement/linux.rs`, `start_run`).
  - name: substrate.confinement.RunId
    kind: newtype
    of: String
  # The key of a run's change record. The adapter's API reads a record by its run's identity and
  # has no second key; the model types the record's own identity apart from the run's so that an
  # input names one row.
  - name: substrate.confinement.ChangeRecordKey
    kind: newtype
    of: String
  # The directory a run may write, as the host driver names it: a workspace's root name, or the
  # name of an operator-declared writable root (ADR 0038 kind 1). Two runs that name the same
  # one write the same directory.
  - name: substrate.confinement.WrittenDirectory
    kind: newtype
    of: String
  # What a run did to one path, read from the two tree digests (ADR 0051 decision 4). A path that
  # ends as it started is not listed and has no operation.
  - name: substrate.confinement.ChangeOperation
    kind: enum
    variants: [create, modify, delete, rename]
  # What a path names on one side. `special` is a FIFO, a socket or a device node: listed, never
  # opened and never digested.
  - name: substrate.confinement.EntryKind
    kind: enum
    variants: [file, symlink, directory, special]
  # Whether the content of one side can be read back (ADR 0051 decision 5): `kept`; `over-bound`,
  # a file over the per-file bound; `binary`; `run-bound`, the run's content bound was spent on
  # earlier paths; `not-content`, a directory or a special file.
  - name: substrate.confinement.ContentAvailability
    kind: enum
    variants: [kept, over-bound, binary, run-bound, not-content]
  # Why a run that asked for a change record has none (ADR 0051 decision 2), a closed list:
  # - second-writer: another start with write access to a covered mount ran while the run did.
  # - outside-writer-detected: a walk saw a file change while it read it, and Substrate started
  #   no writer.
  # - tree-over-bound: the covered tree holds more entries, bytes or levels than the bound.
  # - manifest-not-ready: the before walk did not finish within the start wait, because the
  #   mount's kept manifest is missing or still being made; a later run can have a record.
  # - walk-over-time: a walk that has to read its files did not finish within its time bound.
  # - paths-over-bound: the run changed more paths than one record lists.
  # - entry-unreadable: the walk could not open or read an entry.
  # - mount-crossed: a directory beneath a covered mount is another file system's mount point.
  # - path-unrepresentable: a changed path is not UTF-8.
  # - content-store-failed: a side's content could not be kept.
  # - run-tree-unproven: the run's process tree was not proved gone before the end walk.
  - name: substrate.confinement.ChangeRecordUnavailable
    kind: enum
    variants:
      - second-writer
      - outside-writer-detected
      - tree-over-bound
      - manifest-not-ready
      - walk-over-time
      - paths-over-bound
      - entry-unreadable
      - mount-crossed
      - path-unrepresentable
      - content-store-failed
      - run-tree-unproven
  # What a covered mount shows (ADR 0051 decision 7): the start's workspace, an operator-declared
  # host root or a Git checkout (ADR 0038).
  - name: substrate.confinement.MountKind
    kind: enum
    variants: [workspace, host-root, git-root]
  # One mount a record covers (ADR 0051 decision 4). `mount` is the path in the run's view,
  # `name` the workspace's root name, the declared root's name or the workspace id, and `excluded`
  # the names left out at any depth, `.git` not among them because it is always left out. The
  # two tree digests are the SHA-256 over the mount's manifest before the run and after it; a
  # record that is unavailable states the ones its walks reached.
  - name: substrate.confinement.CoveredMount
    kind: struct
    fields:
      - {name: mount, type: String}
      - {name: kind, type: substrate.confinement.MountKind}
      - {name: name, type: String}
      - {name: excluded, type: "List<String>"}
      - {name: before_sha256, type: "Optional<String>"}
      - {name: after_sha256, type: "Optional<String>"}
  # One side of a changed path. `sha256` is the lowercase hexadecimal SHA-256 of a file's bytes or
  # of a symlink's target; a directory and a special file have none. `mode` is the permission
  # bits.
  - name: substrate.confinement.ChangeSide
    kind: struct
    fields:
      - {name: kind, type: substrate.confinement.EntryKind}
      - {name: sha256, type: "Optional<String>"}
      - {name: size, type: "Optional<Integer>"}
      - {name: mode, type: Integer}
      - {name: content, type: substrate.confinement.ContentAvailability}
  # One changed path of a run (ADR 0051 decision 4). `mount` is the mount as the run's view names
  # it (`/workspace`, or a writable root's mount) and `path` is relative to it. `before` is
  # absent for a create and `after` for a delete. A rename is listed once, at its new path:
  # `from` is the path it left, `before` the side that was at `from`, and `replaced` the side
  # that was at `path` when the rename landed on an existing entry. `fs_mtime` is the file
  # system's modification time of the after side as the end walk read it: a time a process
  # inside the run can set, never an observed instant, and absent for a delete.
  - name: substrate.confinement.FileChange
    kind: struct
    fields:
      - {name: mount, type: String}
      - {name: path, type: String}
      - {name: operation, type: substrate.confinement.ChangeOperation}
      - {name: from, type: "Optional<String>"}
      - {name: before, type: "Optional<substrate.confinement.ChangeSide>"}
      - {name: after, type: "Optional<substrate.confinement.ChangeSide>"}
      - {name: replaced, type: "Optional<substrate.confinement.ChangeSide>"}
      - {name: fs_mtime, type: "Optional<Timestamp>"}

entities:
  # The adapter as opened on this host: one row per adapter name, written by OpenAdapter, which is
  # `confinement::open` of the S0 contract (`story:confinement-contract-on-linux-and-local`). No row
  # means the adapter did not open here.
  - name: substrate.confinement.Adapter
    naming:
      summary: An adapter opened on this host, with the contract families it serves and the facts it proved at open.
    identity: {name: adapter, type: substrate.confinement.AdapterName}
    fields:
      # The adapter `systemd` wraps; absent for every other adapter.
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: served_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

  # A profile admitted on an adapter: what it required, and whether the run is declared insecure.
  - name: substrate.confinement.Profile
    naming:
      summary: A confinement profile admitted on one opened adapter.
    identity: {name: profile, type: substrate.confinement.ProfileId}
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
      - {name: declared_insecure, type: Boolean}
      - {name: local_reason, type: "Optional<String>"}
    # A profile is admitted against the adapter row that is open; the row outlives the profile.
    relations:
      - {name: opened_on, kind: references, target: substrate.confinement.Adapter, cardinality: one, via: adapter}
    lifecycle:
      initial: Admitted
      states: [Admitted]
      terminal: [Admitted]

  # A run started under an admitted profile (`ConfinementAdapter::start`). `Running` is the time
  # the run counts as a writer of its directory; `Ended` is after its process tree is gone.
  # UNMAPPED: a run admitted with a read-only workspace writes nothing and counts as no writer;
  # the model gives every run one written directory. A session and a write through Substrate's
  # own file routes count as writers too and have no row here; the host driver's tests hold them.
  # UNMAPPED: the run's profile and adapter. `ConfinementAdapter::start` takes the admitted
  # profile, and the profile's member is what asks for the record (ADR 0051 decision 10). ESS
  # 0.86.0 synthesis arranges no admission (README.md, *Scenarios and lanes*), so a run row that
  # referred to its profile made every obligation on a run or a record unreachable and synthesis
  # three times as slow (57 s to 186 s in one job). The row therefore holds what the start
  # states, and each `*-change-record-*` scenario still opens the adapter and admits the profile.
  - name: substrate.confinement.Run
    naming:
      summary: A run started under an admitted profile, and the directory it writes.
    identity: {name: run, type: substrate.confinement.RunId}
    fields:
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      # The run's profile asked for the record.
      - {name: records_file_changes, type: Boolean}
    lifecycle:
      initial: Running
      states: [Running, Ended]
      terminal: [Ended]
      transitions:
        - {name: end, from: [Running], to: Ended}

  # The change record of one run (ADR 0051): what the run changed in the mounts it may write.
  # One row per run that asked for it, opened when the driver takes the before side. `Pending`
  # while the run runs and until the end walk settles it. `Available` with an empty `changes` is
  # a run that changed nothing; `Unavailable` carries the reason and lists no change. A run that
  # did not ask has no row: that is the adapter API's `not requested` answer.
  - name: substrate.confinement.ChangeRecord
    naming:
      summary: What one run changed in the mounts it may write, or the named reason it cannot be said.
    identity: {name: record, type: substrate.confinement.ChangeRecordKey}
    fields:
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      # The instants the driver observed: the launch barrier's release, and the proof that no
      # process of the run remains. Absent until the record leaves `Pending`.
      - {name: started_at, type: "Optional<Timestamp>"}
      - {name: ended_at, type: "Optional<Timestamp>"}
      - {name: mounts, type: "List<substrate.confinement.CoveredMount>"}
      - {name: changes, type: "List<substrate.confinement.FileChange>"}
      - {name: reason, type: "Optional<substrate.confinement.ChangeRecordUnavailable>"}
    relations:
      - {name: of_run, kind: references, target: substrate.confinement.Run, cardinality: one, via: run}
    lifecycle:
      initial: Pending
      states: [Pending, Available, Unavailable]
      terminal: [Available, Unavailable]
      transitions:
        - {name: settle, from: [Pending], to: Available}
        - {name: withhold, from: [Pending], to: Unavailable}

views:
  - name: substrate.confinement.Adapters
    source: substrate.confinement.Adapter
    consistency: read_your_writes
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: state, type: substrate.confinement.Adapter.State}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: served_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
  - name: substrate.confinement.Profiles
    source: substrate.confinement.Profile
    consistency: read_your_writes
    fields:
      - {name: profile, type: substrate.confinement.ProfileId}
      - {name: state, type: substrate.confinement.Profile.State}
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
      - {name: declared_insecure, type: Boolean}
      - {name: local_reason, type: "Optional<String>"}
  - name: substrate.confinement.Runs
    source: substrate.confinement.Run
    consistency: read_your_writes
    fields:
      - {name: run, type: substrate.confinement.RunId}
      - {name: state, type: substrate.confinement.Run.State}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      - {name: records_file_changes, type: Boolean}
  - name: substrate.confinement.ChangeRecords
    source: substrate.confinement.ChangeRecord
    consistency: read_your_writes
    fields:
      - {name: record, type: substrate.confinement.ChangeRecordKey}
      - {name: state, type: substrate.confinement.ChangeRecord.State}
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      - {name: started_at, type: "Optional<Timestamp>"}
      - {name: ended_at, type: "Optional<Timestamp>"}
      - {name: mounts, type: "List<substrate.confinement.CoveredMount>"}
      - {name: changes, type: "List<substrate.confinement.FileChange>"}
      - {name: reason, type: "Optional<substrate.confinement.ChangeRecordUnavailable>"}

actors:
  # A substrate-host embedder (loom-sdk, takt, the daemon). The API is in process; no subject is
  # derived here.
  - name: substrate.confinement.Embedder
    may:
      - substrate.confinement.OpenAdapter
      - substrate.confinement.AdmitProfile
      - substrate.confinement.StartRun
      - substrate.confinement.OpenChangeRecord
      - substrate.confinement.EndRun
      - substrate.confinement.SettleChangeRecord

errors:
  # Each error is one named refusal; the code and the status are the contract's.
  - name: substrate.confinement.AdapterUnserved
    summary: "`confinement.adapter-unserved`, 501. The adapter cannot open on this host or platform, or the requested adapter and `inner` are not the pair that opened."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
  - name: substrate.confinement.FamilyUnserved
    summary: "`confinement.family-unserved`, 501. The adapter does not serve a contract family the profile needs; the error names the family."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: family, type: substrate.confinement.ContractFamily}
  - name: substrate.confinement.FactUnserved
    summary: "`confinement.fact-unserved`, 501. The adapter did not prove a fact the profile requires, or, at open, a fact the adapter itself must prove (`declared_insecure` for `local`, `image_digest_pinned` for `oci` and `pod`); the error names the fact (ADR 0109 decision 2)."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: fact, type: substrate.confinement.Fact}
  - name: substrate.confinement.LocalRefused
    summary: "`confinement.local-refused`, 403. The host's policy fact forbids `local` (ADR 0109 F3 A)."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
  - name: substrate.confinement.LocalReasonMissing
    summary: "`confinement.local-reason-missing`, 422. `local` is requested without a reason (ADR 0109 decision 4)."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
  - name: substrate.confinement.ImageUnpinned
    summary: "`confinement.image-unpinned`, 422. An `oci` or `pod` image is not named by digest."
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
  - name: substrate.confinement.ReservedFieldUnserved
    summary: "`confinement.reserved-field-unserved`, 501. An ingress route or a rate bound was set; both are reserved (ADR 0109 F1 B)."
    fields:
      - {name: field, type: substrate.confinement.ReservedField}
  - name: substrate.confinement.RunNotFound
    summary: "`resource.not-found`, 404. No run of this adapter has the identity: it never started here, it has ended, or the adapter no longer tracks it."
    fields:
      - {name: run, type: substrate.confinement.RunId}
  - name: substrate.confinement.ChangeRecordNotRequested
    summary: "The run's profile did not ask for a change record, so none is opened. It is the adapter API's `not requested` answer: distinct from an empty record and from an unavailable one, and no refusal of the run."
    fields:
      - {name: run, type: substrate.confinement.RunId}
  - name: substrate.confinement.ChangeRecordSettled
    summary: "The change record is no longer pending: it was settled, or it became unavailable when a second writer was seen. Nothing is written twice."
    fields:
      - {name: record, type: substrate.confinement.ChangeRecordKey}

commands:
  # `confinement::open` (S0 contract). The adapter probes at open; the input states the families
  # and facts the probe proved, so a scenario's open step is that adapter's declared set, and a
  # runner holding a real adapter compares its facts with it. The declared sets the scenarios open:
  # - local: process_run, process_watch, output_read, wait, workspace, audit; declared_insecure,
  #   paths_are_host_paths, local_permitted (absent where the host forbids `local`, F3 A),
  #   host_network (decision 4: direct networking), stdin_pipe (design 32: a piped standard input
  #   held by the adapter's shared writer), output_live (design 32: the shared drain's live queue).
  #   No whole-tree kill (the systemd story).
  # - linux: process_run, process_watch, output_read, wait, workspace, filesystem_view, limits,
  #   audit, and network_egress where the operator declared an egress aperture
  #   (`crates/substrate-host/src/probe.rs`); whole_tree_kill (cgroup kill), ipc_socket_allowlist
  #   (ADR 0039's seccomp socket filter), ipc_signals_contained (its own pid namespace),
  #   stdin_pipe and output_live (design 32: the host driver's pipe channel, with a live sender
  #   for output_live, each proved with the floor), exec_subpaths (design 35: the Landlock
  #   execute right, applied inside the sandbox by the helper `HostConfig.exec_gate` names, and
  #   proved by the driver's probe; the delegated lane opens its adapter with that helper),
  #   file_changes (ADR 0051: the floor, cgroup kill and guarded I/O, and one throwaway run whose
  #   change record the driver's probe checked). The S0
  #   story: paths_are_host_paths, sealed_paths and host_network are not proved.
  #   UNMAPPED: private_tmpdir. The bwrap argv mounts a fresh `/tmp`
  #   (`crates/substrate-host/src/process.rs`), but no story declares the fact for `linux`;
  #   it is left out until one does.
  # - macos, final state after `story:macos-seatbelt-policy-runs-cargo-test`: process_run,
  #   process_watch, output_read, wait, workspace, filesystem_view, audit; paths_are_host_paths,
  #   ipc_signals_contained (the profile's `signal (target same-sandbox)` rule,
  #   `crates/substrate-host/src/seatbelt.rs`), sealed_paths, exec_subpaths, private_tmpdir,
  #   stdin_pipe (design 32: the run inherits descriptor 0; declared once the macos lane proves a
  #   confined `cat` reads it), output_live (design 32: the shared drain's live queue; declared
  #   once the macos lane proves a confined run's output arrives while it runs). No limits,
  #   egress or whole-tree kill (ADR 0037).
  # - systemd around local: local's families plus limits; local's facts plus whole_tree_kill.
  # - systemd around linux: linux's set.
  # - oci: process_run, process_watch, output_read, wait, workspace, filesystem_view, limits,
  #   audit; image_digest_pinned (`story:oci-adapter`); stdin_pipe only where the runtime's flavor,
  #   server version and client version are an entry in `OCI_STDIN_PINNED` (design 32 D13). The scenarios state what the
  #   oci lane's pinned runtime yields, which holds it. output_live on every runtime (design 32:
  #   the attached runtime client's two pipes feed the shared drain's live queue).
  #   UNMAPPED: the oci story names a "rootless or not" fact with no Fact variant, and states no
  #   whole_tree_kill, IPC, private_tmpdir or paths_are_host_paths fact; none is declared.
  # - pod: process_run, process_watch, output_read, wait, workspace, limits, audit;
  #   image_digest_pinned (its posture runs "an image by digest", `story:pod-adapter`).
  #   UNMAPPED: whole_tree_kill; no story declares it for `pod`. No stdin_pipe: it needs
  #   `pods/attach`, which the Role does not grant (design 32 D10). No output_live: the log
  #   endpoint merges stdout and stderr into one stream, which no chunk's stream can name, and
  #   merged-stream delivery waits for its own design (design 32 D10, Q8).
  # UNMAPPED: no family states the audit record's own snapshot fact (decision 2); `audit` is
  # declared served by every adapter, as each story lists it.
  - name: substrate.confinement.OpenAdapter
    input:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: served_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
    outcomes:
      # ADR 0044 decision 3 and atlas ADR 0109 decision 4: `local` is always reported declared
      # insecure, bare or inside `systemd` (the systemd story: wrapping `local` is still declared
      # insecure). An open whose proved set lacks `declared_insecure` is refused by that fact's
      # name, so no `local` row exists that admission could take for a confined adapter.
      - name: local-not-declared-insecure
        when:
          all:
            - {adapter: [local]}
            - {not: {exists: {in: facts, as: held, that: held == declared_insecure}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: declared_insecure}
      - name: systemd-local-not-declared-insecure
        when:
          all:
            - {adapter: [systemd]}
            - {inner: [local]}
            - {not: {exists: {in: facts, as: held, that: held == declared_insecure}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: declared_insecure}
      # The oci story: "the adapter runs only a digest"; the pod story: "an image by digest". An
      # `oci` or `pod` open that does not prove `image_digest_pinned` is refused by that fact's
      # name, so admission's digest check holds on every `oci` and `pod` row.
      - name: image-not-digest-pinned
        when:
          all:
            - {adapter: [oci, pod]}
            - {not: {exists: {in: facts, as: held, that: held == image_digest_pinned}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: image_digest_pinned}
      # What makes an adapter absent is the host, not the request: `macos` off macOS, `linux` off
      # Linux, `systemd` with no reachable user manager, `oci` with no runtime program, `pod` with
      # no cluster configuration. `local` always opens, so it has no such answer.
      - name: unserved
        when: {adapter: {none_of: [local]}}
        external: the adapter cannot open on this host or platform
        error: substrate.confinement.AdapterUnserved
        payload:
          substrate.confinement.AdapterUnserved: {adapter: input.adapter}
      - name: opened
        creates: substrate.confinement.Adapter
        instance: adapter
        sets:
          inner: input.inner
          served_families: input.served_families
          facts: input.facts
        emits: [substrate.confinement.AdapterOpened]
        payload:
          substrate.confinement.AdapterOpened:
            adapter: input.adapter
            inner: input.inner
            served_families: input.served_families
            facts: input.facts

  # Admission of a profile on an opened adapter. The request-only refusals answer first, then a
  # missing adapter, then what the opened adapter row decides (a missing reason, an unpinned
  # image, the host's policy), then its families and facts, in declaration order. Whether a run is
  # `local` is read from the opened row: `local`, or `systemd` opened around `local`.
  # A requested `inner` that differs from the opened row's, present or absent, is refused
  # `confinement.adapter-unserved` (the `adapter-unserved` branch). The model takes this decision;
  # no source states it.
  # UNMAPPED: `OpenAdapter` accepts `inner` beside an adapter other than `systemd`, and `systemd`
  # without `inner`. Refusing either at open made ESS 0.81.0 synthesis refuse every admission
  # (ESS-SYNTH-002), so the model leaves both to the S0 contract's open. Open question.
  # UNMAPPED: ADR 0109 decision 2 and this story make every refusal an audit record
  # (`ProfileRefused`, carrying the adapter and the family or fact named). ESS refuses an event on
  # an outcome that reports an error (`refusal_mutated_state`), so the refusal's audit record is
  # not in this model; each error carries the adapter and the name it refuses, and the adapter's
  # own tests hold the audit record.
  - name: substrate.confinement.AdmitProfile
    input:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: required_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: required_facts, type: "List<substrate.confinement.Fact>"}
      # Required when the run is `local`, bare or inside `systemd` (decision 4; the systemd story:
      # wrapping `local` is still reported declared insecure).
      - {name: local_reason, type: "Optional<String>"}
      # For `oci` and `pod`.
      # UNMAPPED: no source says what an image beside `local`, `linux`, `macos` or `systemd`
      # means; the model ignores it there.
      - {name: image, type: "Optional<substrate.confinement.ImageReference>"}
      # Reserved by ADR 0109 F1 B; their shape is a later story's.
      # UNMAPPED: the shape of an ingress route and of a rate bound. Any value is refused here.
      - {name: ingress_routes, type: "Optional<Json>"}
      - {name: rate_bounds, type: "Optional<Json>"}
    outcomes:
      - name: ingress-routes-reserved
        when: {ingress_routes: {defined: true}}
        error: substrate.confinement.ReservedFieldUnserved
        payload:
          substrate.confinement.ReservedFieldUnserved: {field: ingress-routes}
      - name: rate-bounds-reserved
        when: {rate_bounds: {defined: true}}
        error: substrate.confinement.ReservedFieldUnserved
        payload:
          substrate.confinement.ReservedFieldUnserved: {field: rate-bounds}
      # No row: the adapter did not open on this host.
      - name: adapter-not-open
        when_related: {via: input.adapter, exists: false}
        error: substrate.confinement.AdapterUnserved
        payload:
          substrate.confinement.AdapterUnserved: {adapter: input.adapter}
      # The requested adapter is the pair `adapter` and `inner`. One that differs from the opened
      # row's pair names an adapter that is not open here, so it is refused as one (invariant 3):
      # `systemd` around `linux` on a scope opened around `local` and the reverse, an `inner`
      # beside an adapter opened without one, and `systemd` requested without the `inner` it was
      # opened around. The branch reads the opened row's stored `inner` beside the requested one; it
      # never compares the requested `adapter` identity with a literal (ESS 0.81.0 synthesis ignores
      # such a guard, beyond10x/ess#693). Each comparison sits behind a presence test, so no guard
      # compares an absent `inner` (ESS reads that as unknown and decides no branch).
      - name: adapter-unserved
        when_related:
          via: input.adapter
          predicate:
            any:
              - {all: ["defined(inner)", "not defined(input.inner)"]}
              - {all: ["not defined(inner)", "defined(input.inner)"]}
              - {all: ["defined(inner)", "defined(input.inner)", inner == local, input.inner == linux]}
              - {all: ["defined(inner)", "defined(input.inner)", inner == linux, input.inner == local]}
        error: substrate.confinement.AdapterUnserved
        payload:
          substrate.confinement.AdapterUnserved: {adapter: input.adapter}
      # Decision 4: a run is `local` exactly when its opened adapter proves `declared_insecure`:
      # `local`, or `systemd` opened around `local` (the systemd story: still declared insecure).
      - name: local-reason-missing
        when: {any: ["not defined(local_reason)", local_reason == ""]}
        when_related:
          via: input.adapter
          predicate: {exists: {in: facts, as: held, that: held == declared_insecure}}
        error: substrate.confinement.LocalReasonMissing
        payload:
          substrate.confinement.LocalReasonMissing: {adapter: input.adapter}
      # The oci story: "the adapter runs only a digest". An adapter that proves
      # `image_digest_pinned` (`oci`, `pod`) refuses a reference that names no `sha256` digest.
      # UNMAPPED: an `oci` or `pod` profile with no image at all. The model refuses it as unpinned
      # (no digest is named; invariant 3, fail closed); no source says so. Open question.
      # A pinned reference ends `@sha256:` and exactly 64 lowercase hex characters. ESS 0.81.0 has
      # no pattern predicate and no substring, so the model states every part of that it can: the
      # reference names `@sha256:`, ends with a lowercase hex character, and is long enough to hold
      # a one-character name, `@sha256:` and 64 characters (73). That `@sha256:` is exactly the 64
      # characters before the end, and that each of them is lowercase hex, is the `oci` and `pod`
      # adapters' check (README.md, *Image digests*).
      - name: image-unpinned
        when:
          any:
            - "not defined(image)"
            - {not: {image: {contains: "@sha256:"}}}
            - image.count < 73
            - none:
                - {image: {ends_with: "0"}}
                - {image: {ends_with: "1"}}
                - {image: {ends_with: "2"}}
                - {image: {ends_with: "3"}}
                - {image: {ends_with: "4"}}
                - {image: {ends_with: "5"}}
                - {image: {ends_with: "6"}}
                - {image: {ends_with: "7"}}
                - {image: {ends_with: "8"}}
                - {image: {ends_with: "9"}}
                - {image: {ends_with: "a"}}
                - {image: {ends_with: "b"}}
                - {image: {ends_with: "c"}}
                - {image: {ends_with: "d"}}
                - {image: {ends_with: "e"}}
                - {image: {ends_with: "f"}}
        when_related:
          via: input.adapter
          predicate: {exists: {in: facts, as: held, that: held == image_digest_pinned}}
        error: substrate.confinement.ImageUnpinned
        payload:
          substrate.confinement.ImageUnpinned: {adapter: input.adapter}
      # F3 A: the host's policy fact. The opened `local`, or `systemd` around it, carries
      # `local_permitted` exactly when the host permits `local`.
      - name: local-refused
        when_related:
          via: input.adapter
          predicate:
            all:
              - {exists: {in: facts, as: held, that: held == declared_insecure}}
              - {not: {exists: {in: facts, as: held, that: held == local_permitted}}}
        error: substrate.confinement.LocalRefused
        payload:
          substrate.confinement.LocalRefused: {adapter: input.adapter}
      # One branch per family, in ADR 0109 decision 8's order, so the refusal names the first
      # family the profile needs and the adapter does not serve.
      - name: family-unserved-process-run
        when: {exists: {in: required_families, as: needed, that: needed == process_run}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == process_run}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: process_run}
      - name: family-unserved-process-watch
        when: {exists: {in: required_families, as: needed, that: needed == process_watch}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == process_watch}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: process_watch}
      - name: family-unserved-output-read
        when: {exists: {in: required_families, as: needed, that: needed == output_read}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == output_read}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: output_read}
      - name: family-unserved-wait
        when: {exists: {in: required_families, as: needed, that: needed == wait}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == wait}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: wait}
      - name: family-unserved-workspace
        when: {exists: {in: required_families, as: needed, that: needed == workspace}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == workspace}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: workspace}
      - name: family-unserved-filesystem-view
        when: {exists: {in: required_families, as: needed, that: needed == filesystem_view}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == filesystem_view}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: filesystem_view}
      - name: family-unserved-network-egress
        when: {exists: {in: required_families, as: needed, that: needed == network_egress}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == network_egress}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: network_egress}
      - name: family-unserved-network-ingress
        when: {exists: {in: required_families, as: needed, that: needed == network_ingress}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == network_ingress}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: network_ingress}
      - name: family-unserved-limits
        when: {exists: {in: required_families, as: needed, that: needed == limits}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == limits}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: limits}
      - name: family-unserved-audit
        when: {exists: {in: required_families, as: needed, that: needed == audit}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: served_families, as: served, that: served == audit}}}
        error: substrate.confinement.FamilyUnserved
        payload:
          substrate.confinement.FamilyUnserved: {adapter: input.adapter, family: audit}
      # One branch per fact, in the Fact order, so the refusal names the first fact the profile
      # requires and the adapter did not prove.
      - name: fact-unserved-declared-insecure
        when: {exists: {in: required_facts, as: needed, that: needed == declared_insecure}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == declared_insecure}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: declared_insecure}
      - name: fact-unserved-paths-are-host-paths
        when: {exists: {in: required_facts, as: needed, that: needed == paths_are_host_paths}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == paths_are_host_paths}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: paths_are_host_paths}
      - name: fact-unserved-whole-tree-kill
        when: {exists: {in: required_facts, as: needed, that: needed == whole_tree_kill}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == whole_tree_kill}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: whole_tree_kill}
      - name: fact-unserved-local-permitted
        when: {exists: {in: required_facts, as: needed, that: needed == local_permitted}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == local_permitted}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: local_permitted}
      - name: fact-unserved-ipc-socket-allowlist
        when: {exists: {in: required_facts, as: needed, that: needed == ipc_socket_allowlist}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == ipc_socket_allowlist}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: ipc_socket_allowlist}
      - name: fact-unserved-ipc-signals-contained
        when: {exists: {in: required_facts, as: needed, that: needed == ipc_signals_contained}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == ipc_signals_contained}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: ipc_signals_contained}
      - name: fact-unserved-sealed-paths
        when: {exists: {in: required_facts, as: needed, that: needed == sealed_paths}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == sealed_paths}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: sealed_paths}
      - name: fact-unserved-exec-subpaths
        when: {exists: {in: required_facts, as: needed, that: needed == exec_subpaths}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == exec_subpaths}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: exec_subpaths}
      - name: fact-unserved-private-tmpdir
        when: {exists: {in: required_facts, as: needed, that: needed == private_tmpdir}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == private_tmpdir}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: private_tmpdir}
      - name: fact-unserved-host-network
        when: {exists: {in: required_facts, as: needed, that: needed == host_network}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == host_network}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: host_network}
      - name: fact-unserved-image-digest-pinned
        when: {exists: {in: required_facts, as: needed, that: needed == image_digest_pinned}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == image_digest_pinned}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: image_digest_pinned}
      # Design 32: a profile asking for a piped standard input requires `stdin_pipe`.
      - name: fact-unserved-stdin-pipe
        when: {exists: {in: required_facts, as: needed, that: needed == stdin_pipe}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == stdin_pipe}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: stdin_pipe}
      # Design 32: a profile asking for live output requires `output_live`.
      - name: fact-unserved-output-live
        when: {exists: {in: required_facts, as: needed, that: needed == output_live}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == output_live}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: output_live}
      # ADR 0051 decision 10: a profile asking for a change record requires `file_changes`.
      - name: fact-unserved-file-changes
        when: {exists: {in: required_facts, as: needed, that: needed == file_changes}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == file_changes}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: file_changes}
      # Decision 4: `local` is a configuration, not an absence. It runs only with a reason, and the
      # admission records it as declared insecure.
      - name: admitted-insecure
        when_related:
          via: input.adapter
          predicate: {exists: {in: facts, as: held, that: held == declared_insecure}}
        creates: substrate.confinement.Profile
        instance: profile
        sets:
          adapter: input.adapter
          inner: input.inner
          families: input.required_families
          facts: input.required_facts
          declared_insecure: true
          local_reason: input.local_reason
        emits: [substrate.confinement.ProfileAdmitted]
        payload:
          substrate.confinement.ProfileAdmitted:
            profile: {generated: true}
            adapter: input.adapter
            inner: input.inner
            families: input.required_families
            facts: input.required_facts
            declared_insecure: true
            local_reason: input.local_reason
      # A reason sent with a confined adapter is recorded as sent; it declares nothing.
      - name: admitted
        creates: substrate.confinement.Profile
        instance: profile
        sets:
          adapter: input.adapter
          inner: input.inner
          families: input.required_families
          facts: input.required_facts
          declared_insecure: false
          local_reason: input.local_reason
        emits: [substrate.confinement.ProfileAdmitted]
        payload:
          substrate.confinement.ProfileAdmitted:
            profile: {generated: true}
            adapter: input.adapter
            inner: input.inner
            families: input.required_families
            facts: input.required_facts
            declared_insecure: false
            local_reason: input.local_reason

  # `ConfinementAdapter::start` on an admitted profile, as far as the change record needs it: the
  # run becomes a writer of one directory, and the start states whether its profile asked for the
  # record. Admission is where asking is refused on an adapter that did not prove `file_changes`
  # (`AdmitProfile`, `fact-unserved-file-changes`), so no admitted profile asks where the fact is
  # absent; the model does not repeat that here (see the UNMAPPED note on `Run`).
  - name: substrate.confinement.StartRun
    input:
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      - {name: records_file_changes, type: Boolean}
    outcomes:
      - name: started
        creates: substrate.confinement.Run
        instance: run
        sets:
          directory: input.directory
          records_file_changes: input.records_file_changes
        emits: [substrate.confinement.RunStarted]
        payload:
          substrate.confinement.RunStarted:
            run: {generated: true}
            directory: input.directory
            records_file_changes: input.records_file_changes

  # The driver takes the before side of a run that asked for the record: it digests every covered
  # mount and keeps the content the bounds admit (ADR 0051 decisions 1 and 6). The driver does
  # this before it releases the run's launch barrier; the model writes it as a step after
  # `StartRun` because one outcome creates one row. A run whose profile did not ask gets the
  # `not requested` answer and no row.
  - name: substrate.confinement.OpenChangeRecord
    input:
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
    outcomes:
      - name: unknown-run
        when_related: {via: input.run, exists: false}
        error: substrate.confinement.RunNotFound
        payload:
          substrate.confinement.RunNotFound: {run: input.run}
      - name: not-requested
        when_related: {via: input.run, predicate: records_file_changes == false}
        error: substrate.confinement.ChangeRecordNotRequested
        payload:
          substrate.confinement.ChangeRecordNotRequested: {run: input.run}
      - name: opened
        creates: substrate.confinement.ChangeRecord
        instance: record
        sets:
          run: input.run
          directory: input.directory
          mounts: []
          changes: []
        emits: [substrate.confinement.ChangeRecordOpened]
        payload:
          substrate.confinement.ChangeRecordOpened:
            record: {generated: true}
            run: input.run
            directory: input.directory

  # The run's end as the adapter observes it: no process of the run remains, so it writes its
  # directory no longer. Two runs overlap exactly when the one that ends first ends while the
  # other still runs, so this is where a second writer is seen: every pending record of that
  # directory, the ending run's own and the other's, becomes unavailable with the reason
  # `second-writer` and lists no change (ADR 0051 decision 2).
  - name: substrate.confinement.EndRun
    input:
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
    outcomes:
      - name: ended-beside-a-writer
        when_related:
          entity: substrate.confinement.Run
          where: {all: [directory == input.directory, state == Running]}
          count: {gte: 2}
        moves: substrate.confinement.Run.end
        instance: run
        affects:
          - entity: substrate.confinement.ChangeRecord
            where: {all: [directory == input.directory, state == Pending]}
            moves: substrate.confinement.ChangeRecord.withhold
            sets:
              reason: second-writer
        emits: [substrate.confinement.RunEnded]
        payload:
          substrate.confinement.RunEnded: {run: input.run}
      - name: ended
        moves: substrate.confinement.Run.end
        instance: run
        emits: [substrate.confinement.RunEnded]
        payload:
          substrate.confinement.RunEnded: {run: input.run}
      - name: unknown-run
        unknown_instance: true
        error: substrate.confinement.RunNotFound
        payload:
          substrate.confinement.RunNotFound: {run: input.run}
      - name: already-ended
        wrong_state: true
        error: substrate.confinement.RunNotFound
        payload:
          substrate.confinement.RunNotFound: {run: input.run}

  # The end walk's result, written once per pending record. The input states what the driver
  # observed (the two instants, the changes its two tree digests differ by, and the reason it
  # could not say them, where it could not), so a scenario's settle step is the record a runner
  # holding a real adapter compares the adapter's own record with. A record a second writer
  # already made unavailable is not written again.
  # UNMAPPED: the bounds (paths per run, content bytes, tree size, walk time) are the driver's
  # named constants (ADR 0051 decision 5); the model takes the reason an overrun gives as input.
  # UNMAPPED: the driver settles only after the run ended. The model does not refuse a settle
  # step on a running run: its guard would read the run's row beside the record's own state.
  - name: substrate.confinement.SettleChangeRecord
    input:
      - {name: record, type: substrate.confinement.ChangeRecordKey}
      - {name: started_at, type: Timestamp}
      - {name: ended_at, type: Timestamp}
      - {name: mounts, type: "List<substrate.confinement.CoveredMount>"}
      - {name: changes, type: "List<substrate.confinement.FileChange>"}
      - {name: unavailable, type: "Optional<substrate.confinement.ChangeRecordUnavailable>"}
    outcomes:
      - name: unavailable
        when: {unavailable: {defined: true}}
        moves: substrate.confinement.ChangeRecord.withhold
        instance: record
        sets:
          started_at: input.started_at
          ended_at: input.ended_at
          mounts: input.mounts
          reason: input.unavailable
        emits: [substrate.confinement.FileChangesUnavailable]
        payload:
          substrate.confinement.FileChangesUnavailable:
            run: {subject: run}
            reason: input.unavailable
      - name: available
        moves: substrate.confinement.ChangeRecord.settle
        instance: record
        sets:
          started_at: input.started_at
          ended_at: input.ended_at
          mounts: input.mounts
          changes: input.changes
        emits: [substrate.confinement.FileChangesRecorded]
        payload:
          substrate.confinement.FileChangesRecorded:
            run: {subject: run}
      - name: unknown-record
        unknown_instance: true
        error: substrate.confinement.ChangeRecordSettled
        payload:
          substrate.confinement.ChangeRecordSettled: {record: input.record}
      - name: already-settled
        wrong_state: true
        error: substrate.confinement.ChangeRecordSettled
        payload:
          substrate.confinement.ChangeRecordSettled: {record: input.record}

events:
  # The audit record of a start (`AuditRecord::RunStarted`), as far as the model reads it.
  - name: substrate.confinement.RunStarted
    fields:
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
      - {name: records_file_changes, type: Boolean}
  # The model's own marks of a run's end and of a record's opening. Neither is an audit record:
  # the record of a run's end is another design's, and ADR 0051 adds none for the before side.
  - name: substrate.confinement.RunEnded
    fields:
      - {name: run, type: substrate.confinement.RunId}
  - name: substrate.confinement.ChangeRecordOpened
    fields:
      - {name: record, type: substrate.confinement.ChangeRecordKey}
      - {name: run, type: substrate.confinement.RunId}
      - {name: directory, type: substrate.confinement.WrittenDirectory}
  # The audit record of a complete change record (ADR 0051 decision 12). The audit record
  # carries the run and the count of changed paths, never a path and never content.
  # UNMAPPED: the count. ESS 0.86.0 refuses a list's length as a payload value
  # (`input.changes.count`: `undeclared_reference`), so the model's event carries the run only
  # and the adapter's tests hold the count.
  - name: substrate.confinement.FileChangesRecorded
    fields:
      - {name: run, type: substrate.confinement.RunId}
  # The audit record of a change record that could not be made, with the named reason.
  - name: substrate.confinement.FileChangesUnavailable
    fields:
      - {name: run, type: substrate.confinement.RunId}
      - {name: reason, type: substrate.confinement.ChangeRecordUnavailable}
  - name: substrate.confinement.AdapterOpened
    fields:
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: served_families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
  # The audit record of an admission (ADR 0109 decision 2).
  - name: substrate.confinement.ProfileAdmitted
    fields:
      - {name: profile, type: substrate.confinement.ProfileId}
      - {name: adapter, type: substrate.confinement.AdapterName}
      - {name: inner, type: "Optional<substrate.confinement.InnerAdapter>"}
      - {name: families, type: "List<substrate.confinement.ContractFamily>"}
      - {name: facts, type: "List<substrate.confinement.Fact>"}
      - {name: declared_insecure, type: Boolean}
      - {name: local_reason, type: "Optional<String>"}
