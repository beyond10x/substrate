          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: whole_tree_kill}
      - name: fact-unserved-local-permitted
        when: {exists: {in: required_facts, as: needed, that: needed == local_permitted}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == local_permitted}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: local_permitted}
      - name: fact-unserved-ipc-socket-allowlist
        when: {exists: {in: required_facts, as: needed, that: needed == ipc_socket_allowlist}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == ipc_socket_allowlist}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: ipc_socket_allowlist}
      - name: fact-unserved-ipc-signals-contained
        when: {exists: {in: required_facts, as: needed, that: needed == ipc_signals_contained}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == ipc_signals_contained}}}
        error: substrate.confinement.FactUnserved
        payload:
          substrate.confinement.FactUnserved: {adapter: input.adapter, fact: ipc_signals_contained}
      - name: fact-unserved-sealed-paths
        when: {exists: {in: required_facts, as: needed, that: needed == sealed_paths}}
        when_related:
          via: input.adapter
          predicate: {not: {exists: {in: facts, as: held, that: held == sealed_paths}}}
        error: substrate.confinement.FactUnserved
        payload:
