# substrate-host owns the confinement contract (atlas ADR 0109 decision 1, ADR 0044). A client
# reaches it through substrate-host's Rust API (`confinement::open`, then admission), not through
# the wire: `reached_by` stays the in-process default, and no route or bundle is derived from it.
components:
  - component: substrate-host
    summary: Opens a confinement adapter, proves its contract families and facts, admits or refuses a profile against them, and records what a run changed in the mounts it may write.
    owns:
      domains: [substrate.confinement]
    accepts:
      commands:
        - substrate.confinement.OpenAdapter
        - substrate.confinement.AdmitProfile
        - substrate.confinement.StartRun
        - substrate.confinement.OpenChangeRecord
        - substrate.confinement.EndRun
        - substrate.confinement.SettleChangeRecord
    publishes:
      events:
        - substrate.confinement.AdapterOpened
        - substrate.confinement.ProfileAdmitted
        - substrate.confinement.RunStarted
        - substrate.confinement.ChangeRecordOpened
        - substrate.confinement.RunEnded
        - substrate.confinement.FileChangesRecorded
        - substrate.confinement.FileChangesUnavailable
