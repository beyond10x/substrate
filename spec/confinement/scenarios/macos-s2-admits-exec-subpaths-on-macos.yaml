# S2, `story:macos-seatbelt-policy-runs-cargo-test`: `macos` proves `exec_subpaths`. This admission
# passes on the macos lane once S2's adapter is in place.
type: ess-scenario/5
domain: substrate.confinement
scenario: macos-s2-admits-exec-subpaths-on-macos
summary: "lane macos: macos admits a profile requiring exec_subpaths."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      facts: [paths_are_host_paths, ipc_signals_contained, sealed_paths, exec_subpaths, private_tmpdir]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      required_families: [process_run, filesystem_view]
      required_facts: [exec_subpaths]
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: macos
          families: [process_run, filesystem_view]
          facts: [exec_subpaths]
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: macos
      facts: [exec_subpaths]
      declared_insecure: false
