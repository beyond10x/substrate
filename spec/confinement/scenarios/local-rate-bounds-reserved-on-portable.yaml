# ADR 0109 F1 B: the profile reserves rate bounds; setting one is refused until a later story fills
# the field. `local` is the adapter that always opens.
type: ess-scenario/5
domain: substrate.confinement
scenario: local-rate-bounds-reserved-on-portable
summary: "lane portable: a local profile that sets rate_bounds is refused confinement.reserved-field-unserved naming rate-bounds."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      served_families: [process_run, process_watch, output_read, wait, workspace, audit]
      facts: [declared_insecure, paths_are_host_paths, local_permitted, host_network]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      required_families: [process_run]
      required_facts: []
      local_reason: the operator runs this task on the developer's own machine
      rate_bounds: {read_bytes_per_second: 1048576}
    outcome: rate-bounds-reserved
    error:
      name: substrate.confinement.ReservedFieldUnserved
      fields: {field: rate-bounds}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
