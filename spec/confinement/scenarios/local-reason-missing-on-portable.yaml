# ADR 0109 decision 4: `local` is requested by name with a reason. Without one it is refused, and
# nothing is admitted.
type: ess-scenario/5
domain: substrate.confinement
scenario: local-reason-missing-on-portable
summary: "lane portable: local without a reason is refused confinement.local-reason-missing, and no profile is admitted."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      served_families: [process_run, process_watch, output_read, wait, workspace, audit]
      facts: [declared_insecure, paths_are_host_paths, local_permitted, host_network, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      required_families: [process_run]
      required_facts: []
    outcome: local-reason-missing
    error:
      name: substrate.confinement.LocalReasonMissing
      fields: {adapter: local}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
