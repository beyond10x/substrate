# `linux` serves `network_egress` only when the operator declared an egress aperture
# (`exec.egress-apertures`, `crates/substrate-host/src/probe.rs`). Setup: the runner declares one.
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-admits-network-egress-with-aperture-on-delegated
summary: "lane delegated: linux with a declared egress aperture admits a profile requiring network_egress."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, network_egress, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run, network_egress]
      required_facts: []
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: linux
          families: [process_run, network_egress]
          facts: []
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: linux
      families: [process_run, network_egress]
      declared_insecure: false
