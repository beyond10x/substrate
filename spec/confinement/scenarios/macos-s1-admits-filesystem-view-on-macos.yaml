# S1, `story:macos-adapter-on-seatbelt`: `macos` serves a filesystem view through the platform
# sandbox (ADR 0037). The open step is the final declared set, after
# `story:macos-seatbelt-policy-runs-cargo-test`.
type: ess-scenario/5
domain: substrate.confinement
scenario: macos-s1-admits-filesystem-view-on-macos
summary: "lane macos: macos admits a profile requiring a filesystem view with host paths and contained signals, reported declared_insecure: false."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      facts: [paths_are_host_paths, ipc_signals_contained, sealed_paths, exec_subpaths, private_tmpdir, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      required_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      required_facts: [paths_are_host_paths, ipc_signals_contained]
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: macos
          families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
          facts: [paths_are_host_paths, ipc_signals_contained]
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: macos
      families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      declared_insecure: false
