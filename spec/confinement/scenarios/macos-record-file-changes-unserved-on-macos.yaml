# ADR 0051 decision 9: `macos` does not serve the change record. No story proves the two tree
# digests and the kept before side under Seatbelt, so a profile requiring `file_changes` is
# refused `confinement.fact-unserved` before anything runs.
type: ess-scenario/5
domain: substrate.confinement
scenario: macos-record-file-changes-unserved-on-macos
summary: "lane macos: macos, asked for file_changes, is refused confinement.fact-unserved naming file_changes."

timeline:
  - at: 2026-11-21T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      facts: [paths_are_host_paths, ipc_signals_contained, sealed_paths, exec_subpaths, private_tmpdir, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-11-21T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      required_families: [process_run]
      required_facts: [file_changes]
    outcome: fact-unserved-file-changes
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: macos, fact: file_changes}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
