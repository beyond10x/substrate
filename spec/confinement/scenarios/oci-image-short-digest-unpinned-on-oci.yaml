# `story:oci-adapter`: the adapter runs only a digest, and a sha256 digest is 64 lowercase hex
# characters. A reference whose `@sha256:` is followed by a hex text too short to be one is refused
# `confinement.image-unpinned`, though it ends with a hex character.
type: ess-scenario/5
domain: substrate.confinement
scenario: oci-image-short-digest-unpinned-on-oci
summary: "lane oci: oci with an image whose @sha256: carries a short hex text is refused confinement.image-unpinned."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: oci
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [image_digest_pinned]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: oci
      required_families: [process_run]
      required_facts: []
      image: "registry.invalid/run@sha256:abc"
    outcome: image-unpinned
    error:
      name: substrate.confinement.ImageUnpinned
      fields: {adapter: oci}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
