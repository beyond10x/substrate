# Setup: the runner is on macOS. `linux` needs Linux namespaces and cgroups, so
# `confinement::open(linux)` is refused (off Linux, `HostDriver::open` refuses
# `host.platform-unserved`, `crates/substrate-host/src/unsupported.rs`), and a profile on it is
# refused the same.
type: ess-scenario/5
domain: substrate.confinement
scenario: absent-linux-off-linux-on-macos
summary: "lane macos: on macOS, opening linux is refused confinement.adapter-unserved, and a profile on linux is refused the same."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe, output_live]
    outcome: unserved
    error:
      name: substrate.confinement.AdapterUnserved
      fields: {adapter: linux}
    no_events: [substrate.confinement.AdapterOpened]
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: []
    outcome: adapter-not-open
    error:
      name: substrate.confinement.AdapterUnserved
      fields: {adapter: linux}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Adapters
    counts: {at_most: 0}
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
