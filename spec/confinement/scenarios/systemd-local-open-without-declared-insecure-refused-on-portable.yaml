# The systemd story: wrapping `local` is still reported declared insecure. An open of `systemd`
# around `local` whose proved set lacks `declared_insecure` is refused by that fact's name.
type: ess-scenario/5
domain: substrate.confinement
scenario: systemd-local-open-without-declared-insecure-refused-on-portable
summary: "lane portable: opening systemd around local without the declared_insecure fact is refused confinement.fact-unserved naming declared_insecure, and no adapter opens."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: systemd
      inner: local
      served_families: [process_run, process_watch, output_read, wait, workspace, limits, audit]
      facts: [paths_are_host_paths, whole_tree_kill, local_permitted, host_network, stdin_pipe, output_live]
    outcome: systemd-local-not-declared-insecure
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: systemd, fact: declared_insecure}
    no_events: [substrate.confinement.AdapterOpened]

assert:
  - view: substrate.confinement.Adapters
    counts: {at_most: 0}
