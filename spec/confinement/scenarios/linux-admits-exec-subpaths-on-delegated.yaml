# Design 35 (`story:linux-executable-allow-list`): `linux` proves `exec_subpaths` where its probe
# held a run to an allow-list with the configured helper. This is the admission; that a listed
# program runs and one outside the list does not is a case of the delegated lane, because the
# model admits profiles and runs no program.
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-admits-exec-subpaths-on-delegated
summary: "lane delegated: linux admits a profile requiring exec_subpaths, reported declared_insecure: false."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-11-21T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, exec_subpaths, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-11-21T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run, filesystem_view]
      required_facts: [exec_subpaths]
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: linux
          families: [process_run, filesystem_view]
          facts: [exec_subpaths]
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: linux
      facts: [exec_subpaths]
      declared_insecure: false
