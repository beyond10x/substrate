# The S0 story: `linux` mounts the workspace at its own path inside the sandbox, so it does not
# prove `paths_are_host_paths`; a profile requiring it is refused `confinement.fact-unserved`.
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-paths-are-host-paths-unserved-on-delegated
summary: "lane delegated: linux, asked for paths_are_host_paths, is refused confinement.fact-unserved naming paths_are_host_paths."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: [paths_are_host_paths]
    outcome: fact-unserved-paths-are-host-paths
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: linux, fact: paths_are_host_paths}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
