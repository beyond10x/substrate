# `linux` runs in its own network namespace (`--unshare-net`), so it never proves `host_network`; a
# profile requiring it is refused `confinement.fact-unserved` (ADR 0109 decision 2).
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-host-network-unserved-on-delegated
summary: "lane delegated: linux, asked for host_network, is refused confinement.fact-unserved naming host_network."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: [host_network]
    outcome: fact-unserved-host-network
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: linux, fact: host_network}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
