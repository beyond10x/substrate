# `macos` has no whole-tree kill (ADR 0037); a profile requiring it is refused
# `confinement.fact-unserved` (ADR 0109 decision 2).
type: ess-scenario/5
domain: substrate.confinement
scenario: macos-s1-whole-tree-kill-unserved-on-macos
summary: "lane macos: macos, asked for whole_tree_kill, is refused confinement.fact-unserved naming whole_tree_kill."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      facts: [paths_are_host_paths, ipc_signals_contained, sealed_paths, exec_subpaths, private_tmpdir]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      required_families: [process_run]
      required_facts: [whole_tree_kill]
    outcome: fact-unserved-whole-tree-kill
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: macos, fact: whole_tree_kill}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
