# `linux` is confined, so it never proves `declared_insecure` (ADR 0109 decision 4); a profile
# requiring it is refused `confinement.fact-unserved` (decision 2).
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-declared-insecure-unserved-on-delegated
summary: "lane delegated: linux, asked for declared_insecure, is refused confinement.fact-unserved naming declared_insecure."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: [declared_insecure]
    outcome: fact-unserved-declared-insecure
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: linux, fact: declared_insecure}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
