# `local` claims no confinement (ADR 0109 decision 4): a run may open any socket family, so a
# profile requiring `ipc_socket_allowlist` is refused `confinement.fact-unserved`.
type: ess-scenario/5
domain: substrate.confinement
scenario: local-ipc-socket-allowlist-unserved-on-portable
summary: "lane portable: local with a reason, asked for ipc_socket_allowlist, is refused confinement.fact-unserved naming ipc_socket_allowlist."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      served_families: [process_run, process_watch, output_read, wait, workspace, audit]
      facts: [declared_insecure, paths_are_host_paths, local_permitted, host_network, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      required_families: [process_run]
      required_facts: [ipc_socket_allowlist]
      local_reason: the operator runs this task on the developer's own machine
    outcome: fact-unserved-ipc-socket-allowlist
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: local, fact: ipc_socket_allowlist}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
