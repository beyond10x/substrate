# Design 32 (`story:adapter-stdin-pipe`), the macos I/O stage: the confined run inherits descriptor
# 0 as a pipe. `macos` declares `stdin_pipe` once the macos lane proves a confined `cat` reads it.
type: ess-scenario/5
domain: substrate.confinement
scenario: macos-io-admits-stdin-pipe-on-macos
summary: "lane macos: macos admits a profile requiring stdin_pipe, reported declared_insecure: false."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-10-28T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, audit]
      facts: [paths_are_host_paths, ipc_signals_contained, sealed_paths, exec_subpaths, private_tmpdir, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-28T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: macos
      required_families: [process_run]
      required_facts: [stdin_pipe]
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: macos
          families: [process_run]
          facts: [stdin_pipe]
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: macos
      facts: [stdin_pipe]
      declared_insecure: false
