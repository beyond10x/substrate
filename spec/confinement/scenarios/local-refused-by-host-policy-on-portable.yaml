# ADR 0109 F3 A: the host can refuse `local` through a policy fact it sets (inside `pod`, on a
# shared CI worker). `local` still opens, without `local_permitted`, and a profile on it is refused
# even with a reason. The runner sets the host's policy fact to forbid `local`.
type: ess-scenario/5
domain: substrate.confinement
scenario: local-refused-by-host-policy-on-portable
summary: "lane portable: on a host whose policy fact forbids local, local with a reason is refused confinement.local-refused, and no profile is admitted."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      served_families: [process_run, process_watch, output_read, wait, workspace, audit]
      facts: [declared_insecure, paths_are_host_paths, host_network, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      required_families: [process_run]
      required_facts: []
      local_reason: the operator runs this task on the developer's own machine
    outcome: local-refused
    error:
      name: substrate.confinement.LocalRefused
      fields: {adapter: local}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
