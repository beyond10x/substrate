# `linux` runs host programs, not images (ADR 0109 decision 5 gives images to `oci` and `pod`), so a
# profile requiring `image_digest_pinned` is refused `confinement.fact-unserved`.
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-image-digest-pinned-unserved-on-delegated
summary: "lane delegated: linux, asked for image_digest_pinned, is refused confinement.fact-unserved naming image_digest_pinned."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: [image_digest_pinned]
    outcome: fact-unserved-image-digest-pinned
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: linux, fact: image_digest_pinned}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
