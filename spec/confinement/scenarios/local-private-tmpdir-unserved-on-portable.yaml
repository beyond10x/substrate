# `local` claims no confinement (ADR 0109 decision 4): a run sees the host's temporary directory, so
# a profile requiring `private_tmpdir` is refused `confinement.fact-unserved`.
type: ess-scenario/5
domain: substrate.confinement
scenario: local-private-tmpdir-unserved-on-portable
summary: "lane portable: local with a reason, asked for private_tmpdir, is refused confinement.fact-unserved naming private_tmpdir."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      served_families: [process_run, process_watch, output_read, wait, workspace, audit]
      facts: [declared_insecure, paths_are_host_paths, local_permitted, host_network, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: local
      required_families: [process_run]
      required_facts: [private_tmpdir]
      local_reason: the operator runs this task on the developer's own machine
    outcome: fact-unserved-private-tmpdir
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: local, fact: private_tmpdir}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
