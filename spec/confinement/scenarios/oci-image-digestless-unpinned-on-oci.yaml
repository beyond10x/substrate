# Adversary probe: `@sha256:` with no digest after it names no digest; the oci story runs "only a
# digest", so the reference must be refused confinement.image-unpinned.
type: ess-scenario/5
domain: substrate.confinement
scenario: oci-image-digestless-unpinned-on-oci
summary: "lane oci: oci with an image whose @sha256: carries no digest is refused confinement.image-unpinned."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: oci
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [image_digest_pinned, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: oci
      required_families: [process_run]
      required_facts: []
      image: "registry.invalid/run@sha256:"
    outcome: image-unpinned
    error:
      name: substrate.confinement.ImageUnpinned
      fields: {adapter: oci}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
