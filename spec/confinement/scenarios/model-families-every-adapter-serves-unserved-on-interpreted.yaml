# Model only. Every declared adapter serves process_run, process_watch, output_read, wait, workspace
# and audit, so no adapter lane can reach their `confinement.family-unserved` refusals. This scenario
# opens an adapter row that serves none of them and checks that each is refused by its own name. It
# runs only against the interpreted reference: no adapter lane selects a `model-*` scenario, because
# no real adapter opens with this set.
type: ess-scenario/5
domain: substrate.confinement
scenario: model-families-every-adapter-serves-unserved-on-interpreted
summary: "lane interpreted: an adapter row serving none of the six families every adapter declares refuses each of them confinement.family-unserved by name."

timeline:
