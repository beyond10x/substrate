# `local_permitted` is the host's policy fact for `local` (ADR 0109 F3 A); only `local`, bare or
# inside `systemd`, carries it. A `linux` profile requiring it is refused `confinement.fact-unserved`.
type: ess-scenario/5
domain: substrate.confinement
scenario: linux-local-permitted-unserved-on-delegated
summary: "lane delegated: linux, asked for local_permitted, is refused confinement.fact-unserved naming local_permitted."

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe, output_live]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: linux
      required_families: [process_run]
      required_facts: [local_permitted]
    outcome: fact-unserved-local-permitted
    error:
      name: substrate.confinement.FactUnserved
      fields: {adapter: linux, fact: local_permitted}
    no_events: [substrate.confinement.ProfileAdmitted]

assert:
  - view: substrate.confinement.Profiles
    counts: {at_most: 0}
