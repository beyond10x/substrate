# `systemd { inner: linux }` (`story:systemd-scope-bounds-provider`): the scope provides the bounds
# around `linux`, which keeps its own confinement; the declared set is `linux`'s.
type: ess-scenario/5
domain: substrate.confinement
scenario: systemd-linux-admits-limits-on-delegated
summary: "lane delegated: systemd around linux admits a filesystem view with limits and whole-tree kill, reported declared_insecure: false."

arrange:
  - instance: run
    entity: substrate.confinement.Profile

timeline:
  - at: 2026-10-27T09:00:00Z
    command: substrate.confinement.OpenAdapter
    actor: substrate.confinement.Embedder
    input:
      adapter: systemd
      inner: linux
      served_families: [process_run, process_watch, output_read, wait, workspace, filesystem_view, limits, audit]
      facts: [whole_tree_kill, ipc_socket_allowlist, ipc_signals_contained, stdin_pipe]
    outcome: opened
  - at: 2026-10-27T09:00:01Z
    command: substrate.confinement.AdmitProfile
    actor: substrate.confinement.Embedder
    input:
      adapter: systemd
      inner: linux
      required_families: [process_run, filesystem_view, limits]
      required_facts: [whole_tree_kill]
    outcome: admitted
    events:
      - event: substrate.confinement.ProfileAdmitted
        payload:
          adapter: systemd
          inner: linux
          families: [process_run, filesystem_view, limits]
          facts: [whole_tree_kill]
          declared_insecure: false
    capture: {instance: run, event: substrate.confinement.ProfileAdmitted, field: profile}

assert:
  - view: substrate.confinement.Profiles
    contains:
      profile: {$instance: run}
      adapter: systemd
      inner: linux
      declared_insecure: false
