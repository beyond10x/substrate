[workspace]
members = [
    "crates/substrate-wire",
    "crates/substrate-store",
    "crates/substrate-host",
    "crates/substrate-daemon",
    "crates/substrate-contract-check",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/substrate"
rust-version = "1.97"
version = "0.2.4"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.23"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "2.1"
fancy-regex = "0.19"
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
http = "1.3"
http-body-util = "0.1"
jsonschema = { version = "=0.49.9", default-features = false }
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
libc = "0.2"
nix = { version = "0.30", features = ["fs", "term", "user"] }
parking_lot = "0.12"
pulldown-cmark = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
rustsec = { version = "0.33", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
zeroize = "1"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = "1.0"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = { version = "1.2", features = ["serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[patch.crates-io]
# Axum 0.8.9 leaves Hyper's default features on even when the application selects only Axum's
# `http1` feature. The local source is the published crate with only those two dependency-default
# switches disabled plus one source-spelling-only secret-scan fixture split;
# `vendor/axum-0.8.9/README.substrate.md` records the fence.
axum = { path = "vendor/axum-0.8.9" }
