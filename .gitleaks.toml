# Gitleaks configuration for the credential scan `scripts/check-secrets.sh` runs before a release
# (AGENTS.md, section "Source").
#
# The default rule set is kept in full. One narrow exception is added, and the reason it is narrow
# is the point: an allowlist is the one place where a scanner stops being evidence, so it names a
# single rule and a single family of paths rather than a directory or a file type.

[extend]
useDefault = true

[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '''\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.(?:[a-zA-Z0-9\/\\_-]{10,}={0,2})?)(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["ey"]

  [rules.allowlist]
  description = """
  The delegated-context conformance vectors are JWTs by definition: ADR 0011 fixes the document as
  a compact JWS, so a vector that proves substrate verifies one has to contain one. They carry no
  credential. Each is signed by a key whose seed is the SHA-256 of a sentence published in this
  repository (crates/substrate-daemon/tests/runtime_vectors.rs:2405-2409), so there is nothing to
  leak and nothing to rotate, and each is bound to a test subject that exists only in the vector.

  Scoped to the `jwt` rule and to the delegated-context vectors alone. A JWT anywhere else in the
  repository -- including any other vector -- is still a finding.
  """
  paths = [
    '''^contracts/substrate-wire/[0-9.]+/vectors/http/delegated-context-[a-z-]+\.json$''',
    '''^xtask/bundle-source/[0-9.]+/documents/vectors/http/delegated-context-[a-z-]+\.json$''',
  ]
