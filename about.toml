# The daemon image redistributes the locked Rust graph. Only permissive licences reviewed for that
# graph are accepted; a dependency update that introduces another expression stops the gate until
# its terms are reviewed explicitly.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

workarounds = ["ring"]
