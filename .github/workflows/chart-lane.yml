name: Chart lane

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/**
      - Dockerfile
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - vendor/**
      - crates/**
      - xtask/Cargo.toml
      - xtask/src/main.rs
      - xtask/src/repo.rs
      - xtask/src/chart.rs
      - xtask/src/chart_adversary.rs
      - xtask/src/chart_cluster.rs
      - xtask/src/chart_yaml.rs
      - xtask/src/lane_record.rs
      - .github/workflows/chart-lane.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-lane-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HELM_VERSION: v3.22.1
  HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  CHART_LANE_CLUSTER: substrate-chart-lane
  CHART_LANE_IMAGE: b10x-substrate-daemon:chart-lane

jobs:
  static:
    name: Chart static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          cargo --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: substrate-chart-lane-v1
          shared-key: chart-lane
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"

      - name: Install the pinned Helm release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm-download" "$RUNNER_TEMP/helm-bin"
          curl --fail --location --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output "$RUNNER_TEMP/helm-download/helm.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm-download/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm-download/helm.tar.gz" -C "$RUNNER_TEMP/helm-download" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/helm-download/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helm-bin/helm" version

      - name: Chart tests
        run: cargo test --release --locked -p xtask -- chart

      - name: Chart static lane
        run: cargo run --release --locked -p xtask -- chart-lane static --helm "$RUNNER_TEMP/helm-bin/helm"

  cluster:
    name: Chart cluster scenarios
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          cargo --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: substrate-chart-lane-v1
          shared-key: chart-lane
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"
          save-if: "false"

      - name: Install the pinned Helm and kind releases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm-download" "$RUNNER_TEMP/lane-bin"
          curl --fail --location --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output "$RUNNER_TEMP/helm-download/helm.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm-download/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm-download/helm.tar.gz" -C "$RUNNER_TEMP/helm-download" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/helm-download/linux-amd64/helm" "$RUNNER_TEMP/lane-bin/helm"
          curl --fail --location --retry 3 "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64" --output "$RUNNER_TEMP/lane-bin/kind"
          echo "$KIND_SHA256  $RUNNER_TEMP/lane-bin/kind" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/lane-bin/kind"
          echo "$RUNNER_TEMP/lane-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lane-bin/helm" version
          "$RUNNER_TEMP/lane-bin/kind" version

      - name: Build the daemon image from this commit
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --target daemon \
            --platform linux/amd64 \
            --build-arg "SOURCE_SHA=${GITHUB_SHA}" \
            --tag "$CHART_LANE_IMAGE" \
            --provenance=false \
            --sbom=false \
            --load \
            .

      - name: Chart cluster lane
        run: |
          cargo run --release --locked -p xtask -- chart-lane cluster \
            --image "$CHART_LANE_IMAGE" \
            --node-image "$KIND_NODE_IMAGE" \
            --cluster "$CHART_LANE_CLUSTER" \
            --kind "$RUNNER_TEMP/lane-bin/kind" \
            --helm "$RUNNER_TEMP/lane-bin/helm"

      - name: Delete the lane cluster
        if: always()
        run: |
          if "$RUNNER_TEMP/lane-bin/kind" get clusters | grep -qx "$CHART_LANE_CLUSTER"; then
            "$RUNNER_TEMP/lane-bin/kind" delete cluster --name "$CHART_LANE_CLUSTER"
          fi
