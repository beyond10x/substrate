# Lanes. The suite has a portable lane and a delegated lane. `scripts/gate.sh` runs the clean-room
# runner `crates/substrate-daemon/tests/runtime_vectors.rs` inside `cargo test --workspace`, with
# no `SUBSTRATE_VECTORS_CGROUP_ROOT`, so it takes its portable branch and asserts the named
# refusal `exec.sandbox-unavailable` (501) instead of confining anything. The delegated lane
# needs the runner to sit *inside* a delegated
# cgroup subtree carrying `cpu`/`memory`/`pids`, plus bubblewrap (README.md § "Serving exec"),
# which a hosted GitHub runner does not provide — the ubuntu-24.04 image README lists no
# bubblewrap among its installed apt packages, and the step below probes rather than assumes.
# This workflow therefore reports the delegated lane **absent**, never passed —
# invariant 3: a missing isolation guarantee is a named refusal, never silent degradation. Whether
# it gets a self-hosted runner is the open question on `story:ci-runs-the-full-gate`; the default
# is that it stays a local pre-release step.
#
# The lane statement appears twice in the log: the "Report execution lanes" step prints the probed
# host facts before the gate, and "Lane summary" restates the outcome and writes it to the run's
# job summary.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded pull-request run carries no evidence; a superseded push to main does — it is the
  # gate record for that commit — so only pull-request runs are cancelled.
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate-tests:
    name: "Gate: tests and Clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      SUBSTRATE_OCI_LANE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=1.97
          if [ -f rust-toolchain.toml ]; then
            channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
            if [ -z "$channel" ]; then
              echo "rust-toolchain.toml exists but declares no [toolchain] channel" >&2
              exit 1
            fi
            echo "toolchain channel from rust-toolchain.toml: $channel"
          else
            echo "no rust-toolchain.toml; using the Cargo.toml rust-version pin: $channel"
          fi
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: substrate-gate-v1
          shared-key: full-gate
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"

      # Probed, not assumed: the ubuntu-24.04 image README lists no bubblewrap among its installed
      # apt packages, and a hosted runner is not inside a delegated cgroup subtree. This step
      # records what is actually there so the log carries evidence rather than a claim.
      - name: Report execution lanes
        run: |
          echo "== host facts =="
          if command -v bwrap >/dev/null 2>&1; then
            echo "bubblewrap: present at $(command -v bwrap) — $(bwrap --version 2>&1 | head -1)"
          else
            echo "bubblewrap: absent"
          fi
          echo "cgroup v2 root controllers: $(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null || echo '<unreadable>')"
          echo "this process cgroup: $(cat /proc/self/cgroup 2>/dev/null || echo '<unreadable>')"
          echo
          echo "== lanes this job will run =="
          echo "portable lane:  RUNS   — cargo test runs tests/runtime_vectors.rs with no SUBSTRATE_VECTORS_CGROUP_ROOT"
          echo "delegated lane: ABSENT — no delegated cgroup root is passed; the lane is not executed and is not claimed to pass"
          if command -v docker >/dev/null 2>&1 && docker info --format '{{.ServerVersion}}' >/dev/null 2>&1; then
            echo "oci lane:       RUNS   — SUBSTRATE_OCI_LANE=1 against Docker $(docker info --format '{{.ServerVersion}}'); an unusable runtime fails the oci cases"
          else
            echo "oci lane:       RUNS   — SUBSTRATE_OCI_LANE=1, and no usable Docker answers here, so the oci cases fail rather than report ABSENT"
          fi

      # Bare invocation: the job fails with the gate's own exit status. Do not add a pipeline here.
      - name: Run the gate's tests phase
        id: gate
        run: bash scripts/gate.sh tests

      # The gate stops at its first failing step, so the portable lane's outcome is the gate step's
      # outcome and nothing stronger is claimed. The delegated line is unconditional: it did not run.
      - name: Lane summary
        if: always()
        run: |
          {
            echo "### Gate lanes"
            echo
            echo "| lane | outcome |"
            echo "| --- | --- |"
            echo "| portable | \`${{ steps.gate.outcome }}\` — carried by the gate step; its log shows how far the gate got |"
            echo "| delegated (bubblewrap + cgroup delegation) | **absent** — not executed on a hosted runner, and never reported as passed |"
            echo "| oci (\`SUBSTRATE_OCI_LANE=1\`, Docker) | \`${{ steps.gate.outcome }}\` — carried by the gate step's \`cargo test\`; real containers, never ABSENT on this job |"
            echo
            echo "The delegated lane needs a runner inside a delegated cgroup subtree carrying \`cpu\`, \`memory\` and \`pids\`; see README.md, section \"Serving exec\"."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "portable lane: ${{ steps.gate.outcome }} (the gate step). oci lane: ${{ steps.gate.outcome }} (the gate step). delegated lane: absent — not executed, not passed."

  gate-static:
    name: "Gate: static checks"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustup default "$channel"
          cargo --version
          cargo fmt --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: substrate-gate-v1
          shared-key: full-gate-static
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"

      - name: Install the pinned licence inventory tool
        run: |
          if ! cargo-about --version 2>/dev/null | grep -qx 'cargo-about 0.9.1'; then
            cargo install cargo-about --version 0.9.1 --locked --features cli
          fi
          cargo-about --version

      - name: Install the specification's pinned ESS release
        env:
          ESS_VERSION: 0.77.0
          ESS_SHA256: dd31b828bf6c6d9976f339b0a25dabcf0fa7fbb33c2856c49a1e3b71a5c00089
        run: |
          archive="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --retry 3 "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$archive" --output "$RUNNER_TEMP/$archive"
          echo "$ESS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ess-bin"
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/ess-bin"
          echo "$RUNNER_TEMP/ess-bin" >> "$GITHUB_PATH"

      - name: Run the gate's static phase
        run: bash scripts/gate.sh static

  gate:
    name: Full gate
    needs: [gate-tests, gate-static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require both gate phases
        env:
          TESTS: ${{ needs.gate-tests.result }}
          STATIC: ${{ needs.gate-static.result }}
        run: |
          echo "tests phase: $TESTS"
          echo "static phase: $STATIC"
          test "$TESTS" = success
          test "$STATIC" = success

  pod-lane:
    name: Pod lane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      POD_LANE_CLUSTER: substrate-pod-lane
      POD_LANE_NAMESPACE: substrate-pod-lane

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -1)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          cargo --version

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: substrate-gate-v1
          shared-key: pod-lane
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-on-failure: "false"

      - name: Install the pinned kind release
        run: |
          mkdir -p "$RUNNER_TEMP/kind-bin"
          curl --fail --location --retry 3 "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64" --output "$RUNNER_TEMP/kind-bin/kind"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind-bin/kind" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kind-bin/kind" version
          kubectl version --client
          jq --version

      - name: Create the disposable cluster
        run: |
          printf '%s\n' \
            'kind: Cluster' \
            'apiVersion: kind.x-k8s.io/v1alpha4' \
            'nodes:' \
            '  - role: control-plane' \
            '    kubeadmConfigPatches:' \
            '      - |' \
            '        kind: KubeletConfiguration' \
            '        podPidsLimit: 1024' > "$RUNNER_TEMP/kind.yaml"
          kind create cluster --name "$POD_LANE_CLUSTER" --image "$KIND_NODE_IMAGE" --config "$RUNNER_TEMP/kind.yaml" --kubeconfig "$RUNNER_TEMP/admin.yaml" --wait 180s

      - name: Grant the adapter one namespaced role
        env:
          KUBECONFIG: ${{ runner.temp }}/admin.yaml
        run: |
          ns="$POD_LANE_NAMESPACE"
          kubectl create namespace "$ns"
          kubectl label namespace "$ns" pod-security.kubernetes.io/enforce=restricted
          kubectl -n "$ns" create serviceaccount substrate-pod
          kubectl -n "$ns" create role substrate-pod --verb=create,get,list,watch,delete --resource=pods,networkpolicies.networking.k8s.io
          kubectl -n "$ns" create role substrate-pod-log --verb=get --resource=pods/log
          kubectl -n "$ns" create rolebinding substrate-pod --role=substrate-pod --serviceaccount="$ns:substrate-pod"
          kubectl -n "$ns" create rolebinding substrate-pod-log --role=substrate-pod-log --serviceaccount="$ns:substrate-pod"
          token=$(kubectl -n "$ns" create token substrate-pod --duration=1h)
          echo "::add-mask::$token"
          umask 077
          kubectl config view --raw --minify --flatten -o json | jq --arg token "$token" --arg ns "$ns" '
            .users[0].user = {token: $token}
            | .contexts[0].context.namespace = $ns
            | .contexts[0].context.extensions = [{name: "b10x-substrate/pod", extension: {pod_pids_limit: 1024}}]' > "$RUNNER_TEMP/pod.json"
          kubectl -n "$ns" create serviceaccount substrate-pod-nolog
          kubectl -n "$ns" create rolebinding substrate-pod-nolog --role=substrate-pod --serviceaccount="$ns:substrate-pod-nolog"
          token=$(kubectl -n "$ns" create token substrate-pod-nolog --duration=1h)
          echo "::add-mask::$token"
          jq --arg token "$token" '.users[0].user = {token: $token}' "$RUNNER_TEMP/pod.json" > "$RUNNER_TEMP/pod-nolog.json"

      - name: Run the pod lane
        env:
          SUBSTRATE_POD_LANE: "1"
          SUBSTRATE_POD_KUBECONFIG: ${{ runner.temp }}/pod.json
          SUBSTRATE_POD_KUBECONFIG_NOLOG: ${{ runner.temp }}/pod-nolog.json
          SUBSTRATE_POD_KIND_NODE: ${{ env.POD_LANE_CLUSTER }}-control-plane
        run: bash scripts/pod-lane.sh

      - name: Require that no run object remains
        env:
          KUBECONFIG: ${{ runner.temp }}/admin.yaml
        run: |
          left=$(kubectl get pods,networkpolicies --all-namespaces --selector=app.kubernetes.io/managed-by=b10x-substrate --output name)
          echo "objects left: ${left:-none}"
          test -z "$left"

      - name: Delete the disposable cluster
        if: always()
        run: kind delete cluster --name "$POD_LANE_CLUSTER" --kubeconfig "$RUNNER_TEMP/admin.yaml"
