name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@d532e72dddf53efbf07fac4b0f86653926ab0102
    secrets:
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
