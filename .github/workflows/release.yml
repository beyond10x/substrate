# Publishes a release for an **annotated bare-version tag** on `main` (AGENTS.md § "Releases" — "the
# bare version … annotated, at a fully gated `main` commit"). A deliberate manual recovery may name
# an existing eligible tag after a partial release failed; it runs the current protected-main
# workflow against the immutable tagged source and never moves the tag. Every published digest is
# written to the GitHub release and emitted as the exact `CHANGELOG.md` stanza that must land
# through the protected-main pull-request path. `b10x-substrate-*` is the source-package prefix
# fixed by README.md. The GitHub release also carries the daemon and CLI binaries as
# `<binary>-<version>-x86_64-unknown-linux-gnu.tar.gz`, exported from the same pinned builder stage
# as the images, with `SHA256SUMS` over both archives and its keyless `cosign sign-blob` bundle.
#
# Permissions. `contents: read` at workflow level. `preflight` adds `actions: read`, the only
# scope that can read another workflow's conclusion for a SHA, and `checks: read`, which reads the
# chart lane's absent scenarios from that run's annotations; there is no way to ask "was
# gate.yml green for this commit" with `contents: read` alone. `release` adds `packages: write`
# (push to GHCR) and `id-token: write` (the OIDC token keyless cosign signs with) and nothing else.
# Neither write scope exists anywhere but that one job.
#
# Identity. All GHCR pushes and the GitHub release use the run's own `GITHUB_TOKEN`, so the release
# holds no credential that reaches beyond this repository. It carries no secret to set, rotate or
# leak: GitHub mints it per run and expires it when the run ends.
#
# This is a deliberate departure from AGENTS.md § "Bot identity", which requires the b10x-bot App
# for automated commits and pushes. That App is installed org-wide with `administration:write` and
# `workflows:write` on every repository in `beyond10x`, and this repository is **public**: its key
# as an Actions secret here would put an org-wide credential in the repository with the widest
# audience for proposing workflow changes. No git commit or push happens here. A workstation opens
# the digest-recording pull request through `scripts/as-bot.sh`, where the App key never enters this
# public repository's Actions secrets. AGENTS.md § "Bot identity" records the exception.
#
# Protected `main` requires `Full gate`. The workflow therefore emits every exact digest line in its
# summary after publication; a bot-authored pull request records them and receives the normal gate.
#
# Platform. `linux/amd64` only: the hosted runner is amd64 and a cross-built or emulated Rust
# release build is not something this job can honestly claim to have exercised. An arm64 image is
# separate work with its own runner. Build provenance and SBOM attestations are disabled so the
# pushed digest is the image manifest's own digest and not an index that wraps it; SLSA provenance
# is a later milestone, not something to bolt on here.
name: Release

on:
  push:
    tags:
      # Coarse filter. GitHub ref filters understand `*`, `**`, `?`, `+` and `[]` — not anchors,
      # not alternation — so this is "digits, dot, digits, dot, digits" and the anchored regex in
      # the preflight job is what actually decides. `0.2.2-rc.0` fails both.
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated release tag to recover after a partial failure
        required: true
        type: string
      confinement_evidence:
        # Not `required: true`: a tag push cannot supply a workflow input at all, so the ordinary
        # release path carries the same value in the annotated tag's own `Confinement-lane:`
        # trailer. The preflight requires the *resolved* value to be non-empty and to name the
        # tagged commit, whichever carrier supplied it. This input is how a recovery dispatch
        # releases a tag annotated before that trailer existed.
        description: >-
          Recorded delegated confinement-lane run for the tagged commit, as
          "<source-sha> <delegated-case-count> <RFC 3339 UTC>" from `bash scripts/delegated-lane.sh`;
          empty uses the annotated tag's own Confinement-lane trailer
        required: false
        type: string
      quota_evidence:
        # Not `required: true`, for the same reason as `confinement_evidence`: the ordinary path
        # carries the value in the annotated tag's own `Quota-lane:` trailer.
        description: >-
          Recorded project-quota-lane run for the tagged commit, as
          "<source-sha> <case-count> <RFC 3339 UTC>" from `cargo xtask quota-fixture run`;
          empty uses the annotated tag's own Quota-lane trailer
        required: false
        type: string
      chart_evidence:
        description: >-
          Recorded execution-enabled chart-lane run for the tagged commit, as
          "<source-sha> <scenario-count> <RFC 3339 UTC>" from
          `cargo xtask chart-lane cluster --node-profiles`; empty uses the annotated tag's own
          Chart-lane trailer
        required: false
        type: string
      namespace_evidence:
        description: >-
          Recorded namespace kind-lane run for the tagged commit, as
          "<source-sha> <observation-count> <RFC 3339 UTC>" from
          `cargo xtask namespace-lane observe`; empty uses the annotated tag's own
          Namespace-lane trailer
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Never cancel a release in flight: a cancelled run can leave a pushed artifact with no
  # signature and no release. Every release serialises here because two daemon releases may carry
  # the same current bundle version; per-tag groups would let both race for its write-once tag.
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/beyond10x/b10x-substrate-daemon
  MCP_IMAGE: ghcr.io/beyond10x/b10x-substrate-mcp
  EXECUTOR_IMAGE: ghcr.io/beyond10x/b10x-substrate-executor
  # Explicit, reviewable publication input. A successor bundle must move this pin in the same
  # change; deriving "largest directory" at release time would silently broaden what a tag ships.
  BUNDLE_IMAGE: ghcr.io/beyond10x/b10x-substrate-wire
  BUNDLE_VERSION: 0.25.0
  BUNDLE_LAYOUT: target/release-contract-bundle
  BINARY_TARGET: x86_64-unknown-linux-gnu
  BINARY_DIST: target/release-binaries
  GLIBC_CEILING: "2.35"
  GLIBC_FLOOR_IMAGE: ubuntu:22.04@sha256:e0f80c829509ef4df9e76bd8944eb7b8ec25cbb379b112a7f9448b2c77a77c9b
  GATE_WORKFLOW: gate.yml
  CHART_WORKFLOW: chart-lane.yml
  NAMESPACE_WORKFLOW: namespace-lane.yml
  CHART_REPOSITORY: ghcr.io/beyond10x/charts
  CHART_IMAGE: ghcr.io/beyond10x/charts/b10x-substrate
  HELM_VERSION: v3.22.1
  HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Reading `gate.yml`'s conclusion for a SHA is an Actions API read. It is a read-only scope
      # on a job that builds nothing, pushes nothing and holds no write scope of any kind.
      actions: read
      checks: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source-sha: ${{ steps.tag.outputs.source-sha }}
      gate-run-url: ${{ steps.gate.outputs.run-url }}
      chart: ${{ steps.chart-lane.outputs.chart }}
      chart-lane-run-url: ${{ steps.chart-lane.outputs.run-url }}
      chart-lane-absent: ${{ steps.chart-lane.outputs.absent }}
      namespace-lane-workflow: ${{ steps.namespace-workflow.outputs.workflow }}
      namespace-lane-run-url: ${{ steps.namespace-workflow.outputs.run-url }}
      confinement-evidence: ${{ steps.confinement.outputs.evidence }}
      quota-evidence: ${{ steps.quota.outputs.evidence }}
      chart-evidence: ${{ steps.chart-record.outputs.evidence }}
      namespace-lane: ${{ steps.namespace.outputs.lane }}
      namespace-evidence: ${{ steps.namespace.outputs.evidence }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the `main`-ancestry check below is a real ancestry walk, not a guess
          # from a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      # Anchored regex, not the ref glob. This is the step that makes `0.2.2-rc.0`, `v0.2.2`,
      # `0.2` and `0.2.2.1` produce nothing.
      - name: Refuse a tag that is not the bare version form
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "refused: '$TAG' is not the bare version form MAJOR.MINOR.PATCH." >&2
            echo "AGENTS.md, section \"Releases\": the tag is the bare version and nothing else." >&2
            echo "A pre-release tag publishes nothing." >&2
            exit 1
          fi
          echo "tag form: '$TAG' is the bare version form"

      # Three separate claims, each checked rather than assumed: the ref names a tag *object*
      # (annotated), that object peels to a commit, and that commit is on `main`.
      - name: Require an annotated tag at a main commit
        id: tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          object_type=$(git cat-file -t "refs/tags/${TAG}")
          if [ "$object_type" != "tag" ]; then
            echo "refused: refs/tags/${TAG} is a ${object_type}, not an annotated tag object." >&2
            echo "AGENTS.md, section \"Releases\": the tag is annotated." >&2
            exit 1
          fi

          source_sha=$(git rev-parse "refs/tags/${TAG}^{commit}")

          # A tag-push event must itself name the peeled commit. A recovery dispatch instead runs
          # only the workflow merged to protected main, while the source remains the immutable tag.
          if [ "$EVENT_NAME" = "push" ] && [ "$source_sha" != "$EVENT_SHA" ]; then
            echo "refused: the tag peels to ${source_sha} but the event reports ${EVENT_SHA}." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "refused: release recovery must dispatch the workflow from refs/heads/main, not ${WORKFLOW_REF}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "refused: ${source_sha} is not an ancestor of origin/main." >&2
            echo "AGENTS.md, section \"Releases\": the tag sits at a fully gated main commit." >&2
            exit 1
          fi

          # The version the image is tagged with and the version the binary reports must be one
          # number. `[workspace.package] version` is the manifest's single source (Cargo.toml:17).
          manifest_version=$(git show "${source_sha}:Cargo.toml" | awk '
            /^\[workspace\.package\]$/ { in_block = 1; next }
            /^\[/                      { in_block = 0 }
            in_block && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print
              exit
            }
          ' Cargo.toml)
          if [ "$manifest_version" != "$TAG" ]; then
            echo "refused: tag ${TAG} disagrees with Cargo.toml [workspace.package] version ${manifest_version}." >&2
            exit 1
          fi

          echo "annotated tag ${TAG} -> ${source_sha}, on main, matching Cargo.toml ${manifest_version}"
          {
            echo "version=${TAG}"
            echo "source-sha=${source_sha}"
          } >> "$GITHUB_OUTPUT"

      # The gate's own recorded conclusion for this exact commit, read from the Actions API. Not a
      # re-run: a second run of `scripts/gate.sh` here would prove that the gate passes *now*, on
      # this runner, which is a different claim from "gate.yml was green for this commit" and would
      # let a release proceed on a commit whose real gate run failed.
      #
      # It waits rather than failing immediately when no conclusion exists yet, because tagging a
      # commit the moment it lands on `main` is the normal case and the gate takes up to 45 minutes
      # (gate.yml:38 `timeout-minutes: 45`). A recorded `failure` or `cancelled` with no successful
      # run alongside it refuses at once — waiting cannot turn a red gate green.
      - name: Require a green gate run for this commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 50 * 60 ))
          admitted=".workflow_runs[] | select((.event == \"push\" and .head_branch == \"main\") or .event == \"workflow_dispatch\") | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")"

          while :; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${GATE_WORKFLOW}/runs?head_sha=${SOURCE_SHA}&per_page=100" \
              --jq "${admitted} | [.status, (.conclusion // \"-\"), .html_url] | @tsv")

            success_url=$(printf '%s\n' "$runs" \
              | awk -F'\t' '$1 == "completed" && $2 == "success" { print $3; exit }')
            if [ -n "$success_url" ]; then
              echo "gate green for ${SOURCE_SHA}: ${success_url}"
              echo "run-url=${success_url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $1 != "completed" { c++ } END { print c + 0 }')
            if [ "$pending" -eq 0 ]; then
              if [ -n "${runs//[[:space:]]/}" ]; then
                echo "refused: every ${GATE_WORKFLOW} run for ${SOURCE_SHA} is completed and none concluded success:" >&2
                printf '%s\n' "$runs" >&2
                exit 1
              fi
              echo "no ${GATE_WORKFLOW} run recorded for ${SOURCE_SHA} yet; waiting"
            else
              echo "${pending} ${GATE_WORKFLOW} run(s) for ${SOURCE_SHA} still running; waiting"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "refused: no successful ${GATE_WORKFLOW} run for ${SOURCE_SHA} within the wait window." >&2
              echo "The gate is the bar for main (AGENTS.md, section \"The gate\"); nothing is published without it." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Require a green chart-lane run for this commit
        id: chart-lane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${SOURCE_SHA}:deploy/helm/substrate/Chart.yaml" 2>/dev/null; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: the tagged source ${SOURCE_SHA} has no deploy/helm/substrate chart; a tag push always publishes one." >&2
              exit 1
            fi
            echo "the tagged source ${SOURCE_SHA} predates the chart; this recovery run publishes no chart"
            echo "chart=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$(( $(date +%s) + 90 * 60 ))
          admitted=".workflow_runs[] | select((.event == \"push\" and .head_branch == \"main\") or .event == \"workflow_dispatch\") | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")"
          api_root="${GITHUB_API_URL:-https://api.github.com}/"

          while :; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${CHART_WORKFLOW}/runs?head_sha=${SOURCE_SHA}&per_page=100" \
              --jq "${admitted} | [.status, (.conclusion // \"-\"), .html_url, .id] | @tsv")

            success=$(printf '%s\n' "$runs" \
              | awk -F'\t' '$1 == "completed" && $2 == "success" { print $3 "\t" $4; exit }')
            if [ -n "$success" ]; then
              success_url=${success%%$'\t'*}
              run_id=${success##*$'\t'}
              absent=""
              check_runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '(.jobs // [])[] | .check_run_url // empty')
              while IFS= read -r check_run; do
                [ -n "$check_run" ] || continue
                notes=$(gh api --paginate "${check_run#"$api_root"}/annotations?per_page=100" \
                  --jq '.[] | select(.annotation_level == "notice" and .title == "chart-lane absent") | .message')
                while IFS= read -r note; do
                  [ -n "$note" ] || continue
                  absent="${absent:+${absent}; }${note}"
                done <<< "$notes"
              done <<< "$check_runs"
              absent=$(printf '%s' "$absent" | tr -d '\r\n')
              echo "chart lane green for ${SOURCE_SHA}: ${success_url}"
              echo "chart lane absent, not passed: ${absent:-none recorded}"
              {
                echo "chart=present"
                echo "run-url=${success_url}"
                echo "absent=${absent:-none recorded}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $1 != "completed" { c++ } END { print c + 0 }')
            if [ "$pending" -eq 0 ]; then
              if [ -n "${runs//[[:space:]]/}" ]; then
                echo "refused: every ${CHART_WORKFLOW} run for ${SOURCE_SHA} is completed and none concluded success:" >&2
                printf '%s\n' "$runs" >&2
                exit 1
              fi
              echo "no ${CHART_WORKFLOW} run recorded for ${SOURCE_SHA} yet; waiting"
            else
              echo "${pending} ${CHART_WORKFLOW} run(s) for ${SOURCE_SHA} still running; waiting"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "refused: no successful ${CHART_WORKFLOW} run for ${SOURCE_SHA} within the wait window." >&2
              echo "The chart is published only for a commit whose chart lane passed (ADR 0046, K9)." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Require a green namespace-lane run for this commit
        id: namespace-workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${SOURCE_SHA}:.github/workflows/${NAMESPACE_WORKFLOW}" 2>/dev/null; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: the tagged source ${SOURCE_SHA} has no .github/workflows/${NAMESPACE_WORKFLOW}; a tag push always carries it." >&2
              exit 1
            fi
            echo "the tagged source ${SOURCE_SHA} predates ${NAMESPACE_WORKFLOW}; no run of it applies"
            echo "workflow=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deadline=$(( $(date +%s) + 50 * 60 ))
          admitted=".workflow_runs[] | select((.event == \"push\" and .head_branch == \"main\") or .event == \"workflow_dispatch\") | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")"

          while :; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${NAMESPACE_WORKFLOW}/runs?head_sha=${SOURCE_SHA}&per_page=100" \
              --jq "${admitted} | [.status, (.conclusion // \"-\"), .html_url] | @tsv")

            success_url=$(printf '%s\n' "$runs" \
              | awk -F'\t' '$1 == "completed" && $2 == "success" { print $3; exit }')
            if [ -n "$success_url" ]; then
              echo "namespace lane green for ${SOURCE_SHA}: ${success_url}"
              {
                echo "workflow=present"
                echo "run-url=${success_url}"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            pending=$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $1 != "completed" { c++ } END { print c + 0 }')
            if [ "$pending" -eq 0 ]; then
              if [ -n "${runs//[[:space:]]/}" ]; then
                echo "refused: every ${NAMESPACE_WORKFLOW} run for ${SOURCE_SHA} is completed and none concluded success:" >&2
                printf '%s\n' "$runs" >&2
                exit 1
              fi
              echo "no ${NAMESPACE_WORKFLOW} run recorded for ${SOURCE_SHA} yet; waiting"
            else
              echo "${pending} ${NAMESPACE_WORKFLOW} run(s) for ${SOURCE_SHA} still running; waiting"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "refused: no successful ${NAMESPACE_WORKFLOW} run for ${SOURCE_SHA} within the wait window." >&2
              echo "A release requires the namespace lane's static checks to have passed for its commit (design 34, section 10.4)." >&2
              exit 1
            fi
            sleep 30
          done

      # `gate.yml` green is the portable lane only. The delegated confinement lane needs bubblewrap
      # and an exclusive delegated cgroup v2 subtree carrying `cpu`, `memory` and `pids`; a hosted
      # runner has neither, so `gate.yml` reports that lane **absent — not executed, not passed**
      # (gate.yml, "Report execution lanes"). Without this step a release would make no claim at all
      # about the delegated cases, which are the ones that prove confinement rather than the typed
      # refusal.
      #
      # This step does not run the lane. It requires a *recorded* run naming this exact commit, and
      # carries that record into the release notes, so the claim is attributable and re-checkable
      # instead of absent. Running the lane here is a self-hosted-runner decision, not this one.
      #
      # Two carriers, one value, because a tag push cannot supply a workflow input:
      #   * the ordinary path records it in the annotated tag's own message, as a line
      #     `Confinement-lane: <source-sha> <delegated-case-count> <RFC 3339 UTC>`. The tag object is
      #     immutable and is written by the same workstation that ran the lane.
      #   * a recovery dispatch may pass `confinement_evidence` instead, which is also the only way
      #     to release a tag annotated before this condition existed.
      #
      # Three checks, each a refusal: the recorded commit is this commit (evidence from another
      # commit proves nothing about these bytes), the recorded case count is the count the tagged
      # source itself declares (a lane run against a smaller suite is not this suite), and the
      # timestamp is a real UTC instant by shape and by calendar. The record itself is exactly one
      # line of exactly three fields, from exactly one trailer.
      - name: Require a recorded confinement-lane run for this commit
        id: confinement
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          INPUT_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.confinement_evidence || '' }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
        run: |
          set -euo pipefail
          evidence="${INPUT_EVIDENCE:-}"
          carrier="the confinement_evidence workflow input"
          if [ -z "${evidence//[[:space:]]/}" ]; then
            evidence=$(git tag -l --format='%(contents)' "${TAG}" \
              | sed -n 's/^Confinement-lane:[[:space:]]*//p')
            carrier="the annotated tag's Confinement-lane trailer"
            records=$(git tag -l --format='%(contents)' "${TAG}" | grep -c '^Confinement-lane:' || true)
            if [ "${records:-0}" -gt 1 ]; then
              echo "refused: ${TAG} carries ${records} Confinement-lane lines; a release records exactly one." >&2
              exit 1
            fi
          fi

          if [ -z "${evidence//[[:space:]]/}" ]; then
            echo "refused: no recorded confinement lane run for ${SOURCE_SHA}." >&2
            echo "The delegated lane is absent on hosted runners and is a release condition." >&2
            echo "Run 'bash scripts/delegated-lane.sh' at ${SOURCE_SHA} on a host that has" >&2
            echo "bubblewrap and a delegated cgroup v2 subtree, then record the run either as" >&2
            echo "  Confinement-lane: ${SOURCE_SHA} <delegated-case-count> <RFC 3339 UTC>" >&2
            echo "in the annotated tag's message, or as the confinement_evidence input of a" >&2
            echo "protected-main recovery dispatch. AGENTS.md, section \"Releases\"." >&2
            exit 1
          fi

          # One line of exactly three fields. A second line would reach GITHUB_OUTPUT unvalidated,
          # and a fourth field would be published without being checked.
          case "$evidence" in
            *$'\n'* | *$'\r'*)
              echo "refused: ${carrier} spans more than one line; a record is one line of three fields." >&2
              exit 1
              ;;
          esac
          read -r -a fields <<<"${evidence}"
          if [ "${#fields[@]}" -ne 3 ]; then
            echo "refused: ${carrier} has ${#fields[@]} fields; a record is '<sha> <case-count> <RFC 3339 UTC>'." >&2
            exit 1
          fi
          claimed_sha=${fields[0]}
          claimed_cases=${fields[1]}
          claimed_at=${fields[2]}
          evidence="${claimed_sha} ${claimed_cases} ${claimed_at}"

          if [ "$claimed_sha" != "$SOURCE_SHA" ]; then
            echo "refused: ${carrier} records commit '${claimed_sha}', not ${SOURCE_SHA}." >&2
            echo "A lane run against other bytes is not evidence about the tagged source." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_cases" | grep -Eq '^[0-9]+$'; then
            echo "refused: ${carrier} records '${claimed_cases}' where a delegated case count belongs." >&2
            exit 1
          fi

          # The count the tagged source itself declares, read from the tagged source rather than
          # from this checkout, exactly as the manifest-version check above does.
          declared_cases=$(git show "${SOURCE_SHA}:crates/substrate-daemon/tests/runtime_vectors.rs" \
            | sed -n 's/^const DELEGATED_CASES: usize = \([0-9][0-9]*\);$/\1/p' | head -n 1)
          if [ -z "$declared_cases" ]; then
            echo "refused: DELEGATED_CASES is not declared in the expected form at ${SOURCE_SHA}." >&2
            echo "crates/substrate-daemon/tests/runtime_vectors.rs must carry a line" >&2
            echo "  const DELEGATED_CASES: usize = <n>;" >&2
            echo "for this release condition to be checkable; fix the check with the constant." >&2
            exit 1
          fi
          if [ "$claimed_cases" != "$declared_cases" ]; then
            echo "refused: ${carrier} records ${claimed_cases} delegated cases; ${SOURCE_SHA} declares ${declared_cases}." >&2
            exit 1
          fi

          # The shape, then the calendar: GNU date must read it back as the same UTC instant, so
          # month 13, 30 February and hour 24 are refused along with every other form.
          if ! printf '%s' "$claimed_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' \
            || [ "$(date -u -d "$claimed_at" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)" != "$claimed_at" ]; then
            echo "refused: ${carrier} records '${claimed_at}' where an RFC 3339 UTC instant belongs." >&2
            echo "Use the form 2026-09-15T08:30:00Z." >&2
            exit 1
          fi

          echo "confinement lane recorded for ${SOURCE_SHA} from ${carrier}: ${evidence}"
          echo "evidence=${evidence}" >> "$GITHUB_OUTPUT"

      # The real project-quota lane, in the confinement step's shape. Its seven `real_quota_*` cases
      # need a filesystem mounted with project quotas and `SYS_ADMIN` for `quotactl`; neither
      # `gate.yml` nor the delegated lane runs them, and `Confinement-lane:` counts another crate.
      # `cargo xtask quota-fixture run` provisions that fixture in a checked-in container recipe and
      # prints the record. Same carriers, same three refusals; the count is the number of
      # `real_quota_*` test functions the tagged source declares.
      - name: Require a recorded quota-lane run for this commit
        id: quota
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          INPUT_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.quota_evidence || '' }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
        run: |
          set -euo pipefail
          evidence="${INPUT_EVIDENCE:-}"
          carrier="the quota_evidence workflow input"
          if [ -z "${evidence//[[:space:]]/}" ]; then
            evidence=$(git tag -l --format='%(contents)' "${TAG}" \
              | sed -n 's/^Quota-lane:[[:space:]]*//p')
            carrier="the annotated tag's Quota-lane trailer"
            records=$(git tag -l --format='%(contents)' "${TAG}" | grep -c '^Quota-lane:' || true)
            if [ "${records:-0}" -gt 1 ]; then
              echo "refused: ${TAG} carries ${records} Quota-lane lines; a release records exactly one." >&2
              exit 1
            fi
          fi

          if [ -z "${evidence//[[:space:]]/}" ]; then
            echo "refused: no recorded quota lane run for ${SOURCE_SHA}." >&2
            echo "The real project-quota cases run on no hosted runner and are a release condition." >&2
            echo "Run 'cargo xtask quota-fixture run' at ${SOURCE_SHA} with a clean checkout on a host" >&2
            echo "where Docker works without sudo, then record the line it prints either as" >&2
            echo "  Quota-lane: ${SOURCE_SHA} <case-count> <RFC 3339 UTC>" >&2
            echo "in the annotated tag's message, or as the quota_evidence input of a" >&2
            echo "protected-main recovery dispatch. AGENTS.md, section \"Releases\"." >&2
            exit 1
          fi

          # One line of exactly three fields. A second line would reach GITHUB_OUTPUT unvalidated,
          # and a fourth field would be published without being checked.
          case "$evidence" in
            *$'\n'* | *$'\r'*)
              echo "refused: ${carrier} spans more than one line; a record is one line of three fields." >&2
              exit 1
              ;;
          esac
          read -r -a fields <<<"${evidence}"
          if [ "${#fields[@]}" -ne 3 ]; then
            echo "refused: ${carrier} has ${#fields[@]} fields; a record is '<sha> <case-count> <RFC 3339 UTC>'." >&2
            exit 1
          fi
          claimed_sha=${fields[0]}
          claimed_cases=${fields[1]}
          claimed_at=${fields[2]}
          evidence="${claimed_sha} ${claimed_cases} ${claimed_at}"

          if [ "$claimed_sha" != "$SOURCE_SHA" ]; then
            echo "refused: ${carrier} records commit '${claimed_sha}', not ${SOURCE_SHA}." >&2
            echo "A lane run against other bytes is not evidence about the tagged source." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_cases" | grep -Eq '^[0-9]+$'; then
            echo "refused: ${carrier} records '${claimed_cases}' where a real-quota case count belongs." >&2
            exit 1
          fi

          # Read from the tagged source, not this checkout.
          quota_source="crates/substrate-host/src/git/quota_tests.rs"
          if ! source_text=$(git show "${SOURCE_SHA}:${quota_source}"); then
            echo "refused: ${quota_source} is absent at ${SOURCE_SHA}." >&2
            exit 1
          fi
          # The definition `cargo xtask quota-lane` and the fixture use (`declared_cases` in
          # xtask/src/quota_lane.rs): an `fn real_quota_*` whose attributes since the previous item
          # include `#[ignore`. An unignored helper of that name is not a case on either side.
          declared_cases=$(printf '%s\n' "$source_text" | awk '
            { line = $0; sub(/^[[:space:]]+/, "", line) }
            line ~ /^#\[ignore/ { ignored = 1; next }
            line ~ /^(async )?fn / {
              if (ignored && line ~ /^(async )?fn real_quota_[A-Za-z0-9_]*[^A-Za-z0-9_]/) cases++
              ignored = 0
              next
            }
            line !~ /^#\[/ && line != "" { ignored = 0 }
            END { print cases + 0 }
          ')
          if [ "${declared_cases:-0}" -eq 0 ]; then
            echo "refused: ${quota_source} at ${SOURCE_SHA} declares no real_quota_ case function." >&2
            echo "Fix this check with the cases; a record of zero cases proves nothing." >&2
            exit 1
          fi
          if [ "$claimed_cases" != "$declared_cases" ]; then
            echo "refused: ${carrier} records ${claimed_cases} real-quota cases; ${SOURCE_SHA} declares ${declared_cases}." >&2
            exit 1
          fi

          # The shape, then the calendar: GNU date must read it back as the same UTC instant, so
          # month 13, 30 February and hour 24 are refused along with every other form.
          if ! printf '%s' "$claimed_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' \
            || [ "$(date -u -d "$claimed_at" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)" != "$claimed_at" ]; then
            echo "refused: ${carrier} records '${claimed_at}' where an RFC 3339 UTC instant belongs." >&2
            echo "Use the form 2026-09-15T08:30:00Z." >&2
            exit 1
          fi

          echo "quota lane recorded for ${SOURCE_SHA} from ${carrier}: ${evidence}"
          echo "evidence=${evidence}" >> "$GITHUB_OUTPUT"

      - name: Require a recorded chart-lane run for this commit
        id: chart-record
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          INPUT_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_evidence || '' }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${SOURCE_SHA}:deploy/helm/substrate/Chart.yaml" 2>/dev/null; then
            echo "the tagged source ${SOURCE_SHA} has no deploy/helm/substrate chart; no chart lane record applies"
            exit 0
          fi
          evidence="${INPUT_EVIDENCE:-}"
          carrier="the chart_evidence workflow input"
          if [ -z "${evidence//[[:space:]]/}" ]; then
            evidence=$(git tag -l --format='%(contents)' "${TAG}" \
              | sed -n 's/^Chart-lane:[[:space:]]*//p')
            carrier="the annotated tag's Chart-lane trailer"
            records=$(git tag -l --format='%(contents)' "${TAG}" | grep -c '^Chart-lane:' || true)
            if [ "${records:-0}" -gt 1 ]; then
              echo "refused: ${TAG} carries ${records} Chart-lane lines; a release records exactly one." >&2
              exit 1
            fi
          fi

          if [ -z "${evidence//[[:space:]]/}" ]; then
            echo "refused: no recorded chart lane run for ${SOURCE_SHA}." >&2
            echo "The execution-enabled chart scenarios need Localhost seccomp and AppArmor profiles on the" >&2
            echo "nodes, which no hosted runner has, so they are a release condition (ADR 0046, K9 C)." >&2
            echo "Build the daemon image from ${SOURCE_SHA} with --build-arg SOURCE_SHA=${SOURCE_SHA}, run" >&2
            echo "'cargo xtask chart-lane cluster --node-profiles' at that commit with a clean checkout, then" >&2
            echo "record the line it prints either as" >&2
            echo "  Chart-lane: ${SOURCE_SHA} <scenario-count> <RFC 3339 UTC>" >&2
            echo "in the annotated tag's message, or as the chart_evidence input of a" >&2
            echo "protected-main recovery dispatch. AGENTS.md, section \"Releases\"." >&2
            exit 1
          fi

          case "$evidence" in
            *$'\n'* | *$'\r'*)
              echo "refused: ${carrier} spans more than one line; a record is one line of three fields." >&2
              exit 1
              ;;
          esac
          read -r -a fields <<<"${evidence}"
          if [ "${#fields[@]}" -ne 3 ]; then
            echo "refused: ${carrier} has ${#fields[@]} fields; a record is '<sha> <scenario-count> <RFC 3339 UTC>'." >&2
            exit 1
          fi
          claimed_sha=${fields[0]}
          claimed_cases=${fields[1]}
          claimed_at=${fields[2]}
          evidence="${claimed_sha} ${claimed_cases} ${claimed_at}"

          if [ "$claimed_sha" != "$SOURCE_SHA" ]; then
            echo "refused: ${carrier} records commit '${claimed_sha}', not ${SOURCE_SHA}." >&2
            echo "A lane run against other bytes is not evidence about the tagged source." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_cases" | grep -Eq '^[0-9]+$'; then
            echo "refused: ${carrier} records '${claimed_cases}' where a chart-lane scenario count belongs." >&2
            exit 1
          fi

          chart_source="xtask/src/chart_cluster.rs"
          if ! source_text=$(git show "${SOURCE_SHA}:${chart_source}"); then
            echo "refused: ${chart_source} is absent at ${SOURCE_SHA}." >&2
            exit 1
          fi
          declared_cases=$(printf '%s\n' "$source_text" | awk '
            /^pub const SCENARIOS: \[&str; [0-9]+\] = \[$/ {
              if (seen) bad = 1
              seen = 1
              inside = 1
              declared = $0
              sub(/^pub const SCENARIOS: \[&str; /, "", declared)
              sub(/\].*$/, "", declared)
              next
            }
            inside && $0 == "];" { inside = 0; next }
            inside && /^    "[^"]+",$/ { cases++; next }
            inside { bad = 1 }
            END {
              if (!seen || inside || bad || cases + 0 == 0 || cases + 0 != declared + 0) print 0
              else print cases + 0
            }
          ')
          if [ "${declared_cases:-0}" -eq 0 ]; then
            echo "refused: ${chart_source} at ${SOURCE_SHA} declares no SCENARIOS array of one quoted scenario per line." >&2
            echo "Fix this check with the lane; a record of zero scenarios proves nothing." >&2
            exit 1
          fi
          if [ "$claimed_cases" != "$declared_cases" ]; then
            echo "refused: ${carrier} records ${claimed_cases} chart-lane scenarios; ${SOURCE_SHA} declares ${declared_cases}." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' \
            || [ "$(date -u -d "$claimed_at" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)" != "$claimed_at" ]; then
            echo "refused: ${carrier} records '${claimed_at}' where an RFC 3339 UTC instant belongs." >&2
            echo "Use the form 2026-09-15T08:30:00Z." >&2
            exit 1
          fi

          echo "chart lane recorded for ${SOURCE_SHA} from ${carrier}: ${evidence}"
          echo "evidence=${evidence}" >> "$GITHUB_OUTPUT"

      - name: Require a recorded namespace-lane run for this commit
        id: namespace
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          INPUT_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.namespace_evidence || '' }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          namespace_source="xtask/src/namespace_lane.rs"
          if ! source_text=$(git show "${SOURCE_SHA}:${namespace_source}" 2>/dev/null); then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: the tagged source ${SOURCE_SHA} has no ${namespace_source}; a tag push always carries the namespace lane." >&2
              exit 1
            fi
            echo "the tagged source ${SOURCE_SHA} predates the namespace lane; no namespace lane record applies"
            echo "lane=absent" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          evidence="${INPUT_EVIDENCE:-}"
          carrier="the namespace_evidence workflow input"
          if [ -z "${evidence//[[:space:]]/}" ]; then
            evidence=$(git tag -l --format='%(contents)' "${TAG}" \
              | sed -n 's/^Namespace-lane:[[:space:]]*//p')
            carrier="the annotated tag's Namespace-lane trailer"
            records=$(git tag -l --format='%(contents)' "${TAG}" | grep -c '^Namespace-lane:' || true)
            if [ "${records:-0}" -gt 1 ]; then
              echo "refused: ${TAG} carries ${records} Namespace-lane lines; a release records exactly one." >&2
              exit 1
            fi
          fi

          if [ -z "${evidence//[[:space:]]/}" ]; then
            echo "refused: no recorded namespace lane run for ${SOURCE_SHA}." >&2
            echo "The namespace kind lane runs on a workstation, not a hosted runner, and is a release" >&2
            echo "condition (D182). Run 'cargo xtask namespace-lane observe' at ${SOURCE_SHA} with a clean" >&2
            echo "checkout on a host where kind and Docker work, then record the line it prints either as" >&2
            echo "  Namespace-lane: ${SOURCE_SHA} <observation-count> <RFC 3339 UTC>" >&2
            echo "in the annotated tag's message, or as the namespace_evidence input of a" >&2
            echo "protected-main recovery dispatch. AGENTS.md, section \"Releases\"." >&2
            exit 1
          fi

          case "$evidence" in
            *$'\n'* | *$'\r'*)
              echo "refused: ${carrier} spans more than one line; a record is one line of three fields." >&2
              exit 1
              ;;
          esac
          read -r -a fields <<<"${evidence}"
          if [ "${#fields[@]}" -ne 3 ]; then
            echo "refused: ${carrier} has ${#fields[@]} fields; a record is '<sha> <observation-count> <RFC 3339 UTC>'." >&2
            exit 1
          fi
          claimed_sha=${fields[0]}
          claimed_cases=${fields[1]}
          claimed_at=${fields[2]}
          evidence="${claimed_sha} ${claimed_cases} ${claimed_at}"

          if [ "$claimed_sha" != "$SOURCE_SHA" ]; then
            echo "refused: ${carrier} records commit '${claimed_sha}', not ${SOURCE_SHA}." >&2
            echo "A lane run against other bytes is not evidence about the tagged source." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_cases" | grep -Eq '^[0-9]+$'; then
            echo "refused: ${carrier} records '${claimed_cases}' where a namespace-lane observation count belongs." >&2
            exit 1
          fi

          declared_cases=$(printf '%s\n' "$source_text" | awk '
            /^pub const OBSERVATIONS: \[&str; [0-9]+\] = \[/ {
              if (seen) bad = 1
              seen = 1
              inside = 1
              text = ""
            }
            inside {
              text = text " " $0
              if ($0 ~ /\];[[:space:]]*$/) inside = 0
              next
            }
            END {
              if (!seen || inside || bad) { print 0; exit }
              gsub(/[[:space:]]+/, " ", text)
              sub(/^ /, "", text)
              declared = text
              sub(/^pub const OBSERVATIONS: \[&str; /, "", declared)
              sub(/\].*$/, "", declared)
              body = text
              sub(/^pub const OBSERVATIONS: \[&str; [0-9]+\] = \[ ?/, "", body)
              sub(/ ?\];$/, "", body)
              if (body !~ /^("[A-Za-z0-9_.-]+", ?)*"[A-Za-z0-9_.-]+",?$/) { print 0; exit }
              cases = gsub(/"[A-Za-z0-9_.-]+"/, "", body)
              if (cases != declared + 0) print 0
              else print cases
            }
          ')
          if [ "${declared_cases:-0}" -eq 0 ]; then
            echo "refused: ${namespace_source} at ${SOURCE_SHA} declares no OBSERVATIONS array of quoted observation names." >&2
            echo "Fix this check with the lane; a record of zero observations proves nothing." >&2
            exit 1
          fi
          if [ "$claimed_cases" != "$declared_cases" ]; then
            echo "refused: ${carrier} records ${claimed_cases} namespace-lane observations; ${SOURCE_SHA} declares ${declared_cases}." >&2
            exit 1
          fi

          if ! printf '%s' "$claimed_at" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' \
            || [ "$(date -u -d "$claimed_at" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)" != "$claimed_at" ]; then
            echo "refused: ${carrier} records '${claimed_at}' where an RFC 3339 UTC instant belongs." >&2
            echo "Use the form 2026-09-15T08:30:00Z." >&2
            exit 1
          fi

          echo "namespace lane recorded for ${SOURCE_SHA} from ${carrier}: ${evidence}"
          {
            echo "lane=present"
            echo "evidence=${evidence}"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight summary
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_SHA: ${{ steps.tag.outputs.source-sha }}
          GATE_RUN_URL: ${{ steps.gate.outputs.run-url }}
          CHART_LANE_RUN_URL: ${{ steps.chart-lane.outputs.run-url }}
          CHART_LANE_ABSENT: ${{ steps.chart-lane.outputs.absent }}
          NAMESPACE_LANE_RUN_URL: ${{ steps.namespace-workflow.outputs.run-url }}
          CONFINEMENT_EVIDENCE: ${{ steps.confinement.outputs.evidence }}
          QUOTA_EVIDENCE: ${{ steps.quota.outputs.evidence }}
          CHART_EVIDENCE: ${{ steps.chart-record.outputs.evidence }}
          NAMESPACE_EVIDENCE: ${{ steps.namespace.outputs.evidence }}
        run: |
          {
            echo "### Release preflight"
            echo
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| version | \`${VERSION}\` |"
            echo "| SOURCE_SHA | \`${SOURCE_SHA}\` |"
            echo "| gate run | ${GATE_RUN_URL} |"
            echo "| chart lane run | ${CHART_LANE_RUN_URL:-no chart in the tagged source} |"
            echo "| chart lane absent, not passed | ${CHART_LANE_ABSENT:-no chart in the tagged source} |"
            echo "| namespace lane run | ${NAMESPACE_LANE_RUN_URL:-no namespace-lane.yml in the tagged source} |"
            echo "| confinement lane | \`${CONFINEMENT_EVIDENCE}\` |"
            echo "| quota lane | \`${QUOTA_EVIDENCE}\` |"
            echo "| chart lane record | \`${CHART_EVIDENCE:-no chart in the tagged source}\` |"
            echo "| namespace lane | \`${NAMESPACE_EVIDENCE:-no namespace lane in the tagged source}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Build, sign and publish daemon, MCP adapter, executor, release binaries and development bundle
    needs: preflight
    runs-on: ubuntu-latest
    # A release build is cold with respect to earlier runs. Within this job, one pinned builder
    # stage compiles both binaries once and the two minimal runtime targets reuse that exact stage;
    # no cache from an earlier release is an input to an artifact an operator is asked to verify.
    timeout-minutes: 120
    permissions:
      # `write`, not `read`: this job creates the GitHub release with `GITHUB_TOKEN`. It does not
      # write git refs. Restated in full because a job-level block replaces the workflow-level one
      # outright rather than merging with it.
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      GATE_RUN_URL: ${{ needs.preflight.outputs.gate-run-url }}
      CHART: ${{ needs.preflight.outputs.chart }}
      CHART_LANE_RUN_URL: ${{ needs.preflight.outputs.chart-lane-run-url }}
      CHART_LANE_ABSENT: ${{ needs.preflight.outputs.chart-lane-absent }}
      CONFINEMENT_EVIDENCE: ${{ needs.preflight.outputs.confinement-evidence }}
      QUOTA_EVIDENCE: ${{ needs.preflight.outputs.quota-evidence }}
      CHART_EVIDENCE: ${{ needs.preflight.outputs.chart-evidence }}
      NAMESPACE_LANE: ${{ needs.preflight.outputs.namespace-lane }}
      NAMESPACE_EVIDENCE: ${{ needs.preflight.outputs.namespace-evidence }}
      NAMESPACE_LANE_WORKFLOW: ${{ needs.preflight.outputs.namespace-lane-workflow }}
      NAMESPACE_LANE_RUN_URL: ${{ needs.preflight.outputs.namespace-lane-run-url }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      # Probed, not assumed, in the manner of gate.yml's "Report execution lanes": the Dockerfile
      # declares `# syntax=docker/dockerfile:1.7` and uses `--mount=type=cache`, so it needs
      # BuildKit. A `docker-container` builder is created explicitly rather than relying on
      # whatever the default builder happens to be on the image that day.
      - name: Prepare a BuildKit builder
        run: |
          set -euo pipefail
          if ! docker buildx version >/dev/null 2>&1; then
            echo "refused: docker buildx is not available on this runner." >&2
            exit 1
          fi
          docker buildx version
          docker buildx create --name b10x-release --driver docker-container --use
          docker buildx inspect --bootstrap

      # `packages: write` on the GITHUB_TOKEN is what pushes all artifacts. No repository or
      # organization credential is added to this public repository.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      # ORAS copies the packager's OCI Image Layout as-is; `oras push` would construct a second
      # manifest and the digest tested locally would no longer be the digest published. The action
      # and CLI versions are both exact, and setup-oras verifies the CLI release checksum.
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Resolve write-once image version tags
        id: artifact-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "refused: GitHub release ${VERSION} already exists; a release rerun never overwrites it." >&2
            exit 1
          fi
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: ${IMAGE}:${VERSION} already exists; initial release runs never reuse image tags." >&2
              exit 1
            fi
            echo "daemon-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "daemon-exists=false" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "${MCP_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: ${MCP_IMAGE}:${VERSION} already exists; initial release runs never reuse image tags." >&2
              exit 1
            fi
            echo "mcp-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp-exists=false" >> "$GITHUB_OUTPUT"
          fi
          if docker manifest inspect "${EXECUTOR_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: ${EXECUTOR_IMAGE}:${VERSION} already exists; initial release runs never reuse image tags." >&2
              exit 1
            fi
            echo "executor-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "executor-exists=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CHART" = present ]; then
            if chart_found=$(oras resolve "${CHART_IMAGE}:${VERSION}" 2>&1); then
              if [ "$EVENT_NAME" != workflow_dispatch ]; then
                echo "refused: ${CHART_IMAGE}:${VERSION} already exists; initial release runs never reuse chart tags." >&2
                exit 1
              fi
              echo "chart-exists=true" >> "$GITHUB_OUTPUT"
            else
              case "$chart_found" in
                *"not found"*|*"manifest unknown"*) echo "chart-exists=false" >> "$GITHUB_OUTPUT" ;;
                *)
                  echo "refused: could not resolve ${CHART_IMAGE}:${VERSION} reliably:" >&2
                  printf '%s\n' "$chart_found" >&2
                  exit 1
                  ;;
              esac
            fi
          fi

      # The packager reads the frozen directory and writes only under target/. Full checkout
      # history makes its default SOURCE_DATE_EPOCH the author time of the last commit touching
      # that bundle, so the same source commit yields the same manifest digest on another runner.
      - name: Package and inspect the development contract bundle
        id: bundle-package
        run: |
          set -euo pipefail
          package_output=$(cargo xtask package-bundle "${BUNDLE_VERSION}" --out "${BUNDLE_LAYOUT}")
          printf '%s\n' "$package_output"
          package_digest=${package_output%% *}
          case "$package_digest" in
            sha256:*) ;;
            *) echo "refused: package-bundle reported no manifest digest ('${package_digest}')." >&2; exit 1 ;;
          esac

          descriptor=$(oras manifest fetch --descriptor --oci-layout "${BUNDLE_LAYOUT}:${BUNDLE_VERSION}")
          printf '%s\n' "$descriptor" \
            | jq -e \
                --arg digest "$package_digest" \
                --arg version "$BUNDLE_VERSION" \
                '.digest == $digest
                 and .annotations["org.opencontainers.image.version"] == $version
                 and .annotations["org.opencontainers.image.ref.name"] == $version
                 and .annotations["dev.b10x.contract.status"] == "development"' >/dev/null
          layout_digest=$(oras resolve --oci-layout "${BUNDLE_LAYOUT}:${BUNDLE_VERSION}")
          if [ "$layout_digest" != "$package_digest" ]; then
            echo "refused: package-bundle reported ${package_digest}, but its OCI layout resolves to ${layout_digest}." >&2
            exit 1
          fi
          echo "packaged ${BUNDLE_IMAGE}:${BUNDLE_VERSION} -> ${package_digest} (development)"
          echo "digest=${package_digest}" >> "$GITHUB_OUTPUT"

      - name: Resolve the write-once contract-bundle tag
        id: bundle-state
        env:
          PACKAGE_DIGEST: ${{ steps.bundle-package.outputs.digest }}
        run: |
          set -euo pipefail
          if remote_digest=$(oras resolve "${BUNDLE_IMAGE}:${BUNDLE_VERSION}" 2>&1); then
            if [ "$remote_digest" != "$PACKAGE_DIGEST" ]; then
              echo "refused: ${BUNDLE_IMAGE}:${BUNDLE_VERSION} already names ${remote_digest}, not deterministic package ${PACKAGE_DIGEST}; it will not be overwritten." >&2
              exit 1
            fi
            echo "reusing byte-identical ${BUNDLE_IMAGE}:${BUNDLE_VERSION} at ${remote_digest}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            case "$remote_digest" in
              *"not found"*|*"manifest unknown"*) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "refused: could not resolve ${BUNDLE_IMAGE}:${BUNDLE_VERSION} reliably:" >&2
                printf '%s\n' "$remote_digest" >&2
                exit 1
                ;;
            esac
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Publish and prove the bundle before mutating the daemon-image tag. A newly created GHCR
      # package may initially be private; failing its anonymous check here leaves the daemon tag
      # untouched, and a retry can safely reuse the same deterministic bundle after visibility is
      # corrected. A later daemon release can likewise reuse this exact write-once bundle.
      - name: Publish or reuse the exact development contract-bundle layout
        id: bundle
        env:
          EXISTS: ${{ steps.bundle-state.outputs.exists }}
          PACKAGE_DIGEST: ${{ steps.bundle-package.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          if [ "$EXISTS" != true ]; then
            if remote_digest=$(DOCKER_CONFIG="$anonymous_config" \
                oras resolve "${BUNDLE_IMAGE}:${BUNDLE_VERSION}" 2>&1); then
              if [ "$remote_digest" != "$PACKAGE_DIGEST" ]; then
                echo "refused: ${BUNDLE_IMAGE}:${BUNDLE_VERSION} appeared at ${remote_digest}, not ${PACKAGE_DIGEST}; it will not be overwritten." >&2
                exit 1
              fi
            else
              case "$remote_digest" in
                *"not found"*|*"manifest unknown"*)
                  oras cp --from-oci-layout --no-tty \
                    "${BUNDLE_LAYOUT}:${BUNDLE_VERSION}" \
                    "${BUNDLE_IMAGE}:${BUNDLE_VERSION}"
                  ;;
                *)
                  echo "refused: could not prove ${BUNDLE_IMAGE}:${BUNDLE_VERSION} absent immediately before push:" >&2
                  printf '%s\n' "$remote_digest" >&2
                  exit 1
                  ;;
              esac
            fi
          fi

          # Read back through a credential-free client. A successful authenticated push is not
          # evidence that consumers can retrieve the package, and GHCR can briefly lag after a
          # new public tag appears. Bound the wait and retain the final registry answer.
          remote_digest=
          resolve_error=
          for attempt in 1 2 3 4 5; do
            if remote_digest=$(DOCKER_CONFIG="$anonymous_config" \
                oras resolve "${BUNDLE_IMAGE}:${BUNDLE_VERSION}" 2>&1); then
              break
            fi
            resolve_error=$remote_digest
            remote_digest=
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done
          if [ -z "$remote_digest" ]; then
            echo "refused: ${BUNDLE_IMAGE}:${BUNDLE_VERSION} was not anonymously resolvable after publication:" >&2
            printf '%s\n' "$resolve_error" >&2
            exit 1
          fi
          if [ "$remote_digest" != "$PACKAGE_DIGEST" ]; then
            echo "refused: published bundle resolves to ${remote_digest}, not packaged digest ${PACKAGE_DIGEST}." >&2
            exit 1
          fi
          # A registry descriptor carries media type, digest and size. OCI annotations live on the
          # manifest itself, so inspect the manifest content after the digest comparison above.
          remote_manifest=$(DOCKER_CONFIG="$anonymous_config" \
            oras manifest fetch "${BUNDLE_IMAGE}@${remote_digest}")
          printf '%s\n' "$remote_manifest" \
            | jq -e \
                --arg version "$BUNDLE_VERSION" \
                '.annotations["org.opencontainers.image.version"] == $version
                 and .annotations["dev.b10x.contract.status"] == "development"' >/dev/null
          echo "resolved ${BUNDLE_IMAGE}:${BUNDLE_VERSION} -> ${remote_digest} (development)"
          echo "digest=${remote_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the development contract bundle keylessly
        env:
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${BUNDLE_IMAGE}@${BUNDLE_DIGEST}"

      - name: Verify the contract-bundle signature with this release identity
        id: bundle-verify
        env:
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "certificate identity: ${identity}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${BUNDLE_IMAGE}@${BUNDLE_DIGEST}" > bundle-cosign-verify.json
          jq -e 'length > 0' bundle-cosign-verify.json >/dev/null
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Prove the contract bundle is anonymously retrievable
        env:
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" \
            oras manifest fetch --descriptor "${BUNDLE_IMAGE}@${BUNDLE_DIGEST}" >/dev/null

      # A recovery dispatch runs this file from `main` against an older tagged source. A tag cut
      # before the `release-binaries` stage existed is released without binaries, and says so; a
      # tag push runs this file from the tag itself, so there the stage's absence is refused.
      - name: Find out whether the tagged source builds release binaries
        id: binary-source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "refused: the tagged source has no Dockerfile." >&2
            exit 1
          fi
          if grep -qx 'FROM scratch AS release-binaries' Dockerfile; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "the tagged source predates the release-binaries stage: this recovery publishes no release binaries."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused: the tagged source's Dockerfile has no release-binaries stage." >&2
            exit 1
          fi

      - name: Find out whether the tagged source builds the executor image
        id: executor-source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "refused: the tagged source has no Dockerfile." >&2
            exit 1
          fi
          if grep -qx 'FROM scratch AS executor' Dockerfile; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "the tagged source predates the executor stage: this recovery publishes no executor image."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "refused: the tagged source's Dockerfile has no executor stage." >&2
            exit 1
          fi

      # The binaries come from the Dockerfile's pinned `builder` stage, the one the daemon and MCP
      # images copy from, so the toolchain is the image's and the daemon build below reuses this
      # exact stage. Every binary refusal runs before any image tag is mutated.
      - name: Export the release binaries from the pinned builder stage
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --target release-binaries \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --output "type=local,dest=${BINARY_DIST}/bin" \
            .
          ls -l "${BINARY_DIST}/bin"

      # SOURCE_SHA becomes `org.opencontainers.image.revision` on the published daemon target, so
      # the image says which commit produced it. Nothing is pushed here: the archived daemon is
      # proven to be this image's daemon first.
      - name: Build and smoke-test the daemon image
        env:
          EXISTS: ${{ steps.artifact-state.outputs.daemon-exists }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --target daemon \
            --platform linux/amd64 \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            --provenance=false \
            --sbom=false \
            --metadata-file image-metadata.json \
            --load \
            .
          docker run --rm --entrypoint /usr/local/bin/substrate-daemon \
            "${IMAGE}:${VERSION}" --help >/dev/null
          cargo run --release --locked -p xtask -- \
            check-image-startup --image "${IMAGE}:${VERSION}"

          container=$(docker create "${IMAGE}:${VERSION}")
          mkdir -p target/image-under-test
          docker cp \
            "${container}:/usr/local/bin/substrate-daemon" \
            target/image-under-test/substrate-daemon
          docker rm "${container}"
          chmod 0755 target/image-under-test/substrate-daemon
          SUBSTRATE_VECTORS_DAEMON="${PWD}/target/image-under-test/substrate-daemon" \
            cargo test --release --locked \
              -p b10x-substrate-daemon --test runtime_vectors -- --nocapture

          if [ "$EXISTS" = true ]; then
            docker pull "${IMAGE}:${VERSION}"
            revision=$(docker image inspect "${IMAGE}:${VERSION}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [ "$revision" != "$SOURCE_SHA" ]; then
              echo "refused: existing ${IMAGE}:${VERSION} names source ${revision}, not ${SOURCE_SHA}." >&2
              exit 1
            fi
            docker run --rm --entrypoint /usr/local/bin/substrate-daemon \
              "${IMAGE}:${VERSION}" --help >/dev/null
            cargo run --release --locked -p xtask -- \
              check-image-startup --image "${IMAGE}:${VERSION}"
            container=$(docker create "${IMAGE}:${VERSION}")
            docker cp \
              "${container}:/usr/local/bin/substrate-daemon" \
              target/image-under-test/substrate-daemon
            docker rm "${container}"
            chmod 0755 target/image-under-test/substrate-daemon
            SUBSTRATE_VECTORS_DAEMON="${PWD}/target/image-under-test/substrate-daemon" \
              cargo test --release --locked \
                -p b10x-substrate-daemon --test runtime_vectors -- --nocapture
            echo "reusing ${IMAGE}:${VERSION} from the same tagged source ${SOURCE_SHA}"
          fi

      # target/image-under-test holds the daemon of the image this release publishes: the one just
      # built, or on a recovery run the reused image's. An initial run's archive must already be
      # those bytes, since both builds read one cached builder stage; a recovery run archives the
      # reused image's daemon instead of its own build. Either way the archive is the image's.
      - name: Prove the archived daemon is the image's daemon
        if: steps.binary-source.outputs.present == 'true'
        env:
          EXISTS: ${{ steps.artifact-state.outputs.daemon-exists }}
        run: |
          set -euo pipefail
          case "$EXISTS" in
            true)
              install -m 0755 target/image-under-test/substrate-daemon "${BINARY_DIST}/bin/substrate-daemon"
              echo "recovery: archiving the daemon of the reused ${IMAGE}:${VERSION}, not this run's build."
              ;;
            false) ;;
            *)
              echo "refused: no answer on whether ${IMAGE}:${VERSION} already exists ('${EXISTS}')." >&2
              exit 1
              ;;
          esac
          if ! cmp "${BINARY_DIST}/bin/substrate-daemon" target/image-under-test/substrate-daemon; then
            echo "refused: the archived substrate-daemon is not the daemon in ${IMAGE}:${VERSION}." >&2
            exit 1
          fi
          echo "the archived substrate-daemon is byte-identical to the one in ${IMAGE}:${VERSION}"

      # The builder's Debian has glibc 2.36, so a 2.35 floor holds only while no symbol newer than
      # it is linked. Read the requirement off each binary instead of assuming it.
      - name: Refuse release binaries a glibc 2.35 host cannot load
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          allowed='libssl.so.3 libcrypto.so.3 libz.so.1 libgcc_s.so.1 libm.so.6 libc.so.6 ld-linux-x86-64.so.2'
          for binary in substrate-daemon b10x-substrate; do
            file="${BINARY_DIST}/bin/${binary}"
            newest=$(objdump -T "$file" \
              | { grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' || true; } \
              | sort -uV | tail -n 1)
            if [ -z "$newest" ]; then
              echo "refused: ${binary} names no GLIBC symbol version; its glibc floor cannot be read." >&2
              exit 1
            fi
            highest=$(printf '%s\n%s\n' "${newest#GLIBC_}" "$GLIBC_CEILING" | sort -V | tail -n 1)
            if [ "$highest" != "$GLIBC_CEILING" ]; then
              echo "refused: ${binary} needs ${newest}, newer than glibc ${GLIBC_CEILING} on the oldest supported host." >&2
              exit 1
            fi
            needed=$(readelf -d "$file" | sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p')
            for library in $needed; do
              case " ${allowed} " in
                *" ${library} "*) ;;
                *)
                  echo "refused: ${binary} needs ${library}, which is not among the runtime libraries README.md documents." >&2
                  exit 1
                  ;;
              esac
            done
            echo "${binary} needs ${newest} (ceiling ${GLIBC_CEILING}) and only: ${needed//$'\n'/ }"
          done

      - name: Smoke-test the release binaries on the oldest supported glibc
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --volume "${PWD}/${BINARY_DIST}/bin:/release-binaries:ro" \
            "${GLIBC_FLOOR_IMAGE}" \
            sh -c 'ldd --version | head -n 1 &&
              /release-binaries/substrate-daemon --help >/dev/null &&
              /release-binaries/b10x-substrate --help >/dev/null'

      - name: Package the release binaries
        id: binaries
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct "${SOURCE_SHA}")
          mkdir -p "${BINARY_DIST}/assets" "${BINARY_DIST}/stage"
          archives=(
            "substrate-daemon-${VERSION}-${BINARY_TARGET}.tar.gz"
            "b10x-substrate-${VERSION}-${BINARY_TARGET}.tar.gz"
          )
          for archive in "${archives[@]}"; do
            stem=${archive%.tar.gz}
            binary=${stem%"-${VERSION}-${BINARY_TARGET}"}
            mkdir -p "${BINARY_DIST}/stage/${stem}"
            install -m 0755 "${BINARY_DIST}/bin/${binary}" "${BINARY_DIST}/stage/${stem}/${binary}"
            install -m 0644 LICENSE THIRD_PARTY_LICENSES.html README.md "${BINARY_DIST}/stage/${stem}/"
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
              -C "${BINARY_DIST}/stage" -cf - "${stem}" \
              | gzip -n -9 > "${BINARY_DIST}/assets/${archive}"
          done
          cd "${BINARY_DIST}/assets"
          sha256sum -- "${archives[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cat SHA256SUMS
          echo "sums-digest=sha256:$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Build, smoke-test and push the executor image once
        id: executor-build
        if: steps.executor-source.outputs.present == 'true'
        env:
          EXISTS: ${{ steps.artifact-state.outputs.executor-exists }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --target executor \
            --platform linux/amd64 \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${EXECUTOR_IMAGE}:${VERSION}" \
            --provenance=false \
            --sbom=false \
            --metadata-file executor-image-metadata.json \
            --load \
            .

          check_executor() {
            local handshake entrypoint container headers
            handshake=$(docker run --rm --network none --read-only --entrypoint /substrate-executor "${EXECUTOR_IMAGE}:${VERSION}" version)
            if ! printf '%s\n' "$handshake" | jq -se \
                --arg version "$VERSION" \
                --arg source "$SOURCE_SHA" \
                '. == [{"protocol": "substrate-executor/1", "version": $version, "source": $source}]' >/dev/null 2>&1; then
              echo "refused: /substrate-executor in ${EXECUTOR_IMAGE}:${VERSION} answers the version handshake with '${handshake}', not substrate-executor/1 at ${VERSION} from ${SOURCE_SHA}." >&2
              return 1
            fi
            entrypoint=$(docker image inspect --format '{{json .Config.Entrypoint}}' "${EXECUTOR_IMAGE}:${VERSION}")
            if ! printf '%s\n' "$entrypoint" | jq -se '. == [["/substrate-executor"]]' >/dev/null 2>&1; then
              echo "refused: ${EXECUTOR_IMAGE}:${VERSION} has the entrypoint '${entrypoint}', not [\"/substrate-executor\"]." >&2
              return 1
            fi
            container=$(docker create "${EXECUTOR_IMAGE}:${VERSION}")
            mkdir -p target/executor-image-under-test
            docker cp \
              "${container}:/substrate-executor" \
              target/executor-image-under-test/substrate-executor
            docker rm "${container}" >/dev/null
            headers=$(readelf -lW target/executor-image-under-test/substrate-executor)
            if ! printf '%s\n' "$headers" | grep -q '^Program Headers:' \
              || printf '%s\n' "$headers" | grep -q INTERP; then
              echo "refused: the substrate-executor in ${EXECUTOR_IMAGE}:${VERSION} is not a static executable." >&2
              return 1
            fi
          }
          check_executor

          git fetch --force --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
          current_sha=$(git rev-parse "refs/tags/${VERSION}^{commit}")
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "refused: release tag moved from ${SOURCE_SHA} to ${current_sha} before executor publication." >&2
            exit 1
          fi
          case "$EXISTS" in
            true)
              docker pull "${EXECUTOR_IMAGE}:${VERSION}"
              revision=$(docker image inspect "${EXECUTOR_IMAGE}:${VERSION}" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
              if [ "$revision" != "$SOURCE_SHA" ]; then
                echo "refused: existing ${EXECUTOR_IMAGE}:${VERSION} names source ${revision}, not ${SOURCE_SHA}." >&2
                exit 1
              fi
              check_executor
              echo "reusing ${EXECUTOR_IMAGE}:${VERSION} from the same tagged source ${SOURCE_SHA}"
              ;;
            false)
              if docker manifest inspect "${EXECUTOR_IMAGE}:${VERSION}" >/dev/null 2>&1; then
                echo "refused: ${EXECUTOR_IMAGE}:${VERSION} appeared before push; it will not be overwritten." >&2
                exit 1
              fi
              docker push "${EXECUTOR_IMAGE}:${VERSION}"
              ;;
            *)
              echo "refused: no answer on whether ${EXECUTOR_IMAGE}:${VERSION} already exists ('${EXISTS}')." >&2
              exit 1
              ;;
          esac
          digest=$(docker buildx imagetools inspect "${EXECUTOR_IMAGE}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "refused: buildx reported no executor image digest ('${digest}')." >&2; exit 1 ;;
          esac
          echo "pushed ${EXECUTOR_IMAGE}:${VERSION} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Push the daemon image once
        id: build
        env:
          EXISTS: ${{ steps.artifact-state.outputs.daemon-exists }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
          current_sha=$(git rev-parse "refs/tags/${VERSION}^{commit}")
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "refused: release tag moved from ${SOURCE_SHA} to ${current_sha} before publication." >&2
            exit 1
          fi
          if [ "$EXISTS" != true ]; then
            if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "refused: ${IMAGE}:${VERSION} appeared before push; it will not be overwritten." >&2
              exit 1
            fi
            docker push "${IMAGE}:${VERSION}"
          fi
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "refused: buildx reported no image digest ('${digest}')." >&2; exit 1 ;;
          esac
          echo "pushed ${IMAGE}:${VERSION} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build, smoke-test and push the disposable MCP image once
        id: mcp-build
        env:
          EXISTS: ${{ steps.artifact-state.outputs.mcp-exists }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --target mcp \
            --platform linux/amd64 \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${MCP_IMAGE}:${VERSION}" \
            --provenance=false \
            --sbom=false \
            --metadata-file mcp-image-metadata.json \
            --load \
            .

          container=$(docker create "${MCP_IMAGE}:${VERSION}")
          mkdir -p target/mcp-image-under-test
          docker cp \
            "${container}:/usr/local/bin/substrate-mcp" \
            target/mcp-image-under-test/substrate-mcp
          docker rm "${container}"
          chmod 0755 target/mcp-image-under-test/substrate-mcp
          SUBSTRATE_MCP_BINARY="${PWD}/target/mcp-image-under-test/substrate-mcp" \
            cargo test --release --locked \
              -p b10x-substrate-mcp --test stdio -- --nocapture
          SUBSTRATE_MCP_DOCKER_IMAGE="${MCP_IMAGE}:${VERSION}" \
            cargo test --release --locked \
              -p b10x-substrate-mcp --test stdio -- --nocapture

          git fetch --force --no-tags origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
          current_sha=$(git rev-parse "refs/tags/${VERSION}^{commit}")
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "refused: release tag moved from ${SOURCE_SHA} to ${current_sha} before MCP publication." >&2
            exit 1
          fi
          if [ "$EXISTS" = true ]; then
            docker pull "${MCP_IMAGE}:${VERSION}"
            revision=$(docker image inspect "${MCP_IMAGE}:${VERSION}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            if [ "$revision" != "$SOURCE_SHA" ]; then
              echo "refused: existing ${MCP_IMAGE}:${VERSION} names source ${revision}, not ${SOURCE_SHA}." >&2
              exit 1
            fi
            container=$(docker create "${MCP_IMAGE}:${VERSION}")
            docker cp \
              "${container}:/usr/local/bin/substrate-mcp" \
              target/mcp-image-under-test/substrate-mcp
            docker rm "${container}"
            chmod 0755 target/mcp-image-under-test/substrate-mcp
            SUBSTRATE_MCP_BINARY="${PWD}/target/mcp-image-under-test/substrate-mcp" \
              cargo test --release --locked \
                -p b10x-substrate-mcp --test stdio -- --nocapture
            SUBSTRATE_MCP_DOCKER_IMAGE="${MCP_IMAGE}:${VERSION}" \
              cargo test --release --locked \
                -p b10x-substrate-mcp --test stdio -- --nocapture
            echo "reusing ${MCP_IMAGE}:${VERSION} from the same tagged source ${SOURCE_SHA}"
          else
            if docker manifest inspect "${MCP_IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "refused: ${MCP_IMAGE}:${VERSION} appeared before push; it will not be overwritten." >&2
              exit 1
            fi
            docker push "${MCP_IMAGE}:${VERSION}"
          fi
          digest=$(docker buildx imagetools inspect "${MCP_IMAGE}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "refused: buildx reported no MCP image digest ('${digest}')." >&2; exit 1 ;;
          esac
          echo "pushed ${MCP_IMAGE}:${VERSION} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Keyless: the certificate is issued against this job's OIDC token (`id-token: write`), so
      # the identity bound into the signature is this workflow file at this ref, not a key anyone
      # holds. Signed by digest, never by tag — a tag is a mutable pointer and signing one signs
      # nothing durable.
      - name: Sign the image keylessly
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign the disposable MCP image keylessly
        env:
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${MCP_IMAGE}@${MCP_DIGEST}"

      - name: Sign the executor image keylessly
        if: steps.executor-source.outputs.present == 'true'
        env:
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}"

      # The archives are covered through `SHA256SUMS`; the Sigstore bundle carries the certificate,
      # signature and transparency-log proof, so verifying needs no registry.
      - name: Sign the release-binary checksums keylessly
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${BINARY_DIST}/assets/SHA256SUMS.sigstore.json" \
            "${BINARY_DIST}/assets/SHA256SUMS"

      # The verification an operator will run, run here first. `--certificate-identity` is exact,
      # not a regex: it is this file, at this tag, and a signature from any other workflow, ref or
      # repository fails. This step is the last thing before anything is announced, so a Sigstore
      # or verification failure leaves no release and no changelog claim behind.
      - name: Verify the signature with the workflow identity
        id: verify
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "certificate identity: ${identity}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${DIGEST}" > cosign-verify.json
          jq -e 'length > 0' cosign-verify.json > /dev/null
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Verify the MCP signature with the workflow identity
        id: mcp-verify
        env:
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "certificate identity: ${identity}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${MCP_IMAGE}@${MCP_DIGEST}" > mcp-cosign-verify.json
          jq -e 'length > 0' mcp-cosign-verify.json >/dev/null
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Verify the executor signature with the workflow identity
        id: executor-verify
        if: steps.executor-source.outputs.present == 'true'
        env:
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "certificate identity: ${identity}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}" > executor-cosign-verify.json
          jq -e 'length > 0' executor-cosign-verify.json >/dev/null
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Verify the release-binary checksum signature with the workflow identity
        id: binaries-verify
        if: steps.binary-source.outputs.present == 'true'
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "certificate identity: ${identity}"
          cosign verify-blob \
            --bundle "${BINARY_DIST}/assets/SHA256SUMS.sigstore.json" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${BINARY_DIST}/assets/SHA256SUMS"
          cd "${BINARY_DIST}/assets"
          sha256sum --check --strict SHA256SUMS
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Prove the image is anonymously retrievable
        id: anonymous
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker pull "${IMAGE}@${DIGEST}"

      - name: Prove the MCP image is anonymously retrievable
        id: mcp-anonymous
        env:
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker pull "${MCP_IMAGE}@${MCP_DIGEST}"

      - name: Prove the executor image is anonymously retrievable
        id: executor-anonymous
        if: steps.executor-source.outputs.present == 'true'
        env:
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          DOCKER_CONFIG="$anonymous_config" docker pull "${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}"

      - name: Install the pinned Helm release
        if: env.CHART == 'present'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/helm-download" "$RUNNER_TEMP/helm-bin"
          curl --fail --location --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" --output "$RUNNER_TEMP/helm-download/helm.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm-download/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm-download/helm.tar.gz" -C "$RUNNER_TEMP/helm-download" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/helm-download/linux-amd64/helm" "$RUNNER_TEMP/helm-bin/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"

      - name: Package the Kubernetes chart
        if: env.CHART == 'present'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cargo run --release --locked -p xtask -- package-chart \
            --version "${VERSION}" \
            --image-digest "${DIGEST}" \
            --out target/release-chart \
            --helm "$RUNNER_TEMP/helm-bin/helm"
          archive="target/release-chart/b10x-substrate-${VERSION}.tgz"
          echo "packaged ${archive} -> sha256:$(sha256sum "$archive" | cut -d' ' -f1)"

      - name: Log in to the chart registry
        if: env.CHART == 'present'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Package and push the Kubernetes chart once
        id: chart
        if: env.CHART == 'present'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          resolve_chart() {
            local found
            if found=$(oras resolve "${CHART_IMAGE}:${VERSION}" 2>&1); then
              case "$found" in
                sha256:*) printf '%s\n' "$found" ;;
                *) echo "refused: the registry reported no chart digest ('${found}')." >&2; return 1 ;;
              esac
            else
              case "$found" in
                *"not found"*|*"manifest unknown"*) echo absent ;;
                *)
                  echo "refused: could not resolve ${CHART_IMAGE}:${VERSION} reliably:" >&2
                  printf '%s\n' "$found" >&2
                  return 1
                  ;;
              esac
            fi
          }
          chart_layer() {
            oras manifest fetch "${CHART_IMAGE}@$1" \
              | jq -er '[.layers[] | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip")] as $charts
                  | if (.layers | length) == 1 and ($charts | length) == 1 then $charts[0].digest else error("not exactly one chart layer") end'
          }
          remote_digest=$(resolve_chart)
          archive="target/release-chart/b10x-substrate-${VERSION}.tgz"
          if [ ! -f "$archive" ]; then
            echo "refused: ${archive} was not packaged; nothing is published or reused without the local chart to compare." >&2
            exit 1
          fi
          local_layer="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          if [ "$remote_digest" != absent ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ]; then
              echo "refused: ${CHART_IMAGE}:${VERSION} already exists; initial release runs never reuse chart tags." >&2
              exit 1
            fi
            remote_layer=$(chart_layer "$remote_digest")
            if [ "$remote_layer" != "$local_layer" ]; then
              echo "refused: ${CHART_IMAGE}@${remote_digest} carries chart ${remote_layer}, not the deterministic package ${local_layer}; it will not be overwritten." >&2
              exit 1
            fi
            echo "reusing ${CHART_IMAGE}:${VERSION} at ${remote_digest}, whose chart is byte for byte ${local_layer}"
          else
            if [ "$(resolve_chart)" != absent ]; then
              echo "refused: ${CHART_IMAGE}:${VERSION} appeared before push; it will not be overwritten." >&2
              exit 1
            fi
            helm push "$archive" "oci://${CHART_REPOSITORY}"
            remote_digest=$(resolve_chart)
            if [ "$remote_digest" = absent ]; then
              echo "refused: ${CHART_IMAGE}:${VERSION} does not resolve after the push." >&2
              exit 1
            fi
            pushed_layer=$(chart_layer "$remote_digest")
            if [ "$pushed_layer" != "$local_layer" ]; then
              echo "refused: ${CHART_IMAGE}@${remote_digest} carries chart ${pushed_layer}, not the pushed ${local_layer}." >&2
              exit 1
            fi
          fi
          echo "chart ${CHART_IMAGE}:${VERSION} -> ${remote_digest} (chart ${local_layer})"
          echo "digest=${remote_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the Kubernetes chart keylessly
        if: env.CHART == 'present'
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_IMAGE}@${CHART_DIGEST}"

      - name: Verify the chart signature with the workflow identity
        id: chart-verify
        if: env.CHART == 'present'
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${CHART_IMAGE}@${CHART_DIGEST}" > chart-cosign-verify.json
          jq -e 'length > 0' chart-cosign-verify.json > /dev/null
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"

      - name: Attest the chart's build provenance
        id: chart-attest
        if: env.CHART == 'present'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_IMAGE }}
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Verify the chart provenance with the workflow identity
        id: chart-provenance
        if: env.CHART == 'present'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${CHART_IMAGE}@${CHART_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --predicate-type 'https://slsa.dev/provenance/v1'

      - name: Prove the chart is anonymously retrievable
        id: chart-anonymous
        if: env.CHART == 'present'
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          anonymous_config=$(mktemp -d)
          anonymous_digest=$(DOCKER_CONFIG="$anonymous_config" oras resolve "${CHART_IMAGE}:${VERSION}")
          if [ "$anonymous_digest" != "$CHART_DIGEST" ]; then
            echo "refused: ${CHART_IMAGE}:${VERSION} resolves anonymously to '${anonymous_digest}', not ${CHART_DIGEST}." >&2
            exit 1
          fi
          HELM_REGISTRY_CONFIG="$anonymous_config/registry.json" \
            helm pull "oci://${CHART_IMAGE}" --version "${VERSION}" --destination "$anonymous_config"

      # Everything below announces. Nothing above it did.

      # The release notes state what each artifact is and, as explicitly, what it is not. The wire
      # contract bundles under `contracts/substrate-wire/` are **development** bundles: publishing
      # and signing one does not make it a stable contract, and a stable-contract decision is its
      # own ADR under atlas ADR 0019
      # (`architecture/adr/0019-substrate-contract-release-and-conformance.md`, cited by path because it
      # lives outside this repository — AGENTS.md, section "Links"). The daemon target's `VOLUME`
      # and `EXPOSE 8080` describe the development-only TCP posture that
      # `docs/design/06-authentication-secrets-and-trust.md`, section 1, marks `development_only`;
      # the notes must not read as a hosted posture.
      - name: Compose release notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ steps.verify.outputs.identity }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
          BUNDLE_IDENTITY: ${{ steps.bundle-verify.outputs.identity }}
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
          MCP_IDENTITY: ${{ steps.mcp-verify.outputs.identity }}
          SUMS_DIGEST: ${{ steps.binaries.outputs.sums-digest }}
          BINARIES_IDENTITY: ${{ steps.binaries-verify.outputs.identity }}
          BINARIES: ${{ steps.binary-source.outputs.present }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          CHART_IDENTITY: ${{ steps.chart-verify.outputs.identity }}
          EXECUTOR: ${{ steps.executor-source.outputs.present }}
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
          EXECUTOR_IDENTITY: ${{ steps.executor-verify.outputs.identity }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Built by this release workflow from \`${SOURCE_SHA}\`, the commit this tag names, after
          \`.github/workflows/gate.yml\` concluded \`success\` for it: ${GATE_RUN_URL}

          ## Image

          | | |
          | --- | --- |
          | image | \`${IMAGE}:${VERSION}\` |
          | digest | \`${DIGEST}\` |
          | revision label | \`${SOURCE_SHA}\` (\`org.opencontainers.image.revision\`) |
          | platform | \`linux/amd64\` |

          Pull by digest, never by tag:

          \`\`\`console
          docker pull ${IMAGE}@${DIGEST}
          \`\`\`

          ## Disposable MCP test image

          | | |
          | --- | --- |
          | image | \`${MCP_IMAGE}:${VERSION}\` |
          | digest | \`${MCP_DIGEST}\` |
          | posture | local stdio development/conformance testing |

          Run by digest with stdin attached, no network, a read-only root and private temporary
          state:

          \`\`\`console
          docker run --rm -i --network=none --read-only --tmpfs /tmp:rw,nosuid,nodev \
            ${MCP_IMAGE}@${MCP_DIGEST}
          \`\`\`

          ## Development contract bundle

          | | |
          | --- | --- |
          | artifact | \`${BUNDLE_IMAGE}:${BUNDLE_VERSION}\` |
          | digest | \`${BUNDLE_DIGEST}\` |
          | contract status | \`development\` (\`dev.b10x.contract.status\`) |

          Copy the exact OCI layout by digest, never by tag:

          \`\`\`console
          oras cp --to-oci-layout \\
            ${BUNDLE_IMAGE}@${BUNDLE_DIGEST} \\
            ./substrate-wire-${BUNDLE_VERSION}:${BUNDLE_VERSION}
          \`\`\`

          NOTES
          case "$EXECUTOR" in
          true)
          cat >> release-notes.md <<NOTES
          ## Executor image

          | | |
          | --- | --- |
          | image | \`${EXECUTOR_IMAGE}:${VERSION}\` |
          | digest | \`${EXECUTOR_DIGEST}\` |
          | revision label | \`${SOURCE_SHA}\` (\`org.opencontainers.image.revision\`) |
          | platform | \`linux/amd64\` |

          The static \`substrate-executor\` the Kubernetes namespace driver runs in its keeper and
          exec Pods, on an empty base image. A daemon talks only to the executor of its own
          release; before publication this workflow required the image's version handshake to
          name \`substrate-executor/1\`, \`${VERSION}\` and \`${SOURCE_SHA}\`, and its executable to
          be static. Pin it by digest and verify its signature:

          \`\`\`console
          cosign verify \\
            --certificate-identity ${EXECUTOR_IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${EXECUTOR_IMAGE}@${EXECUTOR_DIGEST}
          \`\`\`

          NOTES
          ;;
          false)
          cat >> release-notes.md <<NOTES
          ## Executor image

          This release carries no executor image. It was published by a recovery run of a tag
          whose source predates the Dockerfile's \`executor\` stage.

          NOTES
          ;;
          *)
          echo "refused: no answer on whether this release carries the executor image ('${EXECUTOR}')." >&2
          exit 1
          ;;
          esac
          case "$BINARIES" in
          true)
          cat >> release-notes.md <<NOTES
          ## Release binaries

          | | |
          | --- | --- |
          | daemon | \`substrate-daemon-${VERSION}-${BINARY_TARGET}.tar.gz\` |
          | command-line client | \`b10x-substrate-${VERSION}-${BINARY_TARGET}.tar.gz\` |
          | checksums | \`SHA256SUMS\` (\`${SUMS_DIGEST}\`), signed in \`SHA256SUMS.sigstore.json\` |
          | runs on | x86_64 Linux with glibc 2.35 or newer (Ubuntu 22.04, Debian 12 and later), \`libssl3\` and \`zlib1g\` |

          Both are exported from the pinned builder stage the images are built from; the daemon
          archive holds the daemon of the image above, byte for byte. Each archive holds the binary,
          \`LICENSE\`, \`THIRD_PARTY_LICENSES.html\` and \`README.md\`. Before release this workflow
          refused any binary needing a newer glibc or an undocumented shared library and started
          both in \`${GLIBC_FLOOR_IMAGE}\`. Verify the signature first, then the archives:

          \`\`\`console
          cosign verify-blob \\
            --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity ${BINARIES_IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`

          NOTES
          ;;
          false)
          cat >> release-notes.md <<NOTES
          ## Release binaries

          This release carries no binaries: no archives, no \`SHA256SUMS\` and no checksum
          signature. It was published by a recovery run of a tag whose source predates the
          Dockerfile's \`release-binaries\` stage, so there was nothing to export.

          NOTES
          ;;
          *)
          echo "refused: no answer on whether this release carries binaries ('${BINARIES}')." >&2
          exit 1
          ;;
          esac
          case "$CHART" in
          present)
          cat >> release-notes.md <<NOTES
          ## Kubernetes chart

          | | |
          | --- | --- |
          | chart | \`oci://${CHART_IMAGE}\` version \`${VERSION}\` |
          | digest | \`${CHART_DIGEST}\` |
          | default image | \`${IMAGE}@${DIGEST}\` |
          | chart lane | ${CHART_LANE_RUN_URL} |
          | chart lane absent, not passed | ${CHART_LANE_ABSENT} |

          The node-bound serving profile of ADR 0046: one StatefulSet pod per dedicated node, each
          with its own ledger claim, addressed by its own host name. Install by version and check
          the digest, the signature and the build provenance first:

          \`\`\`console
          cosign verify \\
            --certificate-identity ${CHART_IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${CHART_IMAGE}@${CHART_DIGEST}
          gh attestation verify oci://${CHART_IMAGE}@${CHART_DIGEST} --repo ${GITHUB_REPOSITORY}
          helm install substrate oci://${CHART_IMAGE} --version ${VERSION} --values values.yaml
          \`\`\`

          NOTES
          ;;
          absent)
          cat >> release-notes.md <<NOTES
          ## Kubernetes chart

          This release carries no chart. It was published by a recovery run of a tag whose source
          predates \`deploy/helm/substrate\`.

          NOTES
          ;;
          *)
          echo "refused: no answer on whether this release carries a chart ('${CHART}')." >&2
          exit 1
          ;;
          esac
          cat >> release-notes.md <<NOTES
          ## Confinement lane

          | | |
          | --- | --- |
          | recorded run | \`${CONFINEMENT_EVIDENCE}\` |
          | command | \`bash scripts/delegated-lane.sh\` |
          | where | a workstation with bubblewrap and a delegated cgroup v2 subtree, not this runner |

          The fields are the commit, the delegated case count and when the run finished. The
          delegated lane needs an exclusive delegated cgroup subtree that a hosted runner does not
          have, so \`gate.yml\` reports it **absent — not executed, not passed**. This workflow does
          not run it either: it refuses to publish without the recorded line above, and that line
          must name this exact commit and the delegated case count this source declares.

          ## Quota lane

          | | |
          | --- | --- |
          | recorded run | \`${QUOTA_EVIDENCE}\` |
          | command | \`cargo xtask quota-fixture run\` |
          | where | a workstation whose Docker runs the checked-in \`fixtures/quota-lab\` recipe, not this runner |

          The fields are the commit, the number of \`real_quota_*\` cases and when the run finished.
          Those cases need a filesystem mounted with project quotas, which neither \`gate.yml\` nor
          the delegated lane has. This workflow does not run them: it refuses to publish without
          the recorded line above, and that line must name this exact commit and the real-quota
          case count this source declares.

          NOTES
          if [ "$CHART" = present ]; then
          cat >> release-notes.md <<NOTES
          ## Chart lane

          | | |
          | --- | --- |
          | local record | \`${CHART_EVIDENCE}\` |
          | command | \`cargo xtask chart-lane cluster --node-profiles\` |
          | where | a workstation kind cluster whose nodes load the Localhost seccomp and AppArmor profiles, not this runner |

          The fields are the commit, the number of chart-lane scenarios and when the run finished.
          The hosted chart lane (see *Kubernetes chart* above) cannot start the execution-enabled
          pod, so it reports those scenarios absent. The local run installs the node profiles,
          starts that pod, runs a confined exec through it and passes every scenario the source
          declares; this workflow refuses to publish a chart without the recorded line above, and
          that line must name this exact commit and that scenario count.

          NOTES
          fi
          case "$NAMESPACE_LANE" in
          present)
          cat >> release-notes.md <<NOTES
          ## Namespace lane

          | | |
          | --- | --- |
          | recorded run | \`${NAMESPACE_EVIDENCE}\` |
          | command | \`cargo xtask namespace-lane observe\` |
          | where | a workstation kind cluster the lane creates and deletes, not this runner |

          The fields are the commit, the number of namespace-lane observations and when the run
          finished. The kind cluster those observations need outlasts what a hosted check may
          take, so this workflow does not run them: it refuses to publish without the recorded
          line above, and that line must name this exact commit and the observation count this
          source declares.

          NOTES
          ;;
          absent)
          cat >> release-notes.md <<NOTES
          ## Namespace lane

          No record applies: this release was published by a recovery run of a tag whose source
          predates the namespace lane.

          NOTES
          ;;
          *)
          echo "refused: no answer on whether the tagged source has the namespace lane ('${NAMESPACE_LANE}')." >&2
          exit 1
          ;;
          esac
          case "$NAMESPACE_LANE_WORKFLOW" in
          present)
          cat >> release-notes.md <<NOTES
          The namespace lane's static checks ran in CI on this commit, and \`.github/workflows/namespace-lane.yml\` concluded \`success\` for it: ${NAMESPACE_LANE_RUN_URL}

          NOTES
          ;;
          absent)
          cat >> release-notes.md <<NOTES
          No namespace-lane static run applies: the tagged source predates \`.github/workflows/namespace-lane.yml\`.

          NOTES
          ;;
          *)
          echo "refused: no answer on whether the tagged source has the namespace-lane workflow ('${NAMESPACE_LANE_WORKFLOW}')." >&2
          exit 1
          ;;
          esac
          cat >> release-notes.md <<NOTES
          ## Verify the signatures

          All three image and bundle artifacts are signed keylessly through Sigstore, and so are
          any executor image (see *Executor image* above), any chart (see *Kubernetes chart* above) and any \`SHA256SUMS\` (see *Release binaries*). Each certificate identity is this workflow at the ref that
          performed the release, so a signature from any other workflow, ref or repository fails:

          \`\`\`console
          cosign verify \\
            --certificate-identity ${IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${IMAGE}@${DIGEST}

          cosign verify \\
            --certificate-identity ${BUNDLE_IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${BUNDLE_IMAGE}@${BUNDLE_DIGEST}

          cosign verify \\
            --certificate-identity ${MCP_IDENTITY} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            ${MCP_IMAGE}@${MCP_DIGEST}
          \`\`\`

          ## What this release does not claim

          - **The published wire contract remains a development bundle.**
            \`${BUNDLE_IMAGE}:${BUNDLE_VERSION}\` remains a **development** bundle; OCI publication,
            digest pinning and a verified signature do not make it a stable contract. A
            stable-contract decision is its own ADR under atlas ADR 0019
            (\`architecture/adr/0019-substrate-contract-release-and-conformance.md\`).
          - **The image's default posture is development, not hosted.** Its \`EXPOSE 8080\` and
            \`VOLUME\` describe the static-bearer TCP posture that design 06, section 1, marks
            \`development_only\`. The binary also implements the production TLS/Identity profile,
            but a hosted deployment must explicitly supply that profile's certificates, trust
            roots and authority settings; the default container command does not do so.
          - **The MCP image is local test tooling, not production ingress.** It has no listener,
            authentication or remote transport and is intended for an attached stdio harness with
            \`--network=none\`. Its tool surface is not a stable contract independent of Substrate.
          - **The binary is not bit-for-bit reproducible.** The digest above is recorded;
            reproducing it from source independently is a later milestone.
          - **The daemon archive is not a confined host by itself.** Running a confined command
            still needs bubblewrap and a delegated cgroup v2 subtree on the host; without them the
            daemon answers \`exec.sandbox-unavailable\`. No arm64 or macOS binary is published.
          - **The delegated execution lane is not exercised by CI.** A host without a delegated
            cgroup v2 subtree answers \`exec.sandbox-unavailable\` rather than running unconfined.
            This release records a local run of that lane (see *Confinement lane* above); recording
            an operator's run is weaker evidence than a runner executing it, and is not described as
            if CI had run it.
          - **Kernel project-quota enforcement is not exercised by CI.** This release records a
            local run of the real project-quota lane (see *Quota lane* above), with the same
            limits as the confinement record.
          NOTES
          echo '--- release notes ---'
          cat release-notes.md

      # `gh release create` uses this run's repository-scoped GITHUB_TOKEN. `--verify-tag` refuses
      # if the tag vanished between preflight and here.
      - name: Publish the GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES: ${{ steps.binary-source.outputs.present }}
        run: |
          set -euo pipefail
          case "$BINARIES" in
            true)
              assets=(
                "${BINARY_DIST}/assets/substrate-daemon-${VERSION}-${BINARY_TARGET}.tar.gz"
                "${BINARY_DIST}/assets/b10x-substrate-${VERSION}-${BINARY_TARGET}.tar.gz"
                "${BINARY_DIST}/assets/SHA256SUMS"
                "${BINARY_DIST}/assets/SHA256SUMS.sigstore.json"
              )
              for asset in "${assets[@]}"; do
                if [ ! -s "$asset" ]; then
                  echo "refused: release asset ${asset} is missing or empty." >&2
                  exit 1
                fi
              done
              ;;
            false) assets=() ;;
            *)
              echo "refused: no answer on whether this release carries binaries ('${BINARIES}')." >&2
              exit 1
              ;;
          esac
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            --draft \
            --verify-tag \
            "${assets[@]}"
          gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false

      # All artifact digests also belong in `CHANGELOG.md` under this version's heading (AGENTS.md,
      # section "Releases"). Protected `main` requires Full gate, so the release workflow neither
      # pushes it directly nor creates a GITHUB_TOKEN-authored PR whose events GitHub would suppress.
      # It emits the exact bot-PR body after every signature verifies and the GitHub release exists.
      - name: Describe the required changelog pull request
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
          SUMS_DIGEST: ${{ steps.binaries.outputs.sums-digest }}
          BINARIES: ${{ steps.binary-source.outputs.present }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          EXECUTOR: ${{ steps.executor-source.outputs.present }}
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
        run: |
          {
            echo "CHANGELOG.md is protected by the Full gate and is not pushed directly."
            echo "Open a bot-authored pull request adding:"
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` at \`${DIGEST}\`, keyless-signed; verify with \`cosign verify\`."
            echo "Contract bundle: \`${BUNDLE_IMAGE}:${BUNDLE_VERSION}\` at \`${BUNDLE_DIGEST}\`, annotated \`development\`, keyless-signed; verify with \`cosign verify\`."
            echo "Disposable MCP image: \`${MCP_IMAGE}:${VERSION}\` at \`${MCP_DIGEST}\`, development-only and keyless-signed; verify with \`cosign verify\`."
            if [ "$EXECUTOR" = true ]; then
              echo "Executor image: \`${EXECUTOR_IMAGE}:${VERSION}\` at \`${EXECUTOR_DIGEST}\`, keyless-signed; verify with \`cosign verify\`."
            else
              echo "Executor image: not published: the tagged source has no executor stage."
            fi
            if [ "$BINARIES" = true ]; then
              echo "Release binaries: \`substrate-daemon-${VERSION}-${BINARY_TARGET}.tar.gz\` and \`b10x-substrate-${VERSION}-${BINARY_TARGET}.tar.gz\` on the GitHub release, \`SHA256SUMS\` at \`${SUMS_DIGEST}\`, keyless-signed; verify with \`cosign verify-blob\`."
            else
              echo "Release binaries: not published: the tagged source has no release-binaries stage."
            fi
            if [ "$CHART" = present ]; then
              echo "Kubernetes chart: \`oci://${CHART_IMAGE}\` version \`${VERSION}\` at \`${CHART_DIGEST}\`, keyless-signed with build provenance; verify with \`cosign verify\` and \`gh attestation verify\`."
            else
              echo "Kubernetes chart: not published: the tagged source has no chart."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release summary
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
          MCP_DIGEST: ${{ steps.mcp-build.outputs.digest }}
          SUMS_DIGEST: ${{ steps.binaries.outputs.sums-digest }}
          BINARIES: ${{ steps.binary-source.outputs.present }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          EXECUTOR: ${{ steps.executor-source.outputs.present }}
          EXECUTOR_DIGEST: ${{ steps.executor-build.outputs.digest }}
        run: |
          case "$BINARIES" in
            true) binaries_row="\`${BINARY_TARGET}\`, SHA256SUMS \`${SUMS_DIGEST:-<not built>}\`" ;;
            false) binaries_row="not published: the tagged source has no release-binaries stage" ;;
            *) binaries_row="<undecided>" ;;
          esac
          {
            echo "### Release ${VERSION}"
            echo
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| image | \`${IMAGE}:${VERSION}\` |"
            echo "| digest | \`${DIGEST:-<not built>}\` |"
            echo "| development bundle | \`${BUNDLE_IMAGE}:${BUNDLE_VERSION}\` |"
            echo "| bundle digest | \`${BUNDLE_DIGEST:-<not built>}\` |"
            echo "| disposable MCP image | \`${MCP_IMAGE}:${VERSION}\` |"
            echo "| MCP digest | \`${MCP_DIGEST:-<not built>}\` |"
            echo "| executor image | \`${EXECUTOR_IMAGE}:${VERSION}\` (${EXECUTOR:-<undecided>}) |"
            echo "| executor digest | \`${EXECUTOR_DIGEST:-<not built>}\` |"
            echo "| release binaries | ${binaries_row} |"
            echo "| Kubernetes chart | \`${CHART_IMAGE}:${VERSION}\` (${CHART:-<undecided>}) |"
            echo "| chart digest | \`${CHART_DIGEST:-<not built>}\` |"
            echo "| SOURCE_SHA | \`${SOURCE_SHA}\` |"
            echo "| gate run | ${GATE_RUN_URL} |"
            echo "| chart lane run | ${CHART_LANE_RUN_URL:-<none>} |"
            echo "| chart lane absent, not passed | ${CHART_LANE_ABSENT:-<none>} |"
            echo "| namespace lane run | ${NAMESPACE_LANE_RUN_URL:-<none>} |"
            echo "| confinement lane | \`${CONFINEMENT_EVIDENCE:-<none recorded>}\` |"
            echo "| quota lane | \`${QUOTA_EVIDENCE:-<none recorded>}\` |"
            echo "| chart lane record | \`${CHART_EVIDENCE:-<none recorded>}\` |"
            echo "| namespace lane | \`${NAMESPACE_EVIDENCE:-<none recorded>}\` |"
            echo "| daemon signature step | ${{ steps.verify.outcome }} |"
            echo "| bundle signature step | ${{ steps.bundle-verify.outcome }} |"
            echo "| MCP signature step | ${{ steps.mcp-verify.outcome }} |"
            echo "| executor signature step | ${{ steps.executor-verify.outcome }} |"
            echo "| binaries signature step | ${{ steps.binaries-verify.outcome }} |"
            echo "| anonymous pull step | ${{ steps.anonymous.outcome }} |"
            echo "| MCP anonymous pull step | ${{ steps.mcp-anonymous.outcome }} |"
            echo "| executor anonymous pull step | ${{ steps.executor-anonymous.outcome }} |"
            echo "| chart signature step | ${{ steps.chart-verify.outcome }} |"
            echo "| chart provenance step | ${{ steps.chart-provenance.outcome }} |"
            echo "| chart anonymous pull step | ${{ steps.chart-anonymous.outcome }} |"
            echo "| release publication step | ${{ steps.publish.outcome }} |"
            echo
            echo "The published wire contract remains a **development** bundle; this release does not make it stable."
          } >> "$GITHUB_STEP_SUMMARY"
