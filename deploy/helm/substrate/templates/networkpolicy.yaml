apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "substrate.name" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "substrate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "substrate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.clients }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8443
    {{- end }}
    {{- with .Values.networkPolicy.scrapers }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
  egress:
    - to:
        - {{- toYaml .Values.networkPolicy.dns | nindent 10 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ .Values.identity.egress.cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ int .Values.identity.egress.port }}
    {{- range .Values.daemon.gitSources }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ int .port }}
    {{- end }}
    {{- range .Values.daemon.egressApertures }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ int .port }}
    {{- end }}
